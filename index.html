ura","subkategorie":"Plnění a výdej","souvisejici":"Rychlé plnění vodíku; Tlaková kaskáda; Vodíková čerpací stanice; Protokoly plnění s vysokým průtokem pro střední a těžká vozidla na plynný vodík","tagy":"Normy a standardy; Mobilita; Komponenty a zařízení","url":""},{"datum":"2026-03-30","pojem":"Sestava elektrolytických článků","doslovny":"Electrolyser stack","zkratka":"","popis":"Centrální jednotka elektrolyzéru tvořená svazkem elektrolytických článků, kde probíhá samotná reakce výroby vodíku.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Účinnost sestavy; Pomocné systémy elektrolyzéru","tagy":"Komponenty a zařízení; Palivové článkyK","url":""},{"datum":"2026-03-23","pojem":"Sezónní skladování vodíku","doslovny":"Seasonal hydrogen storage","zkratka":"","popis":"Dlouhodobé skladování vodíku v řádu týdnů až měsíců za účelem vyrovnávání sezónních rozdílů mezi výrobou energie z obnovitelných zdrojů a spotřebou. Umožňuje využít přebytečnou elektřinu vyrobenou v létě (vysoká solární výroba) k výrobě vodíku, který je následně spotřebován v zimních měsících.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Podzemní skladování vodíku; Kaverna; Solná kaverna; Power to hydrogen; Dunkelflaute","tagy":"Obchodní modely; Energetický trh","url":""},{"datum":"2025-08-12","pojem":"Simulace plnění vodíkem","doslovny":"Hydrogen Filling Simulation","zkratka":"H2FillS","popis":"Počítačový model simulující fyzikální procesy při plnění vodíkového vozidla — zejména termodynamiku, tlakové změny a tepelné jevy v nádrži. Slouží k optimalizaci plnicích protokolů, predikci chování systému a snížení nákladů na testování.","kategorie":"Věda a výzkum","subkategorie":"","souvisejici":"Protokol plnění; MC Formula; Hmotnostní průtok vodíku; Digitální dvojče","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-04-29","pojem":"Služby výkonové rovnováhy","doslovny":"Balancing services","zkratka":"SVR","popis":"Podpůrné služby zajišťující rovnováhu mezi výrobou a spotřebou elektřiny v přenosové soustavě v reálném čase, čímž předcházejí nestabilitě sítě a blackoutům. V kontextu vodíku jsou relevantní zejména pro elektrolyzéry, které díky své flexibilitě mohou tyto služby poskytovat a tím zlepšovat ekonomiku provozu.","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Obnovitelné zdroje energie; Elektrolyzér; Nabídková zóna; Utilizace elektrolyzéru","tagy":"Elektrolýza; Obchodní modely","url":""},{"datum":"2025-04-29","pojem":"Směrnice (EU) 2024/1788","doslovny":"Odkaz","zkratka":"","popis":"Směrnice EU stanovující společná pravidla pro vnitřní trh s plynem z obnovitelných zdrojů, zemním plynem a vodíkem. Upravuje práva spotřebitelů, podmínky certifikace nízkouhlíkových paliv, unbundling provozovatelů sítí a regulační rámec pro postupný přechod od fosilního plynu. Jako směrnice musí být transponována do národního práva členských států.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Nařízení (EU) 2024/1789; Vodíková přepravní síť; Míchání; Distribuční soustava","tagy":"Přeprava a distribuce; Obchodní modely; Certifikace","url":""},{"datum":"2026-03-30","pojem":"Směrnice ATEX","doslovny":"ATEX Directive","zkratka":"ATEX","popis":"Evropská směrnice regulující bezpečnost zařízení a pracovní prostředí v prostorách s nebezpečím výbuchu. V ČR zavedena jako NV č. 406/2004 Sb. Definuje výbušnostní zóny (zóna 0, 1, 2) a skupiny výbušnosti — vodík patří do nejvyšší skupiny IIC, která klade nejpřísnější požadavky na konstrukci zařízení.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Určování nebezpečných prostorů – Výbušné plynné atmosféry; Požárně nebezpečný prostor; Detekce vodíku; Zákon o bezpečnosti práce v souvislosti s provozem vyhrazených technických zařízení","tagy":"Certifikace; Plnění a výdej; Přeprava a distribuce","url":""},{"datum":"2025-04-29","pojem":"Směrnice EU ETS 2 (2023/959)","doslovny":"Odkaz","zkratka":"","popis":"Směrnice o vytvoření systému pro obchodování s povolenkami na emise skleníkových plynů v Unii a rozhodnutí (EU) 2015/1814 o vytvoření a uplatňování rezervy tržní stability pro systém Unie pro obchodování s povolenkami na emise skleníkových plynů.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Mechanismus uhlíkového vyrovnání na hranicích (2023/956); Delegovaný Akt k EU ETS (2024/873)","tagy":"Energetický trh; Certifikace; Náklady a financování","url":""},{"datum":"2025-04-29","pojem":"Směrnice o obnovitelných zdrojích energie","doslovny":"Renewable Energy Directive","zkratka":"RED III (2023/2413)","popis":"Směrnice EU o podpoře energie z obnovitelných zdrojů (třetí revize), která stanovuje závazný cíl 42,5 % podílu OZE v energetickém mixu EU do roku 2030. Pro vodík je klíčová zejména tím, že definuje pravidla pro výrobu RFNBO a stanovuje cíle pro jejich využití v dopravě a průmyslu","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Delegovaný Akt RFNBO (2023/1184); Zelený vodík; Adicionalita; Fit for 55","tagy":"Certifikace; Elektrolýza; Energetický trh","url":"Odkaz"},{"datum":"2025-05-22","pojem":"Směrnice o tlakových nádobách na přepravu","doslovny":"Transportable Pressure Equipment Directive","zkratka":"TPED","popis":"Směrnice EU (2010/35/EU) stanovující požadavky na konstrukci, výrobu, zkoušení a označování přepravitelných tlakových zařízení, včetně lahví, cisteren a kartuší na plyny. Ve vodíkových technologiích se vztahuje na přepravní nádoby pro stlačený a zkapalněný vodík.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Tlaková nádoba; Návěs; Směrnice o tlakových zařízeních","tagy":"Přeprava a distribuce; Skladování","url":""},{"datum":"2025-08-22","pojem":"Směrnice o tlakových zařízeních","doslovny":"Pressure Equipment Directive","zkratka":"PED","popis":"Směrnice EU (2014/68/EU) stanovující základní bezpečnostní požadavky pro navrhování, výrobu a uvádění na trh tlakových zařízení a sestav s maximálním dovoleným tlakem vyšším než 0,5 bar. Ve vodíkových technologiích se vztahuje na tlakové nádoby, potrubí, kompresory a další součásti infrastruktury.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Tlaková nádoba; Maximální přípustný pracovní tlak; Směrnice o tlakových nádobách na přepravu","tagy":"Komponenty a zařízení; Skladování","url":""},{"datum":"2026-03-30","pojem":"Smlouva o nákupu obnovitelné elektřiny","doslovny":"Renewable Power Purchase Agreement","zkratka":"PPA","popis":"Smluvní zajištění dodávek obnovitelné elektřiny mezi výrobcem energie a odběratelem. V kontextu vodíkového hospodářství klíčová podmínka pro splnění kritérií adicionalnosti, časové a geografické korelace dle pravidel RFNBO.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Adicionalita; Časová korelace; Geografická korelace; Zelený vodík","tagy":"Elektrolýza; Evropská legislativa a strategie","url":""},{"datum":"2026-03-30","pojem":"Smlouva o odběru","doslovny":"Offtake agreement","zkratka":"","popis":"Smluvní závazek mezi výrobcem vodíku a odběratelem, který garantuje odběr dohodnutého množství vodíku za předem stanovenou cenu po určité časové období. Klíčový nástroj projektového financování vodíkových projektů — bez smlouvy o odběru je obtížné získat bankovní financování. Snižuje riziko výrobce tím, že zajišťuje předvídatelný příjem.","kategorie":"Ekonomika a trh","subkategorie":"Obchodní modely","souvisejici":"Celoevropská vodíková aukce; Zelený bonus","tagy":"Energetický trh; Podpora a pobídky","url":""},{"datum":"2026-03-30","pojem":"Smlouva o rozdílu","doslovny":"Contract for Difference","zkratka":"CfD","popis":"Finanční nástroj pro podporu výroby energie z obnovitelných zdrojů, při kterém výrobce inkasuje nebo doplácí rozdíl mezi vysoutěženou referenční cenou a aktuální tržní cenou. Zajišťuje výrobci stabilní příjmy nezávisle na výkyvech trhu — při nízké tržní ceně dostane doplatek, při vysoké vrací přebytek. Aplikovatelný i na podporu výroby obnovitelného vodíku.","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"Zelený bonus; Celoevropská vodíková aukce","tagy":"Energetický trh; Evropská legislativa a strategie","url":""},{"datum":"2025-08-07","pojem":"Solná kaverna","doslovny":"","zkratka":"","popis":"Podzemní dutina vytvořená řízeným vyloužením solného ložiska vodou. Díky přirozené těsnosti soli, mechanické stabilitě a chemické inertnosti vůči vodíku jsou solné kaverny považovány za nejperspektivnější variantu velkoobjemového skladování vodíku.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Kaverna; Podzemní skladování vodíku; Vytěžená plynová pole; Plynojem","tagy":"Přeprava a distribuce","url":""},{"datum":"2026-03-30","pojem":"Spalné teplo","doslovny":"Higher Heating Value","zkratka":"HHV","popis":"Celkové množství tepla uvolněné spálením jednotkového množství paliva, včetně tepla z kondenzace vodní páry ve spalinách. U vodíku se používá jako základ pro výpočet a porovnání účinností systémů.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Výhřevnost; Účinnost sestavy; Účinnost systému","tagy":"Elektrolýza; Palivové články; Reformování; Termochemické procesy","url":""},{"datum":"2025-08-12","pojem":"Spojovací zařízení pro doplňování paliva pro pozemní vozidla na plynný vodík","doslovny":"Connecting devices for filling of gaseous hydrogen into land vehicles","zkratka":"EN ISO 17268","popis":"Evropská a mezinárodní norma, která specifikuje návrh, bezpečnost a provozní vlastnosti spojovacích zařízení (plnicích přípojek) pro doplňování plynného vodíku do pozemních vozidel","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Výdejní stojan; Infračervené datové rozhraní; Protokoly plnění pro lehká vozidla na plynný vodík","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2026-03-30","pojem":"Statická aukce","doslovny":"Sealed-bid auction","zkratka":"","popis":"Typ aukce, při které účastníci podávají své nabídky neveřejně a všechny jsou vyhodnoceny naráz po uplynutí stanoveného termínu. Účastníci nevidí nabídky ostatních, což eliminuje vzájemné ovlivňování. Využívá se pro svou jednoduchost v aukcích OZE i celoevropských vodíkových aukcích.","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"Dynamická aukce; Pay-as-bid aukce; Celoevropská vodíková aukce","tagy":"Energetický trh","url":""},{"datum":"2025-03-10","pojem":"Stav naplnění","doslovny":"State of Charge","zkratka":"SOC","popis":"Množství vodíku zbývajícího v zásobníku vyjádřené v procentech, kde 100 % odpovídá plně naplněnému zásobníku. Jedná se o klíčový parametr pro doplňování vodíku, zejména u vozidel s palivovými články, který udává, kolik paliva je k dispozici, a ovlivňuje strategie doplňování paliva.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Systém pro skladování stlačeného vodíku; Protokol plnění; Největší objem nádrže; Nominální pracovní tlak","tagy":"Fyzika; Normy a standardy; Mobilita","url":""},{"datum":"2025-03-12","pojem":"Stlačený plynný vodík","doslovny":"Compressed Gaseous Hydrogen","zkratka":"CGH₂","popis":"Vodík skladovaný a přepravovaný v plynném stavu pod vysokým tlakem, čímž se zvyšuje jeho hustota a umožňuje efektivnější skladování a přepravu. Nejběžnější tlakové třídy pro vozidla jsou 350 bar (H35) a 700 bar (H70), přičemž průmyslové zásobníky a přepravní trailery mohou pracovat s různými tlakovými úrovněmi.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Vysokotlaký vodík; Systém pro skladování stlačeného vodíku; Tlaková kaskáda; Plynný vodík","tagy":"Přeprava a distribuce; Plnění a výdej; Fyzika","url":""},{"datum":"2026-03-23","pojem":"Sušící jednotka","doslovny":"Hydrogen dryer","zkratka":"","popis":"Zařízení pro odstranění zbytkové vlhkosti z vyrobeného vodíku. Nezbytná součást výrobního procesu, zejména po elektrolýze, kde vodík vystupuje nasycený vodní párou. Suchý vodík je požadován pro splnění normy kvality paliva a ochranu navazujících komponent.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Elektrolyzér; Kvalita vodíku; Čistota vodíku; Filtrace plynů","tagy":"Komponenty a zařízení; Chemie","url":""},{"datum":"2026-03-23","pojem":"Svazek lahví","doslovny":"Cylinder bundle","zkratka":"","popis":"Soustava tlakových lahví spojených v společném rámu a propojených společným potrubím, sloužící k přepravě nebo skladování stlačeného vodíku.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Víceprvkový kontejner na plyn; Tlaková nádoba; Vysokotlaký zásobník; Přeprava vodíku","tagy":"Přeprava a distribuce; Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2026-03-23","pojem":"Syntetizér","doslovny":"Synthesis reactor","zkratka":"","popis":"Reaktor provádějící chemickou syntézu sloučenin z vodíku a dalších vstupních látek — nejčastěji CO₂. Základní komponenta při výrobě e-paliv, e-metanolu nebo e-metanu. Na rozdíl od reforméru nepřeměňuje uhlovodíky na vodík, ale naopak využívá vodík jako vstupní surovinu pro výrobu syntetických paliv.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Reformér; Syntéza metanolu; Metanizace; E-metanol; E-metan; Katalyzátor","tagy":"Alternativní nosiče; Chemie; Komponenty a zařízení","url":""},{"datum":"2026-03-23","pojem":"Syntéza metanolu","doslovny":"Methanol synthesis","zkratka":"","popis":"Chemický proces přeměny vodíku a oxidu uhličitého (CO₂) na metanol (CH₃OH) za přítomnosti katalyzátoru při vysokém tlaku a teplotě. Klíčový proces při výrobě e-metanolu v rámci Power-to-X technologií. Umožňuje využití přebytečné elektřiny z obnovitelných zdrojů a zachyceného CO₂ k výrobě kapalného syntetického paliva.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"E-metanol; Metanol; Metanizace; Power-to-Gas; Zachycování a využívání uhlíku; Katalyzátor","tagy":"Alternativní nosiče; Chemie; Certifikace","url":""},{"datum":"2026-03-19","pojem":"Syntézní plyn","doslovny":"Synthesis gas","zkratka":"Syngas","popis":"Směs plynů složená převážně z vodíku a oxidu uhelnatého, vznikající termochemickými procesy jako je zplyňování nebo parní reforming. Slouží jako meziprodukt pro výrobu vodíku, metanolu, amoniaku nebo syntetických paliv.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Zplyňování; Parní reforming; Vodík; Power-to-Methane; Autotermní reforming","tagy":"Chemie; Reformování; Alternativní nosiče","url":""},{"datum":"2025-03-10","pojem":"Systém pro skladování stlačeného vodíku","doslovny":"Compressed Hydrogen Storage System","zkratka":"CHSS","popis":"Integrovaný systém určený k uchovávání stlačeného vodíku na palubě vozidla, skládající se z tlakové nádoby, uzavíracích ventilů, TPRD a dalších bezpečnostních prvků. Systém je navržen tak, aby bezpečně udržel vodík pod vysokým tlakem (typicky H35 nebo H70) po celou dobu životnosti vozidla.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Tlaková nádoba; Stlačený plynný vodík; Nařízení o schvalování vozidel na vodíkový pohon; Stav naplnění","tagy":"Mobilita; Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-08-07","pojem":"Systém předchlazení plyn-kapalina","doslovny":"","zkratka":"","popis":"Strategie předchlazení využívaná v čerpacích stanicích na kapalný vodík (LHRS), při které se chladicí energie kapalného vodíku využívá k ochlazení plynného vodíku před jeho výdejem do nádrže vozidla. Oproti konvenčním chladicím systémům snižuje spotřebu energie a zjednodušuje infrastrukturu stanice.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Předchlazený vodík; Chladicí smyčka; Odpařovač okolního vzduchu; Kapalný vodík","tagy":"Fyzika; Komponenty a zařízení; Skladování","url":""},{"datum":"2026-03-30","pojem":"Systém vstupů a výstupů","doslovny":"Entry-Exit system","zkratka":"","popis":"Model přístupu k přepravní síti, ve kterém účastníci trhu rezervují přepravní kapacitu samostatně pro každý vstupní a výstupní bod soustavy, aniž by museli specifikovat konkrétní přepravní trasu. Obchodní transakce jsou tím odděleny od fyzických toků plynu nebo vodíku, což zvyšuje likviditu trhu a zjednodušuje obchodování.","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Virtuální obchodní bod","tagy":"Přeprava a distribuce; Podpora a pobídky","url":""},{"datum":"2025-08-07","pojem":"Šedý vodík","doslovny":"Grey Hydrogen","zkratka":"","popis":"Dříve používané označení pro vodík vyrobený z fosilních paliv (typicky parním reformingem metanu) bez zachycení oxidu uhličitého. Jde o výrobu s největší emisní stopou ze všech způsobů výroby vodíku. Pojem je dnes považován za zastaralý — v aktuální terminologii EU ho nahrazuje klasifikace podle emisní intenzity.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Modrý vodík; Zelený vodík; Parní reforming metanu; Nízkouhlíkový vodík","tagy":"Reformování; Termochemické procesy; Obchodní modely","url":""},{"datum":"2025-05-22","pojem":"Škrcení průtoku","doslovny":"","zkratka":"","popis":"Termodynamický děj, při kterém průchodem plynu nebo kapaliny přes zúžení (ventil, tryska, clona) dochází k trvalé tlakové ztrátě při zachování entalpie. U reálných plynů jako vodík je škrcení spojeno se změnou teploty.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Joule-Thomsonův jev; Tlaková ztráta; Redukční ventil; Joule-Thomsonův koeficient","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2025-03-10","pojem":"Teplotně aktivovaný odtlakovací ventil","doslovny":"Thermal Pressure Relief Device","zkratka":"TPRD","popis":"Bezpečnostní zařízení instalované na tlakové nádobě se stlačeným vodíkem, které se automaticky otevře při dosažení nastavené teploty (typicky 110 °C) a uvolní vodík z nádrže řízeným způsobem. Chrání nádobu před destruktivním selháním v případě požáru nebo nadměrného zahřátí — na rozdíl od pojistného ventilu reaguje na teplotu, nikoli na tlak.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Pojistný ventil; Odtlakovací komín; Odtlakování systému","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-08-12","pojem":"Termolýza","doslovny":"Thermolysis","zkratka":"","popis":"Chemický rozklad látky působením vysokých teplot bez použití elektrické energie nebo katalyzátoru. V kontextu výroby vodíku se termolýza vody považuje za perspektivní metodu — voda se při teplotách nad 2500 °C rozkládá přímo na vodík a kyslík, což klade vysoké nároky na materiály a technologie.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Hybridní termochemické cykly; Pyrolýza; Bio-termolýza","tagy":"Chemie","url":""},{"datum":"2025-08-12","pojem":"Testovací metody pro hodnocení parametrů plnění vodíku","doslovny":"Test methods for hydrogen fueling parameter evaluation","zkratka":"CSA HGV 4.3","popis":"Testovací metody pro hodnocení parametrů plnění vodíku. Používá se pro validaci protokolu MC Formula.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"MC Formula; Protokoly plnění pro lehká vozidla na plynný vodík; Protokol plnění","tagy":"Plnění a výdej; Mobilita","url":""},{"datum":"2026-03-16","pojem":"Testovací zařízení vodíkové čerpací stanice","doslovny":"Hydrogen Station Test Apparatus","zkratka":"HSTA","popis":"Specializované přenosné zařízení simulující vodíkové vozidlo za účelem ověření bezpečnosti, výkonu a funkčnosti vodíkových čerpacích stanic. Testuje soulad s normami ISO 19880-1, CSA HGV 4.3 a SAE J2601, včetně správných plnicích protokolů, předchlazení a rychlosti nárůstu tlaku.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Protokol plnění; Protokoly plnění pro lehká vozidla na plynný vodík; Testovací metody pro hodnocení parametrů plnění vodíku; Předchlazené tankování; Vodíková čerpací stanice","tagy":"Normy a standardy; Komponenty a zařízení","url":""},{"datum":"2026-03-23","pojem":"Tetrahydroboritan sodný","doslovny":"Sodium Borohydride","zkratka":"NaBH₄","popis":"Chemická sloučenina využívaná jako pevný nosič vodíku. Při reakci s vodou uvolňuje vodík, který lze využít pro palivové články. Výhodou je vysoká objemová hustota vodíku a bezpečná manipulace v pevném skupenství, nevýhodou jsou vysoké náklady a obtížná regenerace.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Kapalné organické nosiče vodíku; Deriváty vodíku; Hydridy kovů; Pevné skladování vodíku","tagy":"Skladování; Chemie","url":""},{"datum":"2025-08-12","pojem":"Tlaková adsorpce","doslovny":"Pressure swing adsorption","zkratka":"PSA","popis":"Cyklický proces čištění plynů, při kterém jsou nečistoty selektivně zachycovány na pevných adsorbentech při vysokém tlaku a následně uvolňovány při snížení tlaku. Ve vodíkových technologiích se používá k dosažení vysoké čistoty vodíku (typicky 99,999 %) například na výstupu z elektrolyzéru nebo parního reformingu.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Filtrace plynů; Membránový separátor; Zpětné získávání vodíku","tagy":"Fyzika; Chemie","url":""},{"datum":"2026-03-03","pojem":"Tlaková kaskáda","doslovny":"Cascade storage system","zkratka":"","popis":"Způsob skladování a plnění plynného vodíku, který využívá sérii tlakových nádob (bank) propojených do soustavy, jež jsou uspořádány podle různých úrovní tlaku (např. nízký, střední, vysoký).Tento systém umožňuje efektivní plnění vozidel (vysokotlakých nádrží) bez nutnosti neustálého chodu kompresoru, přičemž se využívá přirozeného tlakového spádu mezi zásobníkem a plněným vozidlem.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Komprese vodíku; Kompresor; Stlačený plynný vodík; Sekvenční plnění vodíku","tagy":"Plnění a výdej; Komponenty a zařízení; Fyzika","url":""},{"datum":"2025-03-10","pojem":"Tlaková nádoba","doslovny":"","zkratka":"","popis":"Nádoba konstruovaná pro skladování plynů nebo kapalin pod tlakem vyšším, než je atmosférický. Ve vodíkových technologiích se využívá ke skladování a přepravě stlačeného vodíku.                                             Rozlišujeme pět typů podle konstrukce:                         Typ I – celokovová nádoba, robustní a jednoduchá na výrobu. Vhodná pro stacionární aplikace.                                    Typ II – kovová vnitřní vložka s částečným kompozitním vinutím. Lehčí než Typ I.                                                      Typ III – kovová vnitřní vložka (zpravidla hliník) s plným obalem z uhlíkových vláken. Využívá se v automobilových a mobilních aplikacích.                                                       Typ IV – nekovová vnitřní vložka z kompozitních materiálů s obalem z uhlíkových vláken. Až o 70 % lehčí než Typ I, vhodný pro vysoké tlaky (700 bar).                   Typ V – bezvložková celokompozitní konstrukce. Nejlehčí varianta.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Systém pro skladování stlačeného vodíku; Maximální přípustný pracovní tlak; Nařízení o schvalování vozidel na vodíkový pohon; Kompozitní materiál","tagy":"Normy a standardy; Přeprava a distribuce; Mobilita","url":""},{"datum":"2026-03-23","pojem":"Tlaková nádoba stabilní","doslovny":"Fixed pressure vessel","zkratka":"TNS","popis":"Stacionární tlaková nádoba určená pro dlouhodobé uskladnění stlačeného plynu na pevném místě. Na rozdíl od přepravních tlakových nádob není určena k přepravě a podléhá specifickým normám pro stacionární tlakové zařízení.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Tlaková nádoba; Vysokotlaký zásobník; Tlaková kaskáda; Směrnice o tlakových zařízeních","tagy":"Komponenty a zařízení; Normy a standardy","url":""},{"datum":"2025-03-12","pojem":"Tlaková třída 350 bar","doslovny":"","zkratka":"H35","popis":"Třída plnění vodíkových nádrží tlakem 35 MPa (350 bar). Využívá se především u těžkých vozidel – autobusů, nákladních aut nebo vlků – kde větší objem nádrže kompenzuje nižší tlak.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Tlaková třída 700 bar; Protokoly plnění s vysokým průtokem pro střední a těžká vozidla na plynný vodík; Nominální pracovní tlak; Systém pro skladování stlačeného vodíku","tagy":"Normy a standardy; Mobilita; Skladování","url":""},{"datum":"2025-03-12","pojem":"Tlaková třída 700 bar","doslovny":"","zkratka":"H70","popis":"Třída plnění vodíkových nádrží tlakem 70 MPa (700 bar). Využívá se především u osobních a lehkých užitkových vozidel, kde vyšší tlak umožňuje uložit dostatečné množství vodíku v menším objemu nádrže.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Tlaková třída 350 bar; Protokoly plnění pro lehká vozidla na plynný vodík; Nominální pracovní tlak; Elektrické vozidlo s palivovým článkem","tagy":"Normy a standardy; Mobilita; Skladování","url":""},{"datum":"2025-03-10","pojem":"Tlaková ztráta","doslovny":"","zkratka":"","popis":"Pokles tlaku plynu nebo kapaliny při průchodu potrubím, ventily, výměníky nebo jinými prvky systému, způsobený třením a místními odpory. Ve vodíkových systémech je tlaková ztráta klíčový parametr při návrhu infrastruktury — ovlivňuje výkon kompresoru, tlakové podmínky na výstupu a celkovou energetickou bilanci.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Tlakový spád; Diferenciální tlak; Škrcení průtoku","tagy":"Plnění a výdej; Komponenty a zařízení; Přeprava a distribuce","url":""},{"datum":"2026-03-03","pojem":"Tlakový spád","doslovny":"","zkratka":"Δp","popis":"Pokles tlaku mezi dvěma body systému ve směru proudění. V kontextu vodíkových čerpacích stanic označuje postupný rozdíl tlaků mezi jednotlivými bankami kaskády, který umožňuje sekvenční plnění vozidla od nejníže tlakované banky.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Tlaková ztráta; Diferenciální tlak; Komprese vodíku","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2026-03-03","pojem":"Tmavá fermentace","doslovny":"Dark fermentation","zkratka":"","popis":"Biotechnologický proces, při němž specifické mikroorganismy rozkládají organické látky za nepřítomnosti světla a za anaerobních podmínek za vzniku vodíku (H₂) a oxidu uhličitého (CO₂). Na rozdíl od klasické anaerobní fermentace – využívané například na bioplynových stanicích k výrobě metanu – se proces záměrně zastaví před fází metanogeneze.","kategorie":"Výroba","subkategorie":"Biologické procesy","souvisejici":"Bio-vodík; Fotofermentace; Biofotolýza","tagy":"Chemie; Alternativní nosiče","url":""},{"datum":"2025-04-29","pojem":"Transevropská dopravní síť","doslovny":"Trans-European Transport Networks","zkratka":"TEN-T","popis":"Síť hlavní dopravní infrastruktury EU zahrnující železnice, silnice, vnitrozemské vodní cesty, námořní dopravu a terminály, spojující městské uzly, přístavy a letiště. V kontextu vodíku je TEN-T klíčová pro nařízení AFIR, které stanovuje povinnost vybudovat vodíkové čerpací stanice podél hlavních koridorů sítě TEN-T do roku 2031.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Nařízení o infrastruktuře pro alternativní paliva; Evropská vodíková páteřní soustava; Městské uzly","tagy":"Přeprava a distribuce; Mobilita; Plnění a výdej","url":""},{"datum":"2025-08-07","pojem":"Třífázové rozhraní","doslovny":"Three-phase interface","zkratka":"","popis":"Klíčová oblast v palivovém článku, kde se setkává plynné palivo, pevná elektroda a elektrolyt, což je nezbytné pro efektivní elektrochemické reakce.","kategorie":"Technologie využití vodíku","subkategorie":"Palivové články","souvisejici":"Palivový článek; Plynová difúzní vrstva; Membránová elektrodová sestava; Elektroda","tagy":"Chemie; Elektrolýza","url":""},{"datum":"2026-03-19","pojem":"Tyrkysový vodík","doslovny":"Turquoise hydrogen","zkratka":"","popis":"Dříve používané barevné označení pro vodík vyrobený pyrolýzou metanu, při níž vzniká pevný uhlík místo CO₂. Barevná klasifikace vodíku již není legislativně uznávána EU — v aktuálním rámci by tyrkysový vodík mohl spadat do kategorie nízkouhlíkového vodíku v závislosti na emisní stopě.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Pyrolýza; Nízkouhlíkový vodík; Šedý vodík; Modrý vodík","tagy":"Termochemické procesy","url":""},{"datum":"2026-03-30","pojem":"Účinnost sestavy","doslovny":"Stack efficiency","zkratka":"","popis":"Účinnost samotné sestavy elektrolytických článků, bez zahrnutí spotřeby pomocných systémů. Vyjadřuje se buď jako procento výhřevnosti vodíku (% LHV nebo HHV), nebo jako měrná spotřeba energie (kWh/kg H₂).","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Účinnost systému; Sestava elektrolytických článků; Spalné teplo; Výhřevnost","tagy":"Palivové články","url":""},{"datum":"2026-03-30","pojem":"Účinnost systému","doslovny":"System efficiency","zkratka":"","popis":"Celková účinnost systému výroby vodíku zahrnující spotřebu sestavy elektrolytických článků i všech pomocných zařízení. Reálnější ukazatel provozní výkonnosti než účinnost sestavy.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Účinnost sestavy; Pomocné systémy elektrolyzéru","tagy":"Náklady a financování","url":""},{"datum":"2026-03-16","pojem":"Udržitelné letecké palivo","doslovny":"Sustainable Aviation Fuel","zkratka":"SAF","popis":"Alternativní letecké palivo vyrobené z nefosilních zdrojů, které oproti konvenčnímu leteckému palivu výrazně snižuje emise CO₂ během celého životního cyklu. Zahrnuje paliva z biomasy, odpadů, e-paliva vyrobená z vodíku a CO₂ nebo syntetická paliva. Jejich využití je regulováno nařízením ReFuelEU Aviation.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"ReFuelEU Aviation (2023/2405); E-paliva; Kapalná a plynná paliva nebiologického původu","tagy":"Certifikace; Mobilita","url":""},{"datum":"2026-03-30","pojem":"Určování nebezpečných prostorů – Výbušné plynné atmosféry","doslovny":"","zkratka":"ČSN EN 60079-10-1","popis":"Technická norma stanovující postupy pro zařazování prostorů s nebezpečím výbuchu od hořlavých plynů nebo par do zón (0, 1, 2). Slouží jako základ pro správný výběr a instalaci zařízení v nebezpečných prostorech, včetně vodíkových technologií.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Směrnice ATEX; Požárně nebezpečný prostor","tagy":"Certifikace; Plnění a výdej; Přeprava a distribuce","url":""},{"datum":"2026-03-30","pojem":"Úspory emisí skleníkových plynů","doslovny":"GHG emissions savings","zkratka":"","popis":"Procentuální snížení emisí skleníkových plynů vyprodukovaných při výrobě a využití paliva v porovnání s fosilním komparátorem. Pro splnění podmínek RFNBO musí vodík dosáhnout alespoň 70% úspory oproti fosilnímu komparátoru stanoveného směrnicí RED na úrovni 94 g CO₂eq/MJ.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Fosilní komparátor; Emisní intenzita elektřiny; Zelený vodík; Delegovaný Akt RFNBO (2023/1184)","tagy":"Evropská legislativa a strategie","url":""},{"datum":"2025-04-29","pojem":"Utilizace elektrolyzéru","doslovny":"","zkratka":"","popis":"Podíl skutečně využitého výkonu elektrolyzéru vůči jeho maximální kapacitě, vyjádřený v procentech nebo hodinách ročně. Vysoká utilizace snižuje LCOH, protože fixní náklady se rozloží na více kilogramů vyrobeného vodíku.","kategorie":"Ekonomika a trh","subkategorie":"Náklady a financování","souvisejici":"Faktor využití; Elektrolyzér; Nivelizované náklady na vodík; Nivelizované náklady na elektřinu; Obnovitelné zdroje energie; Služby výkonové rovnováhy","tagy":"Elektrolýza","url":""},{"datum":"2025-03-10","pojem":"Ventil na nádrži","doslovny":"On-tank valve","zkratka":"OTV","popis":"Ventil nebo sestava ventilů instalovaných přímo na hrdle tlakové nádoby, zajišťující řízení průtoku, plnění a bezpečnostní funkce. Používá se pro různé druhy tlakových plynů. V kontextu vodíkových aplikací také označován jako HTV.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Ventil vodíkové nádrže; Pojistný ventil; Teplotně aktivovaný odtlakovací ventil","tagy":"Skladování; Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-03-10","pojem":"Ventil vodíkové nádrže","doslovny":"Hydrogen tank valve","zkratka":"HTV","popis":"Integrovaná sestava ventilů instalovaných na hrdle vysokotlaké vodíkové nádrže ve vozidlech, zahrnující pojistný ventil (TPRD), elektromagnetický ventil a zpětný ventil. Specifická implementace OTV pro vodíkovou mobilitu.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Ventil na nádrži; Pojistný ventil; Teplotně aktivovaný odtlakovací ventil","tagy":"Skladování; Plnění a výdej; Mobilita","url":""},{"datum":"2025-09-29","pojem":"Veřejná čerpací stanice vodíku","doslovny":"","zkratka":"","popis":"Čerpací stanice s otevřeným přístupem, určená široké veřejnosti bez nutnosti předchozího smluvního vztahu nebo oprávnění. Přijímá běžné platební metody za zveřejněných podmínek a cen. Obvykle se nachází na veřejně přístupném místě, je uváděna jako veřejný bod infrastruktury a poskytuje prodej komukoli z ulice.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Neveřejná čerpací stanice vodíku; Vodíková čerpací stanice; Nařízení o infrastruktuře pro alternativní paliva","tagy":"Mobilita; Obchodní modely; Normy a standardy","url":""},{"datum":"2026-03-03","pojem":"Víceprvkový kontejner na plyn","doslovny":"Multiple-Element Gas Container","zkratka":"MEGC","popis":"Specializované přepravní a skladovací zařízení tvořené svazkem vysokotlakých lahví nebo trubic upevněných ve společném rámu, určené pro hromadnou přepravu stlačených plynů. Na rozdíl od tube traileru je MEGC samostatný odnímatelný kontejner, který může být přepravován na návěsu nebo umístěn jako stacionární zásobník přímo u čerpací stanice.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Návěs; Přeprava vodíku; Stlačený plynný vodík; Tlaková nádoba","tagy":"Skladování; Plnění a výdej","url":""},{"datum":"2026-03-30","pojem":"Virtuální obchodní bod","doslovny":"Virtual trading point","zkratka":"VOB/VTP","popis":"Pomyslné místo v přepravní soustavě, kde obchodníci anonymně nakupují a prodávají plyn nebo vodík, aniž by museli fyzicky řešit konkrétní tok mezi vstupy a výstupy. Odděluje obchodní transakce od fyzické přepravy a zvyšuje likviditu trhu. V plynárenství zavedený koncept (v ČR provozuje OTE), postupně aplikovaný i na vznikající vodíkové trhy.","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Systém vstupů a výstupů","tagy":"Přeprava a distribuce; Podpora a pobídky","url":""},{"datum":"2026-03-23","pojem":"Vnitrozemská vodní doprava","doslovny":"Inland Waterway Transport","zkratka":"IWT","popis":"Přeprava osob a zboží po řekách, jezerech a kanálech. Představuje jeden z perspektivních sektorů pro využití vodíkového pohonu, zejména pro plavidla na kratších trasách kde je možné zajistit pravidelné plnění vodíkem.","kategorie":"Technologie využití vodíku","subkategorie":"Mobilita","souvisejici":"Vodíková mobilita; Palivový článek; Alternativní paliva; FuelEU Maritime","tagy":"Palivové články; Přeprava a distribuce","url":""},{"datum":"2025-03-10","pojem":"Vodík","doslovny":"Hydrogen","zkratka":"H₂","popis":"Nejlehčí chemický prvek, bezbarvý a bez zápachu, s vysokou hmotnostní energetickou hustotou. V přírodě se vyskytuje převážně vázaný v molekulách vody nebo uhlovodíků. V energetice slouží jako nosič energie. Může být přepravován v plynném stavu pod vysokým tlakem nebo ve zkapalněném stavu při velmi nízkých teplotách.","kategorie":"Věda a výzkum","subkategorie":"Chemie","souvisejici":"Elektrolýza; Palivový článek; Energetická hustota; Vodíkové hospodářství","tagy":"Fyzika; Certifikace; Elektrolýza","url":""},{"datum":"2025-03-10","pojem":"Vodíková čerpací stanice","doslovny":"Hydrogen Refueling Station (HRS)","zkratka":"VČS","popis":"Zařízení určené k tankování vodíku do vozidel s palivovými články. Zahrnuje kompresory, zásobníky, chladicí systém a výdejní stojan. Provozuje se zpravidla při tlaku 350 nebo 700 bar podle typu plněného vozidla.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Výdejní stojan; Kompresor; Tlaková kaskáda; Protokol plnění","tagy":"Mobilita; Komponenty a zařízení; Obchodní modely; Normy a standardy","url":""},{"datum":"2025-04-29","pojem":"Vodíková distribuční soustava","doslovny":"","zkratka":"","popis":"Potrubní síť zajišťující místní nebo regionální přepravu vodíku vysoké čistoty k přímo připojeným odběratelům. Na rozdíl od přepravní sítě nepřepravuje vodík na dlouhé vzdálenosti a není přímo napojena na skladovací zařízení ani vodíkové terminály.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Vodíková přepravní síť; Vodíková soustava; Distribuční soustava; Míchání","tagy":"Plnění a výdej; Obchodní modely; Evropská legislativa a strategie","url":""},{"datum":"2025-03-10","pojem":"Vodíková křehkost","doslovny":"Hydrogen embrittlement","zkratka":"","popis":"Degradace mechanických vlastností kovových materiálů způsobená absorpcí vodíku, projevující se snížením tažnosti a houževnatosti a zvýšeným rizikem praskání. Zásadní bezpečnostní faktor při návrhu potrubí, tlakových nádob a dalších komponent vodíkové infrastruktury.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Mezikrystalové praskání; Kvázi-štěpné lomy; X80 potrubní ocel; Kompozitní materiál","tagy":"Přeprava a distribuce; Skladování; Komponenty a zařízení","url":""},{"datum":"2026-03-23","pojem":"Vodíková mobilita","doslovny":"Hydrogen mobility","zkratka":"","popis":"Využití vodíku jako paliva v dopravě prostřednictvím palivových článků nebo spalovacích motorů. Zahrnuje osobní automobily, autobusy, nákladní vozidla, vlaky, lodě i letadla. Představuje klíčovou oblast dekarbonizace dopravy.","kategorie":"Technologie využití vodíku","subkategorie":"Mobilita","souvisejici":"Vodíkový pohon; Elektrické vozidlo s palivovým článkem; Vodíkové vozidlo s palivovým článkem; Vodíkové spalovací motory; Elektrický autobus s palivovým článkem; Bezemisní doprava; Vodíková mobilní zařízení","tagy":"Palivové články; Plnění a výdej; Evropská legislativa a strategie","url":""},{"datum":"2026-03-23","pojem":"Vodíková mobilní zařízení","doslovny":"Hydrogen mobile applications","zkratka":"","popis":"Přenosná nebo mobilní zařízení a dopravní prostředky využívající vodík jako zdroj energie prostřednictvím palivových článků nebo spalovacích motorů. Zahrnuje osobní automobily, nákladní vozidla, autobusy, vysokozdvižné vozíky, mobilní generátory elektřiny i mobilní čerpací stanice.","kategorie":"Technologie využití vodíku","subkategorie":"Mobilita","souvisejici":"Palivový článek; Elektrické vozidlo s palivovým článkem; Vodíková čerpací stanice; Bezemisní doprava","tagy":"Palivové články; Plnění a výdej","url":""},{"datum":"2026-03-19","pojem":"Vodíková plnicí infrastruktura","doslovny":"Hydrogen refuelling infrastructure","zkratka":"","popis":"Souhrnné označení pro síť zařízení a systémů umožňujících plnění vodíkových vozidel, zahrnující veřejné i neveřejné čerpací stanice, jejich komponenty a propojující distribuční infrastrukturu. Rozvoj vodíkové plnicí infrastruktury je regulován nařízením AFIR.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Vodíková čerpací stanice; Veřejná čerpací stanice vodíku; Neveřejná čerpací stanice vodíku; Nařízení o infrastruktuře pro alternativní paliva; Vodíková distribuční soustava","tagy": ":"","zkratka":"","popis":"Soubor vodíkové infrastruktury zahrnující přepravní a distribuční sítě, skladovací zařízení a vodíkové terminály. Pracuje s vodíkem vysoké čistoty a tvoří páteř pro výrobu, distribuci a dodávky vodíku koncovým odběratelům.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Vodíková přepravní síť; Vodíková distribuční soustava; Podzemní skladování vodíku; Vodíkový terminál","tagy":"Skladování; Obchodní modely; Plnění a výdej","url":""},{"datum":"2025-04-29","pojem":"Vodíková strategie ČR","doslovny":"","zkratka":"","popis":"Strategický dokument vlády ČR definující cíle a priority rozvoje vodíkového hospodářství, včetně výroby, infrastruktury, využití a financování. Stanovuje rámec pro národní akční plány a navazující legislativní opatření.","kategorie":"Legislativa a certifikace","subkategorie":"Národní legislativa a strategie","souvisejici":"Národní akční plán čisté mobility; Vodíkové hospodářství; Lex OZE III","tagy":"Obchodní modely; Elektrolýza; Evropská legislativa a strategie","url":""},{"datum":"2026-03-19","pojem":"Vodíková strategie pro klimaticky neutrální Evropu","doslovny":"A hydrogen strategy for a climate-neutral Europe","zkratka":"","popis":"Strategický dokument Evropské komise z roku 2020, který stanovuje vizi rozvoje vodíkového hospodářství v EU jako součást Zelené dohody pro Evropu. Definuje priority pro výrobu obnovitelného vodíku, rozvoj infrastruktury a vytvoření vodíkového trhu s cílem dosáhnout klimatické neutrality do roku 2050.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Fit for 55; Zelená dohoda pro Evropu; Vodíková strategie ČR; Evropská vodíková banka; Směrnice o obnovitelných zdrojích energie","tagy":"Energetický trh; Podpora a pobídky","url":"Odkaz"},{"datum":"2025-08-07","pojem":"Vodíkové hospodářství","doslovny":"","zkratka":"","popis":"Koncept energetického systému, ve kterém vodík slouží jako klíčový nosič energie pro zemní plyn klade vyšší nároky na materiály kvůli vodíkové křehkosti a těsnosti spojů.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Vodíková přepravní síť; Vodíková distribuční soustava; Vodíková křehkost; X80 potrubní ocel; Míchání","tagy":"Skladování; Evropská legislativa a strategie","url":""},{"datum":"2025-08-07","pojem":"Vodíkový dodavatelský řetězec","doslovny":"Hydrogen Supply Chain","zkratka":"HSC","popis":"Soubor procesů a infrastruktury zahrnující výrobu, skladování, přepravu, distribuci a konečné využití vodíku. Optimalizace celého řetězce je klíčová pro snižování LCOH a konkurenceschopnost vodíku vůči fosilním palivům.","kategorie":"Ekonomika a trh","subkategorie":"Obchodní modely","souvisejici":"Vodíkové hospodářství; Přeprava vodíku; Zelený vodík; Vodíkový podnik","tagy":"Přeprava a distribuce; Elektrolýza; Certifikace","url":""},{"datum":"2026-03-30","pojem":"Vodíkový plamen","doslovny":"Hydrogen flame","zkratka":"","popis":"Plamen vzniklý hořením vodíku, který je za běžných podmínek neviditelný pouhým okem, neboť nevyzařuje viditelné světlo. Jeho detekce vyžaduje speciální vybavení — termovizní kameru nebo plamennou sondu. Tato vlastnost představuje specifické bezpečnostní riziko při provozu vodíkové infrastruktury.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Detekce vodíku; Zahoření vodíku při odplynění; Směrnice ATEX","tagy":"Plnění a výdej; Přeprava a distribuce","url":""},{"datum":"2025-04-29","pojem":"Vodíkový podnik","doslovny":"","zkratka":"","popis":"Fyzická nebo právnická osoba vykonávající alespoň jednu z funkcí v rámci vodíkového hospodářství — výrobu, přepravu, dodávky, nákup nebo skladování vodíku nebo provoz vodíkového terminálu — a odpovídající za obchodní, technické nebo údržbářské úkoly s tím spojené. Nezahrnuje konečné zákazníky.","kategorie":"Ekonomika a trh","subkategorie":"Obchodní modely","souvisejici":"Směrnice (EU) 2024/1788; Vodíkový dodavatelský řetězec; Provozovatelé vodíkových přenosových sítí","tagy":"Přeprava a distribuce; Elektrolýza; Certifikace","url":""},{"datum":"2026-03-23","pojem":"Vodíkový pohon","doslovny":"Hydrogen propulsion","zkratka":"","popis":"Systém využívající vodík jako palivo pro pohon nebo výrobu energie, realizovaný prostřednictvím palivových článků nebo spalovacích motorů. Uplatňuje se napříč dopravou, průmyslem i energetikou.","kategorie":"Technologie využití vodíku","subkategorie":"","souvisejici":"Palivový článek; Vodíkové spalovací motory; Elektrické vozidlo s palivovým článkem; Vodíková mobilní zařízení","tagy":"Palivové články; Plnění a výdej","url":""},{"datum":"2025-04-29","pojem":"Vodíkový terminál","doslovny":"","zkratka":"","popis":"Zařízení sloužící k překládce a přeměně kapalného vodíku nebo amoniaku na plynný vodík pro vtláčení do vodíkové sítě, případně k opačnému procesu zkapalňování a nakládání. Zahrnuje podpůrné služby a dočasné skladování nezbytné pro přeměnu, ale nezahrnuje prostory určené pouze ke skladování.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Vodíková soustava; Ammoniak; Kapalný vodík; Přeprava vodíku","tagy":"Skladování; Alternativní nosiče","url":""},{"datum":"2026-03-19","pojem":"Vtláčecí jednotka","doslovny":"Injection unit","zkratka":"","popis":"Zařízení zajišťující kontrolované vtláčení vodíku do plynárenské sítě, nejčastěji za účelem míchání s zemním plynem. Reguluje tlak, průtok a koncentraci vodíku tak, aby byl dodržen maximální povolený podíl vodíku ve směsi a byla zajištěna bezpečnost a interoperabilita sítě.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Míchání; Distribuční soustava; Vodíková přepravní síť; Kompresor; Plynárenský balíček","tagy":"Alternativní nosiče; Certifikace","url":""},{"datum":"2026-03-23","pojem":"Výbušná atmosféra","doslovny":"Explosive atmosphere","zkratka":"","popis":"Směs vodíku se vzduchem v koncentračním rozmezí mezi dolní mezí výbušnosti (LEL) a horní mezí výbušnosti (UEL), při které může dojít k výbuchu při kontaktu se zdrojem zapálení. Pro vodík je toto rozmezí výjimečně široké — od 4 do 75 obj. %.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Dolní mez výbušnosti; Horní mez výbušnosti; Elektrostatický výboj; Inertizace; Odtlakovací komín","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2025-04-17","pojem":"Výdejní bod","doslovny":"","zkratka":"","popis":"Koncový prvek výdejního stojanu, kde dochází k fyzickému předání vodíku pod vysokým tlakem do palivové nádrže vozidla.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Výdejní stojan; Výdejní zařízení; Výdejní místo","tagy":"Mobilita; Normy a standardy","url":""},{"datum":"2025-04-17","pojem":"Výdejní místo","doslovny":"","zkratka":"","popis":"Vymezená část vodíkové čerpací stanice zahrnující veškerá výdejní zařízení a infrastrukturu potřebnou pro výdej paliva","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Výdejní bod; Výdejní stojan; Výdejní zařízení","tagy":"Mobilita; Normy a standardy","url":""},{"datum":"2025-04-17","pojem":"Výdejní stojan","doslovny":"","zkratka":"","popis":"Fyzický přístroj umožňující zákazníkovi přístup k palivu, zahrnující displej, platební terminál a hadici s výdejním bodem.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Výdejní zařízení; Spojovací zařízení pro doplňování paliva pro pozemní vozidla na plynný vodík; Infračervené datové rozhraní; Průtokoměr","tagy":"Mobilita; Komponenty a zařízení; Normy a standardy","url":""},{"datum":"2025-08-07","pojem":"Výdejní zařízení","doslovny":"","zkratka":"","popis":"Technologický celek v rámci výdejního místa, tvořený jedním nebo více výdejními stojany a jejich příslušenstvím.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Výdejní stojan; Spojovací zařízení pro doplňování paliva pro pozemní vozidla na plynný vodík; Hmotnostní průtok vodíku","tagy":"Mobilita; Komponenty a zařízení","url":""},{"datum":"2026-03-30","pojem":"Výhřevnost","doslovny":"Lower Heating Value","zkratka":"LHV","popis":"Množství tepla uvolněné spálením jednotkového množství paliva, bez zahrnutí tepla kondenzace vodní páry. U vodíku běžněji používaný ukazatel než spalné teplo, protože lépe odpovídá reálným podmínkám většiny aplikací.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Spalné teplo; Účinnost sestavy; Účinnost systému","tagy":"Elektrolýza; Palivové články; Reformování; Termochemické procesy","url":""},{"datum":"2026-03-23","pojem":"Výroba vodíku na místě","doslovny":"On-site hydrogen production","zkratka":"","popis":"Výroba vodíku přímo v místě spotřeby — nejčastěji elektrolyzérem instalovaným u čerpací stanice nebo průmyslového odběratele. Eliminuje potřebu přepravy vodíku a snižuje logistické náklady, ale vyžaduje vyšší investici do výrobního zařízení a připojení k elektrické síti.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Elektrolyzér; Vodíková čerpací stanice; Ostrovní řešení; Buffer; Zdroj vodíku","tagy":"Obchodní modely; Náklady a financování","url":""},{"datum":"2025-08-07","pojem":"Vysoce entropické slitiny","doslovny":"Highly Entropic Alloys","zkratka":"HEA","popis":"Kovové slitiny tvořené pěti nebo více prvky v přibližně rovnoměrném poměru, které díky vzájemnému působení prvků a deformaci krystalické mřížky vykazují unikátní mechanické a termodynamické vlastnosti. Ve vodíkových technologiích jsou zkoumány jako perspektivní materiál pro pevné skladování vodíku.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Intermetalické slitiny; Hydridy kovů; Pevné skladování vodíku","tagy":"Skladování; Fyzika; Chemie","url":""},{"datum":"2026-02-23","pojem":"Vysokotlaký vodík","doslovny":"","zkratka":"","popis":"Vodík stlačený na vysoký tlak, čímž se zvyšuje jeho objemová hustota a umožňuje efektivnější skladování a přepravu. V kontextu plnění vozidel se používají standardizované tlaky 350 bar (H35) a 700 bar (H70).","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Stlačený plynný vodík; Komprese vodíku; Tlaková kaskáda; Energetická hustota","tagy":"Přeprava a distribuce; Plnění a výdej; Fyzika","url":""},{"datum":"2026-03-19","pojem":"Vysokotlaký zásobník","doslovny":"High-pressure storage","zkratka":"","popis":"Tlaková nádoba nebo soustava nádob určená k uskladnění stlačeného vodíku při vysokém tlaku. Může být tvořena kaskádou tlakových nádob, svazky lahví nebo stacionárními nádobami. Také označován jako vysokotlaké uložiště.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Nízkotlaký zásobník; Tlaková nádoba; Tlaková kaskáda; Kompresor; Buffer","tagy":"Plnění a výdej; Komponenty a zařízení; Fyzika","url":""},{"datum":"2025-08-07","pojem":"Vytěžená plynová pole","doslovny":"","zkratka":"","popis":"Již vytěžená podzemní zásobníková ložiska zemního plynu nebo ropy, která lze po úpravě využít pro skladování vodíku. Oproti solným kavernám jsou geograficky rozšířenější, ale představují větší riziko z hlediska těsnosti a možné kontaminace vodíku zbytkovými uhlovodíky nebo mikrobiální aktivitou.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Kaverna; Solná kaverna; Podzemní skladování vodíku; Plynojem","tagy":"Přeprava a distribuce","url":""},{"datum":"2026-03-30","pojem":"Významné projekty společného evropského zájmu","doslovny":"Important Projects of Common European Interest","zkratka":"IPCEI","popis":"Nástroj EU umožňující členským státům společně financovat strategické projekty přesahující hranice jednotlivých států, u nichž by tržní selhání bránilo realizaci. V oblasti vodíku byly realizovány čtyři vlny: Hy2Tech (výroba a palivové články), Hy2Use (průmyslové využití), Hy2Infra (infrastruktura) a Hy2Move (mobilita).","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"","tagy":"Evropská legislativa a strategie","url":""},{"datum":"2025-08-07","pojem":"X80 potrubní ocel","doslovny":"","zkratka":"","popis":"Vysokopevnostní ocelová třída používaná pro plynovodní potrubí, zkoumaná z hlediska náchylnosti k vodíkové křehkosti. Klíčové téma při plánování vodíkové infrastruktury — jak pro míchání vodíku se zemním plynem, tak pro dedikovaná vodíková potrubí.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Vodíková křehkost; Mezikrystalové praskání; Kvázi-štěpné lomy","tagy":"Přeprava a distribuce; Komponenty a zařízení","url":""},{"datum":"2026-03-30","pojem":"Zahoření vodíku při odplynění","doslovny":"Hydrogen ignition during venting","zkratka":"","popis":"Provozní stav, při kterém dojde k zapálení vodíku unikajícího při řízeném odplynění potrubí nebo zařízení. Na rozdíl od havárie se jedná o předvídatelný a zvládnutelný provozní jev, nikoliv mimořádnou událost. Vodíkový plamen je neviditelný, proto je nutná detekce termovizí nebo plamennou sondou.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Vodíkový plamen; Detekce vodíku; Bezpečná vzdálenost","tagy":"","url":""},{"datum":"2026-03-10","pojem":"Zachycování a ukládání uhlíku","doslovny":"Carbon capture and storage","zkratka":"CCS","popis":"Soubor technologií umožňujících zachycení oxidu uhličitého (CO₂) z průmyslových zdrojů a jeho dlouhodobé uložení v geologických formacích, čímž zabraňuje jeho uvolnění do atmosféry. V kontextu vodíkových technologií se využívá především při výrobě nízkouhlíkového vodíku – například v kombinaci s parním reformingem metanu.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Modrý vodík; Parní reforming metanu; Zachycování a využívání uhlíku; Nízkouhlíkový vodík","tagy":"Certifikace; Reformování; Obchodní modely","url":""},{"datum":"2025-04-29","pojem":"Zachycování a využívání uhlíku","doslovny":"Carbon capture and utilization","zkratka":"CCU","popis":"Soubor technologií umožňujících zachycení oxidu uhličitého (CO₂) z průmyslových zdrojů a jeho další využití jako suroviny pro výrobu chemikálií, paliv nebo materiálů. V kontextu vodíkových technologií se zachycené CO₂ kombinuje s vodíkem při výrobě e-paliv, e-metanu nebo metanolu.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Zachycování a ukládání uhlíku; E-metan; Power-to-Methane","tagy":"Termochemické procesy; Certifikace; Reformování","url":""},{"datum":"2026-03-23","pojem":"Zachycování uhlíku z oceánu","doslovny":"Ocean Carbon Capture / Direct Ocean Capture","zkratka":"OCC / DOC","popis":"Technologie zachycování oxidu uhličitého z mořské vody nebo mořského prostředí, také označovaná jako Direct Ocean Capture (DOC). Zahrnuje přímé zachycování CO₂ rozpuštěného v mořské vodě i nepřímé metody jako stimulace mořských řas nebo přidávání minerálů. Na rozdíl od DAC pracuje s vyšší koncentrací CO₂, což může snižovat energetickou náročnost. V kontextu vodíkových technologií představuje potenciální zdroj CO₂ pro výrobu e-paliv.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Přímé zachycování CO₂ ze vzduchu; Zachycování a využívání uhlíku; Zachycování a ukládání uhlíku; E-metanol; E-metan","tagy":"Alternativní nosiče; Chemie; Certifikace","url":""},{"datum":"2026-03-30","pojem":"Zákon o bezpečnosti práce v souvislosti s provozem vyhrazených technických zařízení","doslovny":"","zkratka":"250/2021 Sb.","popis":"Zákon č. 250/2021 Sb. upravující požadavky na bezpečnost provozu vyhrazených technických zařízení a ochranu zdraví při práci. Pro vodíkovou infrastrukturu je klíčový prostřednictvím čtyř prováděcích nařízení vlády: NV č. 191/2022 Sb. (plynová zařízení — revize a skupiny), NV č. 192/2022 Sb. (tlaková zařízení — nádrže a potrubí), NV č. 190/2022 Sb. (elektrická zařízení — napájení a ochrana před bleskem) a NV č. 194/2022 Sb. (odborná způsobilost — kdo smí na zařízeních pracovat).","kategorie":"Legislativa a certifikace","subkategorie":"Národní legislativa a strategie","souvisejici":"Směrnice ATEX; Odborně způsobilá osoba","tagy":"Certifikace; Plnění a výdej; Přeprava a distribuce","url":""},{"datum":"2026-03-03","pojem":"Záruka původu","doslovny":"Guarantee of origin","zkratka":"GoO","popis":"Elektronický dokument sloužící k prokázání, že určité množství energie bylo vyrobeno z obnovitelných zdrojů energie. Vydává se na elektřinu, biometan, vodík nebo teplo. V České republice jsou záruky původu regulovány zákonem o podporovaných zdrojích energie; jejich vydáváním je pověřen operátor trhu OTE. Pojem je definován mimo jiné ve směrnici RED (čl. 2). Záruka původu vodíku se vydává na množství vodíku vyrobeného v ČR a dodaného do přepravní nebo distribuční soustavy, případně do čerpací stanice nebo výdejní jednotky, za období jednoho kalendářního měsíce.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Certifikát udržitelnosti; Zelený vodík; Adicionalita; Delegovaný Akt RFNBO (2023/1184)","tagy":"Elektrolýza; Energetický trh; Evropská legislativa a strategie","url":"Certifikáty udržitelnosti jsou často zaměňovány se zárukami původu. Jedná se však o dva odlišné nástroje: zatímco záruka původu dokládá, odkud energie pochází, certifikát udržitelnosti ověřuje, zda splňuje environmentální požadavky na udržitelnost."},{"datum":"2026-03-19","pojem":"Zdroj vodíku","doslovny":"Hydrogen source","zkratka":"","popis":"Vstupní bod přívodu vodíku do systému čerpací stanice. Může jím být elektrolyzér, návěs s MEGC, potrubní přípojka nebo lokální zásobník. Typ zdroje vodíku zásadně ovlivňuje provozní model a ekonomiku stanice.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Elektrolyzér; Návěs; Víceprvkový kontejner na plyn; Vodíková čerpací stanice; Vodíková distribuční soustava","tagy":"Elektrolýza; Přeprava a distribuce","url":""},{"datum":"2026-03-19","pojem":"Zelená dohoda pro Evropu","doslovny":"European Green Deal","zkratka":"","popis":"Soubor politických iniciativ Evropské komise z roku 2019 zaměřených na dosažení klimatické neutrality EU do roku 2050. Stanovuje rámec pro dekarbonizaci napříč odvětvími — energetikou, dopravou, průmyslem a zemědělstvím. Pro vodíkové hospodářství představuje klíčový zastřešující dokument, z něhož vychází Vodíková strategie pro klimaticky neutrální Evropu i navazující legislativa.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Vodíková strategie pro klimaticky neutrální Evropu; Fit for 55; EU Taxonomy (2020/852); Směrnice o obnovitelných zdrojích energie","tagy":"Energetický trh; Podpora a pobídky","url":"Odkaz"},{"datum":"2026-03-30","pojem":"Zelený bonus","doslovny":"Green bonus","zkratka":"","popis":"Příplatek k tržní ceně energie vyplácený výrobcům elektřiny nebo vodíku z obnovitelných zdrojů. Na rozdíl od pevné výkupní ceny závisí výsledný příjem výrobce na kombinaci tržní ceny a bonusu, čímž zachovává tržní motivaci. V českém prostředí upraven zákonem o podporovaných zdrojích energie (165/2012 Sb.).","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"Celoevropská vodíková aukce; Aukce jako služba; Lex OZE III","tagy":"Evropská legislativa a strategie; Energetický trh","url":""},{"datum":"2025-03-10","pojem":"Zelený vodík","doslovny":"Green hydrogen","zkratka":"","popis":"Vodík vyrobený elektrolýzou vody poháněnou elektřinou z obnovitelných zdrojů, vyznačující se velmi nízkou nebo nulovou uhlíkovou stopou. Patří do kategorie obnovitelného vodíku dle legislativy EU. Pro oficiální uznání musí splňovat kritéria stanovená Delegovaným Aktem RFNBO. Barevné označení již není legislativně uznáváno EU, ale v praxi se stále běžně používá.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Elektrolýza; Obnovitelný vodík; Kapalná a plynná paliva nebiologického původu; Záruka původu; Certifikát udržitelnosti","tagy":"Elektrolýza; Energetický trh; Obchodní modely","url":""},{"datum":"2025-08-12","pojem":"Zpětné získávání vodíku","doslovny":"Hydrogen recovery","zkratka":"","popis":"Proces zachycování a čištění vodíku z odpadních plynů nebo procesních proudů za účelem jeho opětovného využití. Zvyšuje celkovou účinnost systému a snižuje ztráty. Využívá se například při elektrolýze, reformingu nebo v průmyslových procesech kde vodík vzniká jako vedlejší produkt.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Tlaková adsorpce; Filtrace plynů; Membránový separátor","tagy":"Plnění a výdej; Elektrolýza","url":""},{"datum":"2025-03-10","pojem":"Zpětný ventil","doslovny":"","zkratka":"","popis":"Mechanický ventil umožňující průtok média pouze jedním směrem a zabraňující jeho zpětnému proudění. Ve vodíkové infrastruktuře chrání kompresory, elektrolyzéry a další komponenty před nežádoucím zpětným tokem vodíku.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Regulační ventil; Redukční ventil; Omezovač průtoku vodíku","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-08-12","pojem":"Zplyňování","doslovny":"Gasification","zkratka":"","popis":"Termochemický proces přeměny uhlíkatých materiálů — uhlí, biomasy nebo odpadů — na syntézní plyn (syngas) složený převážně z vodíku a oxidu uhelnatého. Vodík se následně získává separací nebo dalšími procesy jako je reakce vodního plynu.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Zplyňování uhlí; Pyrolýza; Bio-termolýza","tagy":"Certifikace; Biologické procesy; Chemie","url":""},{"datum":"2025-08-12","pojem":"Zplyňování uhlí","doslovny":"","zkratka":"","popis":"Termochemický proces přeměny uhlí na syntézní plyn (syngas) při vysokých teplotách a tlaku. Vyznačuje se vysokými emisemi CO₂","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Zplyňování; Modrý vodík; Parní reforming metanu; Zachycování a ukládání uhlíku","tagy":"Certifikace; Chemie","url":""}];

// Tab switching
function findTermData(label) {
  let d = DATA.find(i => i.pojem === label);
  if (!d) d = DATA.find(i => i.pojem && i.pojem.startsWith(label));
  if (!d) d = DATA.find(i => i.pojem && label.startsWith(i.pojem));
  return d;
}

function treeContainsTerm(node, pojem) {
  const td = findTermData(node.pojem || node.label);
  if (td && td.pojem === pojem) return true;
  if (node.children) return node.children.some(c => treeContainsTerm(c, pojem));
  return false;
}

function findTermInGroups(pojem) {
  return GROUPS.filter(g => treeContainsTerm(g.tree, pojem));
}

function buildTreeHTML(node, color, isRoot = false, highlightPojem = null) {
  const label = node.label;
  const termData = findTermData(node.pojem || label);
  const exists = !!termData;
  const isHighlighted = highlightPojem && termData && termData.pojem === highlightPojem;
  const abbr = node.abbr || (termData && termData.zkratka) || '';
  const classes = ['tree-node', isRoot ? 'root' : '', !exists ? 'missing' : '', isHighlighted ? 'highlighted' : ''].filter(Boolean).join(' ');
  const style = isRoot
    ? `background:${color.bg};color:${color.text};border-color:${color.border};`
    : isHighlighted ? `background:${color.bg};border-color:${color.border};color:${color.text};` : '';
  const onclick = exists && !isHighlighted
    ? `onclick="event.stopPropagation();navigateTo('${(termData.pojem).replace(/'/g, "\\'")}')"`
    : '';
  const title = !exists ? ' title="Pojem zatím není ve slovníku"' : '';

  const nodeHTML = `<span class="${classes}" style="${style}" ${onclick}${title}>
    <span class="tree-node-label">${label}</span>
    ${abbr ? `<span class="tree-node-abbr">${abbr}</span>` : ''}
    ${node.desc ? `<span style="font-size:0.65rem;opacity:0.6;margin-left:2px">${node.desc}</span>` : ''}
  </span>`;

  if (node.children && node.children.length > 0) {
    return `<li>${nodeHTML}<ul>${node.children.map(c => buildTreeHTML(c, color, false, highlightPojem)).join('')}</ul></li>`;
  }
  return `<li>${nodeHTML}</li>`;
}

function buildCardContextHTML(pojem) {
  const groups = findTermInGroups(pojem);
  if (groups.length > 0) {
    return groups.map(g => `
      <div class="kontext-group-title">${g.icon} ${g.name}</div>
      <div class="tree-wrap"><ul class="tree">${buildTreeHTML(g.tree, g.color, true, pojem)}</ul></div>
    `).join('<div style="margin-top:1rem"></div>');
  }
  // Fallback: linear kontext
  return buildKontextHTML(pojem) || '<div style="color:var(--muted);font-size:0.82rem">Kontext pro tento pojem není k dispozici.</div>';
}

function switchCardTab(btn, tabName) {
  event.stopPropagation();
  const body = btn.closest('.card-body');
  body.querySelectorAll('.card-tab').forEach(t => t.classList.toggle('active', t === btn));
  body.querySelectorAll('.card-tab-content').forEach(c => c.classList.toggle('hidden', c.dataset.tab !== tabName));
}
