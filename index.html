a čištění plynných směsí, při níž ochlazení na velmi nízké teploty způsobuje postupnou kondenzaci a oddělení jednotlivých složek na základě jejich rozdílných bodů varu. V kontextu vodíkových technologií se využívá k oddělení vodíku od jiných plynů nebo k jeho zkapalnění.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Frakční destilace; Kapalný vodík; Kryogenní technologie","tagy":"Skladování; Chemie","url":""},{"datum":"2025-03-10","pojem":"Kryogenní technologie","doslovny":"","zkratka":"","popis":"Technologie pracující s velmi nízkými teplotami, využívaná pro skladování kapalného vodíku.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Kapalný vodík; Podchlazený vodík; Čerpací stanice na kapalný vodík; Odpařovač okolního vzduchu","tagy":"Skladování; Fyzika; Přeprava a distribuce","url":""},{"datum":"2026-03-19","pojem":"Kvalita vodíkového paliva – Specifikace produktu","doslovny":"","zkratka":"ČSN ISO 14687","popis":"Technická norma stanovující požadavky na kvalitu vodíkového paliva pro pozemní vozidla a stacionární aplikace. Definuje přípustné limity nečistot jako vlhkost, kyslík, dusík nebo uhlovodíky, které by mohly poškodit palivové články nebo jiné komponenty.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Vodíkové palivo – Specifikace produktu a zabezpečení kvality – Aplikace PEM palivových článků pro silniční vozidla; Protokoly plnění pro lehká vozidla na plynný vodík; Vodíková čerpací stanice; Palivový článek; Analyzátor plynů","tagy":"Plnění a výdej;  Mobilita","url":""},{"datum":"2026-03-19","pojem":"Kvalita vodíku","doslovny":"","zkratka":"","popis":"Soubor parametrů definujících složení a vlastnosti vodíkového paliva, zahrnující čistotu, vlhkost, tlak a obsah nečistot jako kyslík, dusík nebo uhlovodíky. Požadavky jsou stanoveny normami ČSN ISO 14687 a ČSN EN 17124. Nedodržení může vést k degradaci komponent — zejména membrán palivových článků.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Čistota vodíku; Kvalita vodíkového paliva – Specifikace produktu; Vodíkové palivo – Specifikace produktu a zabezpečení kvality – Aplikace PEM palivových článků pro silniční vozidla; Analyzátor plynů; Filtrace plynů","tagy":"Plnění a výdej; Elektrolýza; Palivové články","url":""},{"datum":"2026-03-30","pojem":"Kvalitativní analýza rizik","doslovny":"Qualitative Risk Assessment","zkratka":"","popis":"Metoda hodnocení rizik využívající slovní nebo ordinální škály pro popis pravděpodobnosti a závažnosti možných nehod, bez použití číselných hodnot. Méně přesná než kvantitativní analýza rizik, ale rychlejší a méně náročná na data. Používá se v počátečních fázích hodnocení bezpečnosti vodíkové infrastruktury nebo tam, kde nejsou k dispozici dostatečná data.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Kvantitativní analýza rizik; Posuzování rizika","tagy":"Certifikace; Plnění a výdej; Přeprava a distribuce","url":""},{"datum":"2026-03-23","pojem":"Kvantitativní analýza rizik","doslovny":"Quantitative Risk Assessment","zkratka":"QRA","popis":"Systematická metoda hodnocení rizik spojených s provozem technických zařízení, kvantifikující pravděpodobnost a následky možných nehod. Ve vodíkové infrastruktuře se využívá při návrhu a povolování čerpacích stanic, elektrolyzérů a skladovacích zařízení k prokázání přijatelné úrovně bezpečnosti.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Posuzování rizika; Kvalitativní analýza rizik","tagy":"Certifikace; Plnění a výdej; Přeprava a distribuce","url":""},{"datum":"2025-08-07","pojem":"Kvázi-štěpné lomy","doslovny":"Quasi-cleavage fractures","zkratka":"QC","popis":"Typ lomu, který vykazuje rysy jak křehkého štěpení, tak tažného lomu, a je často pozorován u materiálů postižených vodíkovým křehnutím.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Vodíková křehkost; Mezikrystalové praskání; X80 potrubní ocel","tagy":"Přeprava a distribuce; Skladování","url":""},{"datum":"2025-04-29","pojem":"Lex OZE III","doslovny":"Zákon č. 458/2000 Sb.","zkratka":"","popis":"Soubor legislativních úprav energetického zákona transponujících do českého právního řádu nové aspekty jako komunitní energetiku či agregaci flexibility. Aktuální novela (LEX OZE III) přináší změny v oblastech ukládání energie, flexibility sítí a agregace, umožňuje spotřebitelům efektivněji řídit spotřebu a posiluje jejich ochranu.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Směrnice o obnovitelných zdrojích energie; Obnovitelné zdroje energie; Vodíková strategie ČR","tagy":"Elektrolýza; Certifikace; Národní legislativa a strategie","url":""},{"datum":"2026-03-16","pojem":"LEX plyn","doslovny":"","zkratka":"","popis":"Neformální označení pro českou novelu energetického zákona (zákon č. 223/2025 Sb.) transponující směrnici (EU) 2024/1788 do českého právního řádu. Upravuje pravidla pro provozovatele plynárenských a vodíkových sítí, certifikaci paliv a práva spotřebitelů v kontextu dekarbonizace plynárenství.","kategorie":"Legislativa a certifikace","subkategorie":"Národní legislativa a strategie","souvisejici":"Směrnice (EU) 2024/1788; Plynárenský balíček; Lex OZE III; Vodíková strategie ČR","tagy":"Certifikace; Přeprava a distribuce","url":""},{"datum":"2026-03-30","pojem":"Magnetická inspekce únikem toku","doslovny":"Magnetic Flux Leakage","zkratka":"MFL","popis":"Nedestruktivní inspekční metoda pro detekci koroze, trhlin nebo jiných defektů v ocelovém potrubí. Princip spočívá v magnetizaci stěny potrubí a měření úniku magnetického toku v místech defektů. Používá se pro kontrolu integrity vodíkových plynovodů a přepravní infrastruktury.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Vodíková křehkost; Posuzování rizika","tagy":"Normy a standardy","url":""},{"datum":"2025-03-10","pojem":"Manometr","doslovny":"","zkratka":"","popis":"Přístroj k měření tlaku plynu nebo kapaliny v systému. Ve vodíkových technologiích se využívá pro monitorování tlaku v různých částech infrastruktury — od kompresorů a zásobníků až po výdejní systém.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Diferenciální tlak; Maximální pracovní tlak; Průtokoměr; Nominální pracovní tlak","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-09-29","pojem":"Maximální pracovní tlak","doslovny":"Maximum working pressure","zkratka":"MWP","popis":"Nejvyšší tlak, kterému může být čerpací stanice vodíku v daném místě technologie vystavena během provozu bez ohledu na teplotu vodíku a před aktivací bezpečnostních prvků (např. pojistných ventilů), které brání jeho překročení.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Maximální přípustný pracovní tlak; Nominální pracovní tlak; Palivový koridor; Tlaková nádoba","tagy":"Plnění a výdej; Skladování; Komponenty a zařízení","url":""},{"datum":"2025-03-10","pojem":"Maximální přípustný pracovní tlak","doslovny":"The Maximum Allowable Working Pressure","zkratka":"MAWP","popis":"Nejvyšší tlak, při kterém smí být tlaková nádoba nebo zařízení bezpečně provozováno. Stanovuje se na základě konstrukčních parametrů nádoby a je definován příslušnými normami a směrnicemi (např. PED, TPED). Překročení MAWP může vést k selhání nádoby a představuje bezpečnostní riziko.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Maximální pracovní tlak; Tlaková nádoba; Pojistný ventil; Směrnice o tlakových zařízeních","tagy":"Skladování; Komponenty a zařízení; Plnění a výdej","url":""},{"datum":"2025-03-12","pojem":"MC Formula","doslovny":"","zkratka":"","popis":"Vzorec MC (formula) využívá teplotu a tlak paliva na čerpací stanici, okolní teplotu, kategorii kapacity CHSS a počáteční tlak CHSS k výpočtu vhodných parametrů tankování v reálném čase po celou dobu tankování (je zahrnut v protokolech plnění SAE J2601).","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Protokoly plnění pro lehká vozidla na plynný vodík; Protokol plnění; Testovací metody pro hodnocení parametrů plnění vodíku; Hmotnostní průtok vodíku","tagy":"Plnění a výdej; Fyzika","url":""},{"datum":"2026-03-23","pojem":"Mechanická rozpojka","doslovny":"Breakaway coupling","zkratka":"","popis":"Bezpečnostní prvek plnicí přípojky, který se automaticky rozpojí při nadměrném tahu — například při ujetí vozidla s připojenou hadicí. Zabraňuje poškození výdejního stojanu a úniku vodíku. Po rozpojení automaticky uzavře oba konce spoje.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Plnicí přípojka; Plnicí rychlospojka; Výdejní stojan; Pojistný ventil","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-04-29","pojem":"Mechanismus uhlíkového vyrovnání na hranicích (2023/956)","doslovny":"Carbon border adjustment mechanism","zkratka":"CBAM","popis":"Nařízení EU (2023/956) ukládající povinnost platit za emise CO₂ obsažené v dovozu uhlíkově náročných produktů — oceli, cementu, hliníku, hnojiv a elektřiny — do EU. Cílem je zabránit tzv. úniku uhlíku, kdy by výrobci přesouvali produkci do zemí s mírnější klimatickou regulací. Neformálně označováno jako uhlíkové clo.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Směrnice EU ETS 2 (2023/959); Delegovaný Akt k EU ETS (2024/873)","tagy":"Energetický trh; Náklady a financování","url":"Odkaz"},{"datum":"2025-03-10","pojem":"Membránová elektrodová sestava","doslovny":"Membrane Electrode Assembly","zkratka":"MEA","popis":"Membránová elektrodová sestava (MEA) je klíčovou součástí palivových článků a elektrolyzérů, která funguje jako „srdce“, kde dochází k elektrochemickým reakcím. Jedná se o vrstvenou strukturu, která se obvykle skládá z protonové výměnné membrány (PEM), katalytických vrstev a vrstev pro difúzi plynů (GDL). MEA usnadňuje separaci elektronů a protonů, což umožňuje výrobu elektřiny v palivových článcích nebo výrobu vodíku v elektrolyzérech.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Protonová výměnná membrána; Elektrolyzér; Palivový článek; Elektroda","tagy":"Palivové články; Chemie; Materiály","url":""},{"datum":"2025-03-10","pojem":"Membránový separátor","doslovny":"","zkratka":"","popis":"Zařízení využívající semipermeabilní membrány k oddělení složek plynné směsi na základě rozdílné propustnosti membrány pro jednotlivé plyny. Ve vodíkových technologiích se používá zejména k čištění a separaci vodíku z procesních plynů.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Filtrace plynů; Tlaková adsorpce; Protonová výměnná membrána","tagy":"Elektrolýza; Chemie","url":""},{"datum":"2026-03-23","pojem":"Měření a regulace","doslovny":"Instrumentation and Control","zkratka":"MaR","popis":"Soubor technických prostředků a systémů zajišťujících měření fyzikálních veličin — tlaku, teploty, průtoku — a automatické řízení procesů ve vodíkové infrastruktuře. Klíčová součást bezpečného a efektivního provozu vodíkových čerpacích stanic a elektrolyzérů.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Kompresor; Průtokoměr; Manometr; Adaptivní regulace; Detekce vodíku","tagy":"Plnění a výdej; Elektrolýza","url":""},{"datum":"2025-04-29","pojem":"Městské uzly","doslovny":"","zkratka":"","popis":"Významná městská centra (zpravidla krajská města nebo města s více než 100 000 obyvateli) definovaná v rámci transevropské dopravní sítě (TEN-T). Nařízení AFIR ukládá členským státům povinnost zajistit v městských uzlech minimální hustotu dobíjecí a plnicí infrastruktury pro alternativní paliva, včetně vodíku.","kategorie":"Legislativa a certifikace","subkategorie":"Národní legislativa a strategie","souvisejici":"Transevropská dopravní síť; Nařízení o infrastruktuře pro alternativní paliva; Národní akční plán čisté mobility","tagy":"Plnění a výdej; Mobilita; Evropská legislativa a strategie","url":""},{"datum":"2026-03-23","pojem":"Metan","doslovny":"Methane","zkratka":"CH₄","popis":"Nejjednodušší uhlovodík (CH₄), bezbarvý a bez zápachu, hlavní složka zemního plynu. Ve vodíkových technologiích slouží jako surovina pro výrobu vodíku parním reformingem nebo jako produkt metanizace při Power-to-Gas procesech","kategorie":"Věda a výzkum","subkategorie":"Chemie","souvisejici":"E-metan; Parní reforming metanu; Power-to-Methane; Míchání; Metanizace","tagy":"Reformování; Alternativní nosiče; Přeprava a distribuce","url":""},{"datum":"2026-03-23","pojem":"Metanizace","doslovny":"Methanation","zkratka":"","popis":"Chemický proces přeměny vodíku a oxidu uhličitého (CO₂) na metan (CH₄) a vodu za přítomnosti katalyzátoru. Klíčový proces při výrobě e-metanu v rámci Power-to-Gas technologií. Umožňuje využití přebytečné elektřiny z obnovitelných zdrojů a zachyceného CO₂ k výrobě syntetického plynu kompatibilního se stávající plynárenskou infrastrukturou.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"E-metan; Metan; Power-to-Methane; Power-to-Gas; Zachycování a využívání uhlíku; Katalyzátor","tagy":"Alternativní nosiče; Chemie; Certifikace","url":""},{"datum":"2026-03-23","pojem":"Metanol","doslovny":"Methanol","zkratka":"CH₃OH","popis":"Nejjednodušší alkohol (CH₃OH), bezbarvá kapalina s charakteristickým zápachem. Ve vodíkových technologiích slouží jako alternativní nosič vodíku a surovina pro výrobu syntetických paliv. Lze ho také přímo využít v metanolových palivových článcích.","kategorie":"Věda a výzkum","subkategorie":"Chemie","souvisejici":"E-metanol; E-metanol; Deriváty vodíku; Kapalné organické nosiče vodíku","tagy":"Alternativní nosiče; Přeprava a distribuce","url":""},{"datum":"2026-03-23","pojem":"Metanolový palivový článek","doslovny":"Direct Methanol Fuel Cell","zkratka":"DMFC","popis":"Palivový článek využívající metanol přímo jako palivo bez předchozího reformování na vodík. Metanol reaguje elektrochemicky na anodě za vzniku elektřiny, CO₂ a vody. Výhodou je jednodušší skladování a manipulace s kapalným palivem oproti vodíku, nevýhodou nižší účinnost a emise CO₂.","kategorie":"Technologie využití vodíku","subkategorie":"Palivové články","souvisejici":"Palivový článek; Metanol; E-metanol; Membránová elektrodová sestava; Protonová výměnná membrána","tagy":"Chemie; Mobilita","url":""},{"datum":"2026-03-30","pojem":"Mezičasová alokace nákladů","doslovny":"Inter-temporal cost allocation","zkratka":"ICA","popis":"Regulatorní koncept pro financování vodíkové přepravní infrastruktury, při kterém jsou počáteční vysoké náklady na výstavbu sítě rozloženy v čase a přenášeny na budoucí uživatele. Zabraňuje tomu, aby první uživatelé nesli nepřiměřeně vysoké náklady v období nízké využitelnosti sítě. Na evropské úrovni se tématem zabývá ACER.","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"Agentura Evropské unie pro spolupráci energetických regulačních orgánů; Náběhový tarif; Systém vstupů a výstupů; Desetiletý plán rozvoje sítě","tagy":"Energetický trh; Evropská legislativa a strategie; Přeprava a distribuce","url":""},{"datum":"2025-08-07","pojem":"Meziklusterová doprava","doslovny":"","zkratka":"","popis":"Přeprava vodíku mezi různými regionálními vodíkovými klastry (tzv. vodíkovými údolími). Meziklusterová doprava je klíčová pro vyrovnávání nabídky a poptávky mezi oblastmi s přebytkem výroby a oblastmi s vysokou spotřebou.","kategorie":"Legislativa a certifikace","subkategorie":"Národní legislativa a strategie","souvisejici":"Vodíkové údolí; Přeprava vodíku; Návěs; Víceprvkový kontejner na plyn","tagy":"Přeprava a distribuce; Obchodní modely","url":""},{"datum":"2025-08-07","pojem":"Mezikrystalové praskání","doslovny":"Intercrystalline cracking","zkratka":"IC","popis":"Typ materiálového lomu, při kterém trhlina postupuje podél hranic krystalických zrn, nikoli jejich středem. Ve vodíkových technologiích se vyskytuje jako jeden z projevů vodíkového křehnutí — vodík difunduje do materiálu a oslabuje vazby na hranicích zrn, což vede k praskání při nižších napětích než u nepostiženého materiálu.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Vodíková křehkost; Kvázi-štěpné lomy; X80 potrubní ocel","tagy":"Přeprava a distribuce; Skladování","url":""},{"datum":"2026-03-23","pojem":"Mezinárodní námořní organizace","doslovny":"International Maritime Organization","zkratka":"IMO","popis":"Specializovaná agentura OSN odpovědná za bezpečnost a ochranu životního prostředí v námořní dopravě. Vydává mezinárodní předpisy a normy pro lodní dopravu, včetně IGF předpisu pro lodě na alternativní paliva jako vodík nebo LNG.","kategorie":"Instituce a organizace","subkategorie":"","souvisejici":"Mezinárodní předpis pro lodě využívající plynná paliva; FuelEU Maritime; Alternativní paliva","tagy":"Evropská legislativa a strategie; Mobilita","url":""},{"datum":"2026-03-23","pojem":"Mezinárodní předpis pro lodě využívající plynná paliva","doslovny":"International Code of Safety for Ships Using Gases or Other Low-Flashpoint Fuels","zkratka":"IGF","popis":"Mezinárodní předpis IMO stanovující bezpečnostní požadavky pro lodě využívající plynná paliva nebo jiná paliva s nízkým bodem vzplanutí, včetně vodíku a LNG. Upravuje konstrukci, instalaci a provoz palivových systémů na palubě.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Vnitrozemská vodní doprava; FuelEU Maritime; Alternativní paliva; Evropská dohoda o mezinárodní silniční přepravě nebezpečných","tagy":"Mobilita; Přeprava a distribuce","url":""},{"datum":"2026-03-19","pojem":"Mezisklad vodíku","doslovny":"Hydrogen buffer storage","zkratka":"","popis":"Dočasné skladovací zařízení umístěné mezi výrobou a distribucí nebo spotřebou vodíku, sloužící k vyrovnávání rozdílů mezi výrobou a odběrem. Umožňuje kontinuální provoz čerpacích stanic nebo průmyslových odběratelů i při přerušované výrobě — například při výrobě z OZE.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Tlaková kaskáda; Elektrolyzér; Vodíková čerpací stanice; Obnovitelné zdroje energie","tagy":"Plnění a výdej; Elektrolýza; Přeprava a distribuce","url":""},{"datum":"2025-04-29","pojem":"Míchání","doslovny":"Blending","zkratka":"","popis":"Přimíchávání vodíku do zemního plynu v plynárenské soustavě jako způsob jeho distribuce a postupné dekarbonizace. Provádí se vstřikováním nebo vtláčením vodíku do existující infrastruktury, přičemž maximální přípustný podíl vodíku je omezen materiálovými vlastnostmi potrubí a spotřebičů.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Distribuční soustava; Power-to-Gas; E-metan; Směrnice (EU) 2024/1788","tagy":"Alternativní nosiče; Certifikace; Skladování","url":""},{"datum":"2026-03-23","pojem":"Mikrokogenerační jednotka","doslovny":"Micro Combined Heat and Power unit","zkratka":"","popis":"Kompaktní kogenerační jednotka pro decentralizovanou výrobu elektřiny a tepla přímo v místě spotřeby, typicky do 50 kW elektrického výkonu. Určena pro rodinné domy, bytové domy nebo menší firmy. Jako palivo může využívat zemní plyn, bioplyn nebo vodík — v případě vodíku nejčastěji prostřednictvím palivového článku.","kategorie":"Technologie využití vodíku","subkategorie":"Palivové články","souvisejici":"Palivový článek; Palivové články s pevnými oxidy; Palivové články s protonově výměnnou membránou; Kombinovaná výroba elektřiny a tepla","tagy":"Energetický trh; Obchodní modely","url":""},{"datum":"2025-08-07","pojem":"Modrý vodík","doslovny":"Blue Hydrogen","zkratka":"","popis":"Dříve používané označení pro vodík vyrobený z fosilních paliv (typicky parním reformingem metanu) v kombinaci se zachycením oxidu uhličitého (CCS). Pojem je dnes považován za zastaralý — v aktuální terminologii EU ho nahrazuje označení nízkouhlíkový vodík, které je technologicky neutrální a vázané na konkrétní emisní práh.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Šedý vodík; Zelený vodík; Nízkouhlíkový vodík; Zachycování a ukládání uhlíku; Parní reforming metanu","tagy":"Reformování; Termochemické procesy; Obchodní modely","url":""},{"datum":"2026-03-30","pojem":"Náběhový tarif","doslovny":"Ramp-up tariff","zkratka":"","popis":"Specifický regulační nástroj pro ranou fázi rozvoje vodíkového trhu, který umožňuje provozovatelům sítí účtovat nižší tarify za přepravu vodíku v období, kdy je využití sítě nízké. Cílem je přilákat první odběratele a výrobce a podpořit rozjezd trhu. Dobře zdokumentovaný na německém příkladu.","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"Systém vstupů a výstupů; Desetiletý plán rozvoje sítě","tagy":"Energetický trh; Evropská legislativa a strategie; Přeprava a distribuce","url":""},{"datum":"2025-04-29","pojem":"Nabídková zóna","doslovny":"Bidding zone","zkratka":"","popis":"Geografická oblast, ve které mají účastníci trhu neomezený přístup k přenosové soustavě bez nutnosti řešit přetížení sítě. V kontextu výroby obnovitelného vodíku je nabídková zóna klíčová pro splnění požadavku geografické korelace — elektrolyzér musí odebírat elektřinu ze stejné nabídkové zóny jako obnovitelný zdroj, ze kterého čerpá.","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Geografická korelace; Obnovitelné zdroje energie; Agentura Evropské unie pro spolupráci energetických regulačních orgánů","tagy":"Certifikace; Evropská legislativa a strategie","url":""},{"datum":"2026-03-16","pojem":"Nanokatalyzátory","doslovny":"Nanocatalysts","zkratka":"","popis":"Katalyzátory v nanometrovém měřítku (1–100 nm) s výrazně vyšší katalytickou aktivitou oproti konvenčním katalyzátorům díky extrémně vysokému poměru aktivního povrchu k objemu. Ve vodíkových technologiích se využívají zejména v elektrolyzérech a palivových článcích, kde umožňují snížit množství drahých kovů (platina, iridium) při zachování vysokého výkonu.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Katalyzátor; Membránová elektrodová sestava; Elektrolyzér; Palivový článek","tagy":"Elektrolýza; Palivové články; Chemie","url":""},{"datum":"2025-04-29","pojem":"Národní akční plán čisté mobility","doslovny":"","zkratka":"NAP CM","popis":"Strategický dokument, kterým členské státy EU plní povinnost stanovenou směrnicí 2014/94/EU — definovat cíle a opatření pro rozvoj infrastruktury alternativních paliv, včetně dobíjecích a čerpacích stanic pro elektromobily a vodíková vozidla. V České republice NAP CM stanovuje konkrétní milníky pro výstavbu vodíkových čerpacích stanic na síti TEN-T a v městských uzlech.","kategorie":"Legislativa a certifikace","subkategorie":"Národní legislativa a strategie","souvisejici":"Vodíková strategie ČR; Nařízení o infrastruktuře pro alternativní paliva; Transevropská dopravní síť","tagy":"Mobilita; Plnění a výdej; Evropská legislativa a strategie","url":""},{"datum":"2025-04-29","pojem":"Nařízení (EU) 2024/1789","doslovny":"Odkaz","zkratka":"","popis":"Nařízení EU stanovující technická pravidla pro přístup k plynárenským a vodíkovým sítím, přeshraniční kapacity a podmínky pro připojení plynu z obnovitelných zdrojů a vodíku do infrastruktury. Na rozdíl od směrnice 2024/1788 platí přímo ve všech členských státech bez nutnosti transpozice.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Směrnice (EU) 2024/1788; Vodíková přepravní síť; Provozovatelé vodíkových přenosových sítí","tagy":"Přeprava a distribuce; Energetický trh","url":""},{"datum":"2025-04-29","pojem":"Nařízení o infrastruktuře pro alternativní paliva","doslovny":"Alternative fuels infrastructure regulation","zkratka":"AFIR","popis":"Nařízení EU (AFIR) stanovující závazné cíle pro výstavbu infrastruktury alternativních paliv v členských státech. Konkrétně určuje minimální hustotu dobíjecích bodů pro elektromobily a čerpacích stanic pro vodík a LNG na síti TEN-T a v městských uzlech, přičemž nahradilo původní směrnici 2014/94/EU.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Transevropská dopravní síť; Městské uzly; Národní akční plán čisté mobility; Vodíková čerpací stanice","tagy":"Plnění a výdej; Mobilita; Alternativní nosiče","url":""},{"datum":"2026-03-23","pojem":"Nařízení o registraci, hodnocení, povolování a omezování chemických látek","doslovny":"Registration, Evaluation, Authorisation and Restriction of Chemicals","zkratka":"REACH","popis":"Nařízení EU (ES č. 1907/2006) upravující registraci, hodnocení, povolování a omezování chemických látek včetně vodíku. Stanovuje povinnosti výrobců a dovozců chemických látek, včetně povinnosti vydávat bezpečnostní listy.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Bezpečnostní list vodíku; Evropská dohoda o mezinárodní silniční přepravě nebezpečných; Směrnice o tlakových zařízeních","tagy":"Normy a standardy; Přeprava a distribuce","url":""},{"datum":"2025-03-10","pojem":"Nařízení o schvalování vozidel na vodíkový pohon","doslovny":"Regulation on type-approval of hydrogen-powered motor vehicles.","zkratka":"EC79","popis":"Nařízení Evropského parlamentu a Rady (ES) č. 79/2009 o schvalování typu vozidel na vodíkový pohon. Stanovuje požadavky na bezpečnost tlakových systémů, nádrží a palivových článků ve vozidlech poháněných vodíkem. Bylo nahrazeno nařízením (EU) 2024/2689.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Systém pro skladování stlačeného vodíku; Tlaková nádoba; Maximální přípustný pracovní tlak","tagy":"Mobilita; Skladování","url":""},{"datum":"2025-08-12","pojem":"Následné tankování","doslovny":"Subsequent Fueling","zkratka":"","popis":"Plnění, které následuje po aktuálním plnění za okolní teploty a může být ovlivněno termodynamickými vlastnostmi plynu v CHSS na konci aktuálního plnění.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Předchlazené tankování; Protokol plnění; Protokoly plnění pro lehká vozidla na plynný vodík; Systém pro skladování stlačeného vodíku","tagy":"Fyzika; Normy a standardy","url":""},{"datum":"2025-08-07","pojem":"Návěs","doslovny":"Trailer","zkratka":"","popis":"Silniční přepravní prostředek bez vlastního pohonu tažený sedlovým tahačem, jehož přední část spočívá na tahači. V kontextu vodíkové infrastruktury se nejčastěji jedná o vodíkový návěs — buď s tlakovými trubicemi pro stlačený vodík (tube trailer), nebo s kryogenní cisternou pro kapalný vodík. Představuje nejběžnější způsob distribuce vodíku tam, kde není k dispozici potrubní infrastruktura.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Víceprvkový kontejner na plyn; Přeprava vodíku; Stlačený plynný vodík","tagy":"Skladování; Plnění a výdej","url":""},{"datum":"2025-08-12","pojem":"Největší objem nádrže","doslovny":"Largest Tank Volume","zkratka":"TVL","popis":"Objem největšího jednotlivého zásobníku v CHSS.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Systém pro skladování stlačeného vodíku; Tlaková nádoba; Stav naplnění","tagy":"Skladování; Normy a standardy","url":""},{"datum":"2025-04-29","pojem":"Net-Zero Industry Act","doslovny":"Odkaz","zkratka":"NZIA (2024/1735)","popis":"Nařízení EU stanovující rámec pro posílení evropské výroby technologií přispívajících k uhlíkové neutralitě. Cílem je zajistit, aby EU do roku 2030 pokryla alespoň 40 % vlastní poptávky po klíčových čistých technologiích, mezi které patří mimo jiné elektrolyzéry, palivové články a solární panely.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Evropská vodíková banka; Akcelerační zóna; Fit for 55","tagy":"Elektrolýza; Podpora a pobídky; Náklady a financování","url":""},{"datum":"2025-09-29","pojem":"Neveřejná čerpací stanice vodíku","doslovny":"","zkratka":"","popis":"Čerpací stanice s omezeným přístupem, určená pro konkrétního provozovatele či vymezený okruh uživatelů (např. firemní flotila, areálový provoz), nepřístupná široké veřejnosti bez předchozího oprávnění. Obvykle se nachází v uzavřeném areálu, není uváděna jako veřejný bod infrastruktury a neposkytuje prodej „na místě“ komukoli z ulice.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Veřejná čerpací stanice vodíku; Vodíková čerpací stanice","tagy":"Mobilita; Obchodní modely","url":""},{"datum":"2026-03-23","pojem":"Nevýbušné provedení","doslovny":"Ex-proof","zkratka":"Ex","popis":"Konstrukční provedení elektrických a mechanických zařízení certifikované pro bezpečný provoz v prostředí s nebezpečím výbuchu. V kontextu vodíkové infrastruktury se týká zařízení instalovaných v prostorách kde může docházet k úniku vodíku a vzniku výbušné atmosféry.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Výbušná atmosféra; Dolní mez výbušnosti; Detekce vodíku; Elektrostatický výboj; Inertizace","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2026-03-19","pojem":"Nevyužitelný zbytek vodíku","doslovny":"Unusable hydrogen residue","zkratka":"","popis":"Množství vodíku zůstávající v tlakové nádobě nebo zásobníku po poklesu tlaku pod minimální provozní mez, které nelze dále využít. V praxi také označováno jako „mrtvé množství\". Představuje ekonomickou ztrátu a snižuje efektivní kapacitu skladovacího systému. Relevantní zejména při dimenzování tlakových kaskád a zásobníků čerpacích stanic.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Tlaková nádoba; Tlaková kaskáda; Stav naplnění; Nominální pracovní tlak; Největší objem nádrže","tagy":"Plnění a výdej; Fyzika","url":""},{"datum":"2025-08-07","pojem":"Nivelizované náklady na elektřinu","doslovny":"Levelized Cost of Electricity","zkratka":"LCOE","popis":"Metrika vyjadřující průměrné náklady na výrobu jedné megawatthodiny elektřiny z daného zdroje, zahrnující investiční náklady, provoz i financování přepočtené na celou dobu životnosti zdroje. LCOE umožňuje přímé srovnání ekonomické konkurenceschopnosti různých zdrojů elektřiny — u elektrolýzy je klíčovým vstupem pro výpočet LCOH, protože cena elektřiny tvoří velkou část nákladů na vodík.","kategorie":"Ekonomika a trh","subkategorie":"Náklady a financování","souvisejici":"Nivelizované náklady na vodík; Kapitálové výdaje; Obnovitelné zdroje energie","tagy":"Elektrolýza; Obchodní modely","url":""},{"datum":"2025-04-29","pojem":"Nivelizované náklady na vodík","doslovny":"Levelised cost of hydrogen","zkratka":"LCOH","popis":"Metrika vyjadřující průměrné náklady na výrobu jednoho kilogramu vodíku po celou dobu životnosti projektu, zahrnující investiční náklady, provoz i financování. LCOH umožňuje přímé srovnání ekonomické konkurenceschopnosti různých výrobních technologií a zdrojů — například elektrolýzy z OZE oproti reformingu s CCS.","kategorie":"Ekonomika a trh","subkategorie":"Náklady a financování","souvisejici":"Kapitálové výdaje; Provozní výdaje; Nivelizované náklady na elektřinu; Utilizace elektrolyzéru","tagy":"Elektrolýza; Obchodní modely; Certifikace","url":""},{"datum":"2026-03-19","pojem":"Nízkotlaký zásobník","doslovny":"Low-pressure storage","zkratka":"","popis":"Tlaková nádoba sloužící jako vyrovnávací zásobník před vstupem vodíku do sání kompresoru. Pracuje při nižším tlaku než výstupní zásobníky a zajišťuje plynulý přívod plynu do kompresoru. Také označován jako nízkotlaké uložiště.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Vysokotlaký zásobník; Tlaková nádoba; Kompresor; Buffer; Zdroj vodíku","tagy":"Plnění a výdej; Komponenty a zařízení; Fyzika","url":""},{"datum":"2025-04-29","pojem":"Nízkouhlíkový vodík","doslovny":"Low-carbon hydrogen","zkratka":"LCH","popis":"Vodík vyráběný z neobnovitelných zdrojů energie, který splňuje prahovou hodnotu snížení emisí skleníkových plynů o 70 % v porovnání s fosilním komparátorem (94 g CO₂/MJ). Jde o technologicky neutrální kategorii, zahrnující například vodík z jaderné energie. V terminologii EU nahrazuje dřívější označení „modrý vodík''.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Modrý vodík; Zelený vodík; Zachycování a ukládání uhlíku; EU Taxonomy (2020/852)","tagy":"Reformování; Termochemické procesy; Obchodní modely","url":""},{"datum":"2025-09-29","pojem":"Nominální pracovní tlak","doslovny":"Nominal working pressure","zkratka":"NWP","popis":"Referenční hodnota tlaku, při které je systém nebo zařízení navrženo pro běžný provoz. V kontextu vodíkových nádrží a čerpacích stanic je NWP základním parametrem definujícím tlakovou třídu — například H35 (350 bar) nebo H70 (700 bar).","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Maximální pracovní tlak; Maximální přípustný pracovní tlak; Tlaková třída 350 bar; Tlaková třída 700 bar","tagy":"Normy a standardy; Skladování","url":""},{"datum":"2026-03-30","pojem":"Obchodní měření vodíku","doslovny":"Hydrogen fiscal metering","zkratka":"","popis":"Měření množství a kvality vodíku pro účely obchodních transakcí mezi výrobcem, distributorem a odběratelem. Na rozdíl od provozního měření musí splňovat přísné metrologické požadavky a být úředně ověřeno. Klíčový prvek pro rozvoj vodíkového trhu.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Průtokoměr; Hmotnostní průtokoměr; Chromatograf","tagy":"Energetický trh; Přeprava a distribuce; Normy a standardy","url":""},{"datum":"2025-04-29","pojem":"Obnovitelné zdroje energie","doslovny":"Renewable energy sources","zkratka":"OZE","popis":"Energie pocházející z obnovitelných nefosilních zdrojů — slunce, větru, vody, geotermální energie, biomasy, bioplynu a dalších. Definice OZE je v českém právu ukotvena v souladu se směrnicí RED a tvoří základ pro posuzování obnovitelnosti vodíku vyrobeného elektrolýzou.","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Zelený vodík; Adicionalita; Elektrolyzér","tagy":"Certifikace; Elektrolýza; Podpora a pobídky","url":""},{"datum":"2026-03-19","pojem":"Obnovitelný vodík","doslovny":"Renewable hydrogen","zkratka":"","popis":"Vodík vyrobený z obnovitelných zdrojů energie, jehož emise skleníkových plynů v celém životním cyklu nepřekračují stanovený práh. V legislativě EU odpovídá kategorii RFNBO. Zahrnuje zejména zelený vodík vyrobený elektrolýzou poháněnou obnovitelnou elektřinou.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Zelený vodík; Kapalná a plynná paliva nebiologického původu; Delegovaný Akt RFNBO (2023/1184); Certifikát udržitelnosti","tagy":"Elektrolýza; Energetický trh; Evropská legislativa a strategie","url":""},{"datum":"2026-03-30","pojem":"Odborně způsobilá osoba","doslovny":"Qualified person","zkratka":"","popis":"Osoba s osvědčením Technické inspekce České republiky (TIČR) opravňujícím k provádění činností na vyhrazených technických zařízeních — plynových, tlakových, elektrických a zdvihacích. Zahrnuje montáž, opravy, servis, revize a zkoušky. Podmínky odborné způsobilosti stanovuje NV č. 194/2022 Sb.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Zákon o bezpečnosti práce v souvislosti s provozem vyhrazených technických zařízení; Akceptační zkoušení ve výrobním závodě","tagy":"Národní legislativa a strategie","url":""},{"datum":"2026-03-19","pojem":"Odfukový komín","doslovny":"Vent stack","zkratka":"","popis":"Svislé potrubní zakončení určené k bezpečnému odvodu a rozptylu vodíku uvolněného pojistnými ventily do volné atmosféry. Výška a umístění jsou navrženy tak, aby se vodík bezpečně rozptýlil mimo dosah zdrojů zapálení.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Odtlakovací komín; Pojistný ventil; Teplotně aktivovaný odtlakovací ventil; Inertizace","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-08-07","pojem":"Odpar","doslovny":"Boil-off","zkratka":"","popis":"Samovolné odpařování kapalného vodíku vlivem tepelného příkonu z okolí, ke kterému dochází i přes tepelnou izolaci zásobníku. Odpar (boil-off) představuje nevyhnutelnou ztrátu při skladování a přepravě kapalného vodíku a je jedním z klíčových parametrů při návrhu kryogenních systémů.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Kapalný vodík; Podchlazený vodík; Odpařovač okolního vzduchu","tagy":"Skladování; Plnění a výdej","url":""},{"datum":"2025-08-07","pojem":"Odpařovač okolního vzduchu","doslovny":"Ambient air vaporizer","zkratka":"AAV","popis":"Tepelný výměník využívající teplo okolního vzduchu k odpařování kapalného vodíku před jeho výdejem do nádrže vozidla. Jde o energeticky nenáročné řešení, které nevyžaduje externí zdroj tepla — jeho výkon je však závislý na okolní teplotě.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Kryogenní technologie; Kapalný vodík; Systém předchlazení plyn-kapalina; Chladicí smyčka","tagy":"Plnění a výdej; Fyzika; Skladování","url":""},{"datum":"2025-03-10","pojem":"Odtlakovací komín","doslovny":"","zkratka":"","popis":"Svislé potrubní zakončení sloužící k bezpečnému odvodu a rozptylu vodíku uvolněného při odtlakování systému, pojistnými ventily nebo nouzových situacích. Výška a umístění komínu jsou navrženy tak, aby se vodík bezpečně rozptýlil do atmosféry mimo dosah zdrojů zapálení.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Pojistný ventil; Teplotně aktivovaný odtlakovací ventil; Odtlakování systému; Inertizace","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-03-10","pojem":"Odtlakování systému","doslovny":"","zkratka":"","popis":"Řízený proces odvodu zbytkového vodíku z plnicího systému po ukončení tankování, typicky před odpojením hadice od vozidla. Odtlakování zajišťuje bezpečné rozpojení přípojky a zabraňuje nekontrolovanému úniku vodíku.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Odtlakovací komín; Pojistný ventil; Inertizace","tagy":"Fyzika; Komponenty a zařízení","url":""},{"datum":"2025-09-29","pojem":"Omezovač průtoku vodíku","doslovny":"","zkratka":"","popis":"Samočinné bezpečnostní zařízení, které při překročení nastavené meze průtoku automaticky uzavře nebo výrazně omezí přívod vodíku. Chrání systém před důsledky netěsností nebo havárií, kdy náhlý nárůst průtoku signalizuje únik. Nastavitelná mez průtoku se volí podle konkrétní aplikace — v praxi se běžně používají hodnoty okolo 60 g/s.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Pojistný ventil; Regulační ventil; Průtoková regulace; Zpětný ventil","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2026-03-19","pojem":"Ostatní vodík","doslovny":"Other hydrogen","zkratka":"","popis":"Vodík nesplňující kritéria obnovitelného ani nízkouhlíkového vodíku dle legislativy EU. Zahrnuje zejména šedý vodík vyrobený z fosilních paliv bez zachycování CO₂. Představuje v současnosti stále největší podíl globální produkce vodíku.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Šedý vodík; Nízkouhlíkový vodík; Obnovitelný vodík; Parní reforming metanu","tagy":"Reformování; Obchodní modely; Energetický trh","url":""},{"datum":"2025-09-29","pojem":"Ostrovní řešení","doslovny":"Off-grid / island mode","zkratka":"","popis":"Koncepce decentralizovaného vodíkového hospodářství, kde je výroba, skladování a spotřeba vodíku maximálně lokalizována a vzájemně provázána bez závislosti na vnější distribuční síti. Typická konfigurace zahrnuje elektrolyzér napájený z lokálního OZE, úložiště vodíku a koncové využití — například palivové články nebo kogeneraci. Vhodné zejména pro průmyslové areály, obce nebo odlehlé lokality.","kategorie":"Ekonomika a trh","subkategorie":"Obchodní modely","souvisejici":"Vodíkové údolí; Power to hydrogen; Podzemní skladování vodíku","tagy":"Elektrolýza; Skladování; Přeprava a distribuce","url":""},{"datum":"2025-08-12","pojem":"Paládiové nanodráty","doslovny":"Palladium nanowires","zkratka":"","popis":"Nanostruktury z paladia ve tvaru drátů s extrémně vysokým poměrem povrchu k objemu, díky čemuž absorbují vodík rychleji a citlivěji než paladium v kompaktní formě. Využívají se při vývoji vysoce citlivých senzorů vodíku schopných detekovat již velmi nízké koncentrace, což je klíčové pro bezpečnostní aplikace v vodíkové infrastruktuře.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Hydridy kovů; Intermetalické slitiny; Pevné skladování vodíku","tagy":"Skladování; Komponenty a zařízení; Chemie","url":""},{"datum":"2025-08-07","pojem":"Palivové články s pevnými oxidy","doslovny":"Solid Oxide Fuel Cell","zkratka":"SOFC","popis":"Typ palivového článku využívající pevný keramický oxidový elektrolyt, který pracuje při vysokých teplotách (600–1000 °C). Vysoká provozní teplota umožňuje využití různých paliv kromě vodíku — například zemního plynu nebo bioplynu — a zároveň dosahovat vysoké elektrické účinnosti. Využívají se zejména ve stacionárních aplikacích pro kombinovanou výrobu tepla a elektřiny.","kategorie":"Technologie využití vodíku","subkategorie":"Palivové články","souvisejici":"Palivový článek; Elektrolyzér s pevným oxidovým elektrolytem; Třífázové rozhraní","tagy":"Elektrolýza; Chemie; Mobilita","url":""},{"datum":"2025-08-07","pojem":"Palivové články s protonově výměnnou membránou","doslovny":"proton-exchange membrane fuel cell","zkratka":"PEMFC","popis":"Typ palivového článku využívající protonově výměnnou membránu jako elektrolyt. Přeměňuje chemickou energii vodíku na elektrickou energii a teplo, přičemž jediným vedlejším produktem je voda. Pracuje při nízkých teplotách (60–80 °C), což umožňuje rychlý náběh. Využívá se zejména v dopravě a stacionárních zdrojích energie.","kategorie":"Technologie využití vodíku","subkategorie":"Palivové články","souvisejici":"Palivový článek; Protonová výměnná membrána; Membránová elektrodová sestava; Elektrické vozidlo s palivovým článkem","tagy":"Elektrolýza; Mobilita; Chemie","url":""},{"datum":"2025-03-10","pojem":"Palivový článek","doslovny":"Fuel Cell","zkratka":"FC","popis":"Zařízení přeměňující chemickou energii vodíku a kyslíku přímo na elektrickou energii, teplo a vodu prostřednictvím elektrochemické reakce — bez spalování. Oproti tepelným motorům dosahuje vyšší účinnosti a neprodukuje emise škodlivých látek.","kategorie":"Technologie využití vodíku","subkategorie":"Palivové články","souvisejici":"Palivové články s protonově výměnnou membránou; Membránová elektrodová sestava; Elektrické vozidlo s palivovým článkem; Třífázové rozhraní","tagy":"Mobilita; Chemie","url":""},{"datum":"2025-08-12","pojem":"Palivový koridor","doslovny":"Fueling Corridor","zkratka":"","popis":"Rozsah přípustných provozních podmínek (teploty a tlaku) při plnění vodíkového vozidla, v rámci kterého je zaručena bezpečnost a kompatibilita s platnými plnícími protokoly. Je definován normou SAE J2601.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Protokol plnění; Protokoly plnění pro lehká vozidla na plynný vodík; Maximální pracovní tlak; Kategorie teploty výdeje vodíku","tagy":"Plnění a výdej; Fyzika","url":""},{"datum":"2025-08-12","pojem":"Parní reforming","doslovny":"Steam reforming","zkratka":"SR","popis":"Termochemický proces výroby vodíku, při kterém vodní pára reaguje s uhlovodíky za vysokých teplot a za přítomnosti katalyzátoru za vzniku syntézního plynu (směs H₂ a CO). Jako vstupní surovina může sloužit metan, metanol, etanol nebo jiné uhlovodíky.","kategorie":"Výroba","subkategorie":"Reformování","souvisejici":"Parní reforming metanu; Autotermní reforming; Modrý vodík; Zachycování a ukládání uhlíku","tagy":"Certifikace; Termochemické procesy; Chemie","url":""},{"datum":"2025-08-12","pojem":"Parní reforming metanu","doslovny":"Steam methane reforming","zkratka":"SMR","popis":"Nejrozšířenější průmyslová metoda výroby vodíku, při které vodní pára reaguje s metanem při teplotách 700–1000 °C za přítomnosti niklového katalyzátoru. Proces má vysokou emisní stopu — bez kombinace s CCS se jedná o výrobu šedého vodíku.","kategorie":"Výroba","subkategorie":"Reformování","souvisejici":"Parní reforming; Modrý vodík; Šedý vodík; Zachycování a ukládání uhlíku","tagy":"Certifikace; Chemie; Termochemické procesy","url":""},{"datum":"2026-03-30","pojem":"Pay-as-bid aukce","doslovny":"Pay-as-bid auction","zkratka":"","popis":"Pravidlo cenotvorby v aukcích, podle kterého každý úspěšný účastník získá přesně takovou výši podpory nebo ceny, jakou sám nabídl. Na rozdíl od aukce s jednotnou cenou (uniform price), kde všichni vítězové platí stejnou clearingovou cenu. Využívá většina zemí EU (Německo, Francie, Polsko) pro aukce OZE i pro alokaci kapacity vodíkové infrastruktury.","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Aukce jako služba; Lex OZE III","tagy":"Podpora a pobídky; Podpora a pobídky","url":""},{"datum":"2026-03-03","pojem":"PEM elektrolyzér","doslovny":"Proton Exchange Membrane electrolyzers","zkratka":"","popis":"Elektrolyzér využívající protonově výměnnou membránu (PEM) jako elektrolyt pro štěpení vody na vodík a kyslík pomocí elektrické energie. Pracuje při nízkých teplotách (50–80 °C), umožňuje rychlý náběh a vysokou flexibilitu při kolísání výkonu z obnovitelných zdrojů. Produkuje vodík pod vysokým tlakem a s vysokou čistotou. Hlavní nevýhodou jsou vysoké náklady spojené s použitím drahých kovů — platiny a iridia — v katalytických vrstvách","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Elektrolyzér; AEM elektrolyzér; Protonová výměnná membrána; Membránová elektrodová sestava","tagy":"Certifikace; Palivové články; Chemie","url":""},{"datum":"2025-08-07","pojem":"Pevné skladování vodíku","doslovny":"","zkratka":"","popis":"Způsob skladování vodíku, při kterém je vodík vázán v pevném materiálu — nejčastěji v hydridech kovů nebo nanostrukturovaných uhlících — prostřednictvím chemické nebo fyzikální adsorpce. Oproti tlakovému nebo kapalnému skladování nabízí vyšší bezpečnost a nižší provozní tlak, avšak za cenu nižší gravimetrické hustoty a nutnosti dodávat teplo pro uvolnění vodíku.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Hydridy kovů; Intermetalické slitiny; Entalpie hydrogenace; Gibbsova volná energie absorpce vodíku","tagy":"Materiály; Fyzika","url":""},{"datum":"2026-03-23","pojem":"Plnicí hadice","doslovny":"Fuelling hose","zkratka":"","popis":"Flexibilní vysokotlaká hadice spojující výdejní stojan s plnicí rychlospojkou, přizpůsobená pro přenos vodíku pod tlakem 350 nebo 700 bar. Součást plnicí přípojky, navržená pro odolnost vůči vodíkové křehkosti a těsnost při opakovaném použití.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Plnicí přípojka; Plnicí rychlospojka; Mechanická rozpojka; Výdejní stojan; Spojovací zařízení pro doplňování paliva pro pozemní vozidla na plynný vodík","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2026-03-23","pojem":"Plnicí přetlak","doslovny":"Filling pressure","zkratka":"","popis":"Tlak vodíku dosažený v nádrži vozidla na konci plnicího procesu. Jeho hodnota závisí na teplotě vodíku a typu vozidla — pro osobní automobily typicky 700 bar (H70), pro těžká vozidla 350 bar (H35).","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Nominální pracovní tlak; Tlaková třída 350 bar; Tlaková třída 700 bar; Protokol plnění; Protokoly plnění pro lehká vozidla na plynný vodík","tagy":"Normy a standardy; Mobilita","url":""},{"datum":"2026-03-23","pojem":"Plnicí přípojka","doslovny":"Fuelling connector","zkratka":"","popis":"Sestava komponentů zajišťující fyzické propojení výdejního stojanu s nádrží vozidla, tvořená plnicí hadicí, mechanickou rozpojkou a plnicí rychlospojkou. Musí splňovat požadavky normy EN ISO 17268.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Výdejní stojan; Spojovací zařízení pro doplňování paliva pro pozemní vozidla na plynný vodík; Ventil na nádrži; Infračervené datové rozhraní","tagy":"Plnění a výdej; Normy a standardy; Mobilita","url":""},{"datum":"2026-03-23","pojem":"Plnicí rychlospojka","doslovny":"Quick connect coupling","zkratka":"","popis":"Koncový prvek plnicí přípojky zajišťující fyzické a těsné připojení k plnicímu hrdlu vozidla. Konstrukčně řešena pro různé tlaky — 350 bar (H35) pro těžká vozidla a 700 bar (H70) pro osobní automobily. Musí splňovat požadavky normy EN ISO 17268.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Plnicí přípojka; Spojovací zařízení pro doplňování paliva pro pozemní vozidla na plynný vodík; Ventil na nádrži; Tlaková třída 350 bar; Tlaková třída 700 bar","tagy":"Plnění a výdej; Normy a standardy; Mobilita","url":""},{"datum":"2026-03-16","pojem":"Plynárenský balíček","doslovny":"","zkratka":"","popis":"Zastřešující označení pro dvojici legislativních aktů EU — směrnici (EU) 2024/1788 a nařízení (EU) 2024/1789 — které společně tvoří regulační rámec pro dekarbonizaci plynárenství a rozvoj vodíkového trhu v EU","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Nařízení (EU) 2024/1789; LEX plyn; Vodíková přepravní síť; Distribuční soustava","tagy":"Certifikace; Přeprava a distribuce","url":""},{"datum":"2025-03-10","pojem":"Plynný vodík","doslovny":"Gaseous Hydrogen","zkratka":"GH₂","popis":"Vodík v plynném skupenství při standardních podmínkách. Při atmosférickém tlaku má nízkou energetickou hustotu, proto se pro skladování a přepravu stlačuje na různé tlakové úrovně podle konkrétní aplikace.","kategorie":"Věda a výzkum","subkategorie":"Chemie","souvisejici":"Stlačený plynný vodík; Vysokotlaký vodík; Kapalný vodík; Energetická hustota","tagy":"Skladování; Přeprava a distribuce; Fyzika","url":""},{"datum":"2026-03-30","pojem":"Plynný vodík – Čerpací stanice – Obecné požadavky","doslovny":"","zkratka":"ČSN ISO 19880-1","popis":"Mezinárodní norma stanovující minimální požadavky na návrh, instalaci, uvedení do provozu, provoz, kontrolu a údržbu vodíkových plnicích stanic. Zahrnuje požadavky na výrobu, dodávku, skladování, čištění a stlačení vodíku na stanici.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Vodíková čerpací stanice; Kvalita vodíku; Čistota vodíku","tagy":"Certifikace; Plnění a výdej; Mobilita","url":""},{"datum":"2025-10-02","pojem":"Plynojem","doslovny":"","zkratka":"","popis":"Zařízení pro skladování plynu, dostupné v nadzemním (mokrém, suchém nebo tlakovém) nebo podzemním provedení (kolektorová nebo kavernová úložiště). V kontextu vodíkových technologií jsou plynojemy relevantní zejména jako potenciální infrastruktura pro velkoobjemové skladování vodíku, přičemž podzemní kavernová úložiště jsou považována za nejperspektivnější variantu","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Kaverna; Solná kaverna; Podzemní skladování vodíku; Tlaková nádoba; Stlačený plynný vodík; Tlaková kaskáda","tagy":"Přeprava a distribuce; Komponenty a zařízení","url":""},{"datum":"2025-08-07","pojem":"Plynová difúzní vrstva","doslovny":"Gas diffusion layers","zkratka":"GDL","popis":"Porézní materiál v palivovém článku na vodík, který usnadňuje transport vodíku a kyslíku do katalytické vrstvy, odstraňuje vodu a poskytuje mechanickou podporu. Funguje jako most mezi membránovou elektrodovou sestavou (MEA) a bipolární deskou. Využívá se jak v palivových článcích, tak v elektrolyzérech.","kategorie":"Technologie využití vodíku","subkategorie":"Palivové články","souvisejici":"Membránová elektrodová sestava; Palivový článek; Třífázové rozhraní; Elektroda","tagy":"Materiály; Chemie; Elektrolýza","url":""},{"datum":"2025-08-12","pojem":"Počáteční kontrola těsnosti","doslovny":"Initial Leak Check","zkratka":"","popis":"Bezpečnostní procedura prováděná bezprostředně po připojení plnicí trysky k vozidlu, která ověřuje těsnost spojení před zahájením výdeje vodíku. Zabraňuje úniku vodíku během plnění.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Protokol plnění; Spojovací zařízení pro doplňování paliva pro pozemní vozidla na plynný vodík; Infračervené datové rozhraní","tagy":"Normy a standardy; Komponenty a zařízení","url":""},{"datum":"2026-02-23","pojem":"Podchlazený vodík","doslovny":"Subcooled hydrogen","zkratka":"","popis":"Kapalný vodík ochlazený pod svůj normální bod varu (−253 °C) při atmosférickém tlaku, přičemž zůstává v kapalném stavu. Oproti standardnímu kapalnému vodíku dosahuje vyšší hustoty, což umožňuje skladování většího množství vodíku ve stejném objemu. Tradičně se využívá v kosmonautice a letectví, v posledních letech se zkoumá i pro aplikace v těžké dopravě.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Kapalný vodík; Kryogenní technologie; Odpar; Čerpací stanice na kapalný vodík","tagy":"Fyzika; Plnění a výdej","url":""},{"datum":"2025-08-07","pojem":"Podzemní skladování vodíku","doslovny":"","zkratka":"","popis":"Skladování velkého množství vodíku v přírodních nebo upravených podzemních geologických formacích, jako jsou solné kaverny, vytěžená plynová pole nebo porézní horniny. Představuje klíčovou technologii pro sezónní vyrovnávání nabídky a poptávky po vodíku ve velkém měřítku.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Solná kaverna; Vytěžená plynová pole; Vodíková soustava; Kaverna; Plynojem","tagy":"Přeprava a distribuce","url":""},{"datum":"2025-03-10","pojem":"Pojistný ventil","doslovny":"","zkratka":"","popis":"Mechanické bezpečnostní zařízení, které se automaticky otevře při překročení nastaveného tlaku a odvede přebytečný plyn do bezpečného prostředí. Chrání tlakové nádoby a potrubí před poškozením nebo havárií způsobenou nadměrným tlakem.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Teplotně aktivovaný odtlakovací ventil; Maximální přípustný pracovní tlak; Odtlakovací komín","tagy":"Plnění a výdej; Normy a standardy; Skladování","url":""},{"datum":"2025-08-07","pojem":"Poměr H/M","doslovny":"H/M ratio","zkratka":"","popis":"Poměr počtu atomů vodíku k počtu atomů kovu ve slitině, udávající kapacitu skladování vodíku v daném materiálu. Čím vyšší hodnota H/M, tím více vodíku může materiál absorbovat — jde o klíčový parametr při vývoji materiálů pro pevné skladování vodíku.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Hydridy kovů; Entalpie hydrogenace; Gibbsova volná energie absorpce vodíku; Intermetalické slitiny","tagy":"Skladování; Fyzika; Chemie","url":""},{"datum":"2026-03-30","pojem":"Pomocné systémy elektrolyzéru","doslovny":"Balance-of-plant","zkratka":"","popis":"Souhrn pomocných systémů a zařízení nezbytných pro provoz elektrolyzéru — zahrnuje napájení, úpravu a přívod vody, čerpadla, sušení vodíku a systémy chlazení.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Účinnost systému; Sestava elektrolytických článků","tagy":"Komponenty a zařízení","url":""},{"datum":"2026-03-30","pojem":"Postup Open Season","doslovny":"Open season","zkratka":"","popis":"Formalizovaný proces, při kterém provozovatel přepravní sítě zjišťuje závazný zájem potenciálních uživatelů o rezervaci přepravní kapacity. Na základě výsledků open season se rozhoduje o investicích do rozvoje nebo rozšíření sítě. V plynárenství zavedený standard, postupně aplikovaný i na vodíkové sítě — například dánský Energinet jej využívá pro alokaci kapacity vodíkové sítě.","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Systém vstupů a výstupů; Desetiletý plán rozvoje sítě","tagy":"Přeprava a distribuce; Podpora a pobídky","url":""},{"datum":"2026-03-30","pojem":"Posuzování rizika","doslovny":"Risk assessment","zkratka":"","popis":"Systematický proces stanovení kvantitativní nebo kvalitativní hodnoty rizika spojeného s konkrétní situací nebo zařízením. V kontextu vodíkové infrastruktury zahrnuje identifikaci zdrojů nebezpečí, pravděpodobnosti jejich výskytu a možných následků. Výsledky slouží jako základ pro bezpečnostní opatření a projektování.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Kvantitativní analýza rizik; Kvalitativní analýza rizik","tagy":"Certifikace; Plnění a výdej; Přeprava a distribuce","url":""},{"datum":"2025-08-12","pojem":"Power to hydrogen","doslovny":"Energie do vodíku","zkratka":"P2H","popis":"Proces přeměny elektrické energie na vodík prostřednictvím elektrolýzy vody. Umožňuje dlouhodobé ukládání přebytečné elektřiny z obnovitelných zdrojů ve formě vodíku, který lze následně využít jako palivo, průmyslovou surovinu nebo zpětně převést na elektřinu.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Elektrolýza; Elektrolyzér; Power-to-Gas; Obnovitelné zdroje energie","tagy":"Elektrolýza; Obchodní modely; Energetický trh","url":""},{"datum":"2025-08-12","pojem":"Power-to-Gas","doslovny":"Energie do plynu","zkratka":"PtG","popis":"Technologie přeměňující přebytečnou elektrickou energii z obnovitelných zdrojů na plynná paliva — nejčastěji vodík (elektrolýzou) nebo syntetický metan (metanací). Umožňuje dlouhodobé ukládání energie a její integraci do stávající plynárenské infrastruktury.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Power to hydrogen; Power-to-Methane; E-metan; Míchání","tagy":"Elektrolýza; Přeprava a distribuce; Obchodní modely","url":""},{"datum":"2026-03-30","pojem":"Power-to-Liquid","doslovny":"","zkratka":"PtL","popis":"Proces přeměny obnovitelné elektřiny na kapalná syntetická paliva prostřednictvím elektrolýzy vody (výroba vodíku) a následné syntézy s CO₂. Výsledkem jsou e-paliva jako syntetická nafta, letecké palivo nebo metanol. Umožňuje dekarbonizaci sektorů závislých na kapalných palivech.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"E-paliva; Power-to-Gas; Fischer-Tropschova syntéza; E-metanol; Udržitelné letecké palivo","tagy":"Chemie","url":""},{"datum":"2025-08-12","pojem":"Power-to-Methane","doslovny":"Energie do metanu","zkratka":"PtM","popis":"Specifická varianta Power-to-Gas, při které je vodík vyrobený elektrolýzou dále kombinován s CO₂ v procesu metanace za vzniku syntetického metanu (e-metanu). Ten lze skladovat a přepravovat ve stávající plynárenské infrastruktuře.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Power-to-Gas; E-metan; Zachycování a využívání uhlíku","tagy":"Přeprava a distribuce; Obchodní modely; Termochemické procesy","url":""},{"datum":"2026-03-30","pojem":"Požárně nebezpečný prostor","doslovny":"Fire hazard zone","zkratka":"","popis":"Prostor, ve kterém může při požáru dojít k ohrožení osob nebo sousedních objektů sálavým teplem nebo přímým plamenem. Rozsah požárně nebezpečného prostoru se stanovuje výpočtem dle ČSN 73 0802 a ČSN 73 0804. U vodíkové infrastruktury je klíčový pro stanovení odstupových vzdáleností a umístění zařízení.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Bezpečná vzdálenost; Směrnice ATEX; Posuzování rizika","tagy":"Certifikace; Plnění a výdej; Přeprava a distribuce","url":""},{"datum":"2026-03-30","pojem":"Proplachovací cyklus","doslovny":"Purging cycle","zkratka":"","popis":"Jeden cyklus vtlačení a vypuštění inertního plynu (typicky dusíku) do potrubí nebo zařízení za účelem odstranění nežádoucích plynů — vzduchu před uvedením do provozu nebo vodíku před opravou. Počet cyklů závisí na požadované čistotě nebo bezpečné zbytkové koncentraci.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Inertizace; Bezpečná vzdálenost","tagy":"Plnění a výdej","url":""},{"datum":"2025-03-04","pojem":"Protokol plnění","doslovny":"","zkratka":"","popis":"Soubor pravidel a postupů, které se používají při doplňování vodíku do palivových nádrží vodíkových vozidel (FCEV). Tyto protokoly zajišťují bezpečnost, efektivitu a kompatibilitu mezi čerpacími stanicemi a vozidly, a to i při různých provozních podmínkách.  Klíčovým standardem je SAE J2601","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Protokoly plnění pro lehká vozidla na plynný vodík; MC Formula; Palivový koridor; Předchlazené tankování","tagy":"Plnění a výdej; Mobilita; Fyzika","url":""},{"datum":"2025-08-12","pojem":"Protokol pro plnění paliva při okolní teplotě","doslovny":"Ambient Temperature Fueling Protocol","zkratka":"","popis":"Protokol plnění vodíku bez aktivního předchlazení, kde je teplota dodávaného vodíku rovna nebo blízká okolní teplotě. Oproti standardnímu protokolu SAE J2601 je jednodušší na infrastrukturu, ale výsledkem je nižší rychlost plnění a menší množství dodaného vodíku.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Protokol plnění; Předchlazené tankování; Protokoly plnění pro lehká vozidla na plynný vodík; Následné tankování","tagy":"Plnění a výdej; Fyzika","url":""},{"datum":"2025-03-04","pojem":"Protokoly plnění pro lehká vozidla na plynný vodík","doslovny":"Fueling Protocols for Light Duty Gaseous Hydrogen Surface Vehicles","zkratka":"SAE J2601","popis":"Standard, který specifikuje požadavky na tankování vodíkových palivových článků, konkrétně vodíkových vozidel. Tento standard je klíčový pro bezpečné, efektivní a rychlé doplňování vodíku do nádrží vozidel.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"MC Formula; Protokol plnění; Protokoly plnění s vysokým průtokem pro střední a těžká vozidla na plynný vodík; Předchlazené tankování","tagy":"Plnění a výdej; Mobilita; Fyzika","url":""},{"datum":"2025-03-04","pojem":"Protokoly plnění s vysokým průtokem pro střední a těžká vozidla na plynný vodík","doslovny":"High-Flow Prescriptive Fueling Protocols for Gaseous Hydrogen Powered Medium and Heavy-Duty Vehicles","zkratka":"SAE J2601/5","popis":"Rozšíření standardu SAE J2601, která se zaměřuje na tankování vodíku pro nákladní vozidla, autobusy, vlaky. Tento dokument je navržen tak, aby řešil požadavky na větší nádrže a vyšší průtoky, které jsou typické pro těžká vozidla.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Protokoly plnění pro lehká vozidla na plynný vodík; Tlaková třída 350 bar; Protokol plnění","tagy":"Plnění a výdej; Mobilita","url":""},{"datum":"2025-03-10","pojem":"Protonová výměnná membrána","doslovny":"Proton Exchange Membrane","zkratka":"PEM","popis":"Polopropustná polymerní membrána propouštějící protony (H⁺) a zároveň fungující jako elektronický izolátor a bariéra pro reaktanty. Je klíčovou součástí membránových elektrodových sestav (MEA) v palivových článcích a elektrolyzérech, kde odděluje anodu od katody a umožňuje přenos protonů mezi nimi.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"PEM elektrolyzér; Membránová elektrodová sestava; Aniontová výměnná membrána; Elektrolyt","tagy":"Palivové články; Chemie; Materiály","url":""},{"datum":"2025-08-12","pojem":"Provozní výdaje","doslovny":"Operating Expenses","zkratka":"OPEX","popis":"Průběžné náklady spojené s provozem a údržbou zařízení, zahrnující spotřebu energie, materiálu, pracovní sílu a servis. Ve vodíkových technologiích tvoří OPEX významnou část celkových nákladů zejména u elektrolyzérů, kde dominuje cena elektřiny.","kategorie":"Ekonomika a trh","subkategorie":"Náklady a financování","souvisejici":"Kapitálové výdaje; Nivelizované náklady na vodík; Utilizace elektrolyzéru","tagy":"Elektrolýza; Obchodní modely","url":""},{"datum":"2025-08-07","pojem":"Provozovatelé vodíkových přenosových sítí","doslovny":"Hydrogen Transmission Network Operators","zkratka":"HTNO","popis":"Subjekty odpovědné za výstavbu, provoz a údržbu vodíkových přepravních sítí, především potrubní infrastruktury. Jejich činnost je regulována plynárenským balíčkem (2024/1788 a 2024/1789), který stanovuje pravidla pro přístup třetích stran k síti a podmínky pro připojení výrobců vodíku.","kategorie":"Instituce a organizace","subkategorie":"","souvisejici":"Evropská síť provozovatelů vodíkových sítí; Vodíková přepravní síť; Plynárenský balíček","tagy":"Přeprava a distribuce; Evropská legislativa a strategie","url":""},{"datum":"2025-03-10","pojem":"Průměrná rychlost nárůstu tlaku","doslovny":"Average Pressure Ramp","zkratka":"APRR","popis":"Parametr plnicího protokolu vyjadřující rychlost nárůstu tlaku v nádrži vozidla během tankování, udávaný v MPa/min. APRR je klíčovou proměnnou pro optimalizaci bezpečnosti a rychlosti plnění — příliš vysoká hodnota může způsobit nadměrné zahřívání nádrže, příliš nízká prodlužuje dobu tankování.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Protokol plnění; MC Formula; Hmotnostní průtok vodíku; Tlaková kaskáda","tagy":"Fyzika; Normy a standardy","url":""},{"datum":"2025-03-10","pojem":"Průtokoměr","doslovny":"Flow-meter","zkratka":"","popis":"Měřicí zařízení zaznamenávající množství látky procházející daným průřezem za jednotku času. Rozlišujeme objemové průtokoměry (měřící v litrech nebo m³) a hmotnostní průtokoměry (měřící v gramech nebo kilogramech). Ve vodíkových čerpacích stanicích se pro fakturaci a detekci abnormálního průtoku využívá hmotnostní průtokoměr.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Hmotnostní průtok vodíku; Průtoková regulace; Manometr","tagy":"Plnění a výdej; Normy a standardy","url":"Jsou instalovány jak v plnicích stojanech, tak i na vodíkových přívěsech pro plnění/vyprazdňování."},{"datum":"2025-03-10","pojem":"Průtoková regulace","doslovny":"","zkratka":"","popis":"Řízení množství a rychlosti průtoku plynu nebo kapaliny v systému pomocí regulačních ventilů, průtokoměrů nebo řídicích jednotek. Ve vodíkových čerpacích stanicích zajišťuje bezpečný a přesný výdej vodíku v souladu s plnicím protokolem.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Průtokoměr; Regulační ventil; Omezovač průtoku vodíku; Adaptivní regulace","tagy":"Plnění a výdej; Fyzika","url":""},{"datum":"2026-03-30","pojem":"Přečerpávací kompresor","doslovny":"Gas transfer compressor","zkratka":"","popis":"Mobilní kompresor určený k bezpečnému přečerpání plynu z odstavovaného úseku plynovodu do sousedního úseku nebo jiného plynovodu před jeho opravou. Zabraňuje vypouštění plynu do atmosféry a přináší provozovateli finanční úspory. S rozvojem vodíkové infrastruktury aplikovatelný i pro vodík, kde klade zvýšené požadavky na těsnost a materiálovou kompatibilitu.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Kompresor; Komprese vodíku","tagy":"Přeprava a distribuce; Plnění a výdej","url":""},{"datum":"2025-08-12","pojem":"Předchlazené tankování","doslovny":"Precooled Fueling","zkratka":"","popis":"Způsob plnění vodíkového vozidla, při kterém je vodík před výdejem aktivně ochlazen na předepsanou teplotu (T40, T30 nebo T20) v souladu s požadavky normy SAE J2601. Předchlazení kompenzuje nárůst teploty vznikající při rychlém plnění vysokotlakých nádrží a umožňuje dosáhnout maximální kapacity nádrže.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Protokol plnění; Systém předchlazení plyn-kapalina; Předchlazený vodík; Kategorie teploty výdeje vodíku","tagy":"Fyzika; Normy a standardy; Komponenty a zařízení","url":""},{"datum":"2026-03-05","pojem":"Předchlazený vodík","doslovny":"Pre-cooled hydrogen","zkratka":"","popis":"Vodík ochlazený před výdejem do nádrže vozidla za účelem kompenzace nárůstu teploty při rychlém plnění vysokotlakých nádrží. Standardní teploty předchlazení jsou −33 °C pro H35 a −40 °C pro H70, v souladu s normou SAE J2601.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Kategorie teploty výdeje vodíku; Joule-Thomsonův jev","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2026-03-16","pojem":"Předpis EHK OSN č. 134","doslovny":"Odkaz","zkratka":"UN ECE R134","popis":"Předpis Evropské hospodářské komise Organizace spojených národů č. 134 stanovující jednotná ustanovení pro schvalování motorových vozidel na vodíkový pohon (HFCV) z hlediska bezpečnosti. Zahrnuje požadavky na systémy pro uchovávání stlačeného vodíku, jejich konstrukční části a palivový systém vozidla včetně zkušebních postupů pro ověření jejich vlastností.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Nařízení o schvalování vozidel na vodíkový pohon; Protokoly plnění pro lehká vozidla na plynný vodík; Elektrické vozidlo s palivovým článkem; Nominální pracovní tlak; Tlaková nádoba","tagy":"Mobilita","url":""},{"datum":"2025-08-07","pojem":"Přeprava vodíku","doslovny":"","zkratka":"","popis":"Logistický proces přesunu vodíku z místa výroby na místo spotřeby. Volba způsobu přepravy závisí na vzdálenosti, objemu, požadované formě vodíku a dostupné infrastruktuře.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Vodíková přepravní síť; Návěs; Víceprvkový kontejner na plyn; Kapalné organické nosiče vodíku","tagy":"Skladování; Obchodní modely; Alternativní nosiče","url":""},{"datum":"2026-03-30","pojem":"Přímé vedení","doslovny":"Direct line","zkratka":"","popis":"Přímé elektrické spojení mezi zdrojem elektřiny a odběratelem bez využití veřejné distribuční nebo přenosové sítě. V kontextu výroby obnovitelného vodíku umožňuje jednodušší splnění kritérií adicionalnosti a korelace pro výrobu RFNBO, protože elektřina prokazatelně pochází z konkrétního obnovitelného zdroje.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Adicionalita; Časová korelace; Geografická korelace; Smlouva o nákupu obnovitelné elektřiny","tagy":"Elektrolýza; Evropská legislativa a strategie","url":""},{"datum":"2026-03-23","pojem":"Přímé zachycování CO₂ ze vzduchu","doslovny":"Direct Air Capture","zkratka":"DAC","popis":"Technologie přímého zachycování oxidu uhličitého z atmosférického vzduchu pomocí chemických sorbentů nebo membrán. Zachycený CO₂ lze využít jako surovinu pro výrobu e-paliv, e-metanolu nebo e-metanu v kombinaci se zeleným vodíkem. Na rozdíl od zachycování CO₂ z průmyslových zdrojů pracuje s velmi nízkou koncentrací CO₂ ve vzduchu, což ji činí energeticky náročnější.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Zachycování a využívání uhlíku; Zachycování a ukládání uhlíku; E-metanol; E-metan; Syntéza metanolu; Metanizace","tagy":"Alternativní nosiče; Chemie; Certifikace","url":""},{"datum":"2025-08-12","pojem":"Pyrolýza","doslovny":"","zkratka":"","popis":"Termický rozklad organických materiálů (biomasy, plastů, uhlí) za vysokých teplot a nepřítomnosti kyslíku. Produktem je směs plynů (včetně vodíku), kapalných frakcí a pevného zbytku (biochar). V kontextu vodíkových technologií se využívá jako jedna z metod výroby vodíku z obnovitelných zdrojů.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Zplyňování; Bio-termolýza; Termolýza","tagy":"Certifikace; Biologické procesy","url":""},{"datum":"2025-03-10","pojem":"Redukční ventil","doslovny":"","zkratka":"","popis":"Zařízení snižující tlak plynu nebo kapaliny z vyšší vstupní hodnoty na nižší požadovanou výstupní hodnotu. Ve vodíkových systémech se využívá například při přechodu z vysokotlakého zásobníku na nízkotlaký výdejní systém nebo při regulaci tlaku v různých částech infrastruktury.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Regulační ventil; Zpětný ventil; Nominální pracovní tlak","tagy":"Plnění a výdej; Fyzika","url":""},{"datum":"2026-03-23","pojem":"Reformér","doslovny":"Reformer","zkratka":"","popis":"Zařízení provádějící termochemický proces přeměny uhlovodíků — nejčastěji zemního plynu nebo metanu — na syntézní plyn obsahující vodík a oxid uhelnatý. Základní komponenta při výrobě modrého a šedého vodíku. Může být součástí průmyslového závodu nebo menší decentralizované jednotky přímo u čerpací stanice.","kategorie":"Výroba","subkategorie":"Reformování","souvisejici":"Parní reforming metanu; Autotermní reforming; Syntézní plyn; Modrý vodík; Šedý vodík; Zachycování a ukládání uhlíku","tagy":"Termochemické procesy; Chemie; Komponenty a zařízení","url":""},{"datum":"2025-04-29","pojem":"ReFuelEU Aviation (2023/2405)","doslovny":"Odkaz","zkratka":"","popis":"Nařízení EU stanovující závazné cíle pro postupné zvyšování podílu udržitelných leteckých paliv (SAF) na letištích EU. Pro vodík je relevantní zejména tím, že e-paliva a vodík jsou uznávána jako způsobilá SAF paliva, přičemž jejich podíl musí od roku 2030 tvořit minimálně 1,2 % celkové spotřeby leteckých paliv.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"E-paliva; FuelEU Maritime; Kapalná a plynná paliva nebiologického původu","tagy":"Alternativní nosiče; Certifikace; Mobilita","url":""},{"datum":"2025-03-10","pojem":"Regulační ventil","doslovny":"","zkratka":"","popis":"Zařízení umožňující plynulou nebo stupňovitou regulaci průtoku plynu nebo kapaliny v systému. Na rozdíl od redukčního ventilu, který snižuje tlak, regulační ventil primárně řídí množství protékající látky. Ve vodíkových systémech se využívá pro přesné dávkování vodíku během plnění","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Redukční ventil; Průtoková regulace; Omezovač průtoku vodíku; Zpětný ventil","tagy":"Plnění a výdej; Fyzika","url":""},{"datum":"2025-03-10","pojem":"Rekuperace energie","doslovny":"","zkratka":"","popis":"Proces zpětného získávání a využití energie, která by jinak byla zmařena jako odpadní teplo nebo tlakový spád. Ve vodíkových technologiích se uplatňuje například při expanzi vysokotlakého vodíku, chlazení kompresoru nebo při plnění vozidel.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Komprese vodíku; Kompresor; Joule-Thomsonův jev","tagy":"Plnění a výdej; Fyzika; Elektrolýza","url":""},{"datum":"2026-03-23","pojem":"Rekuperátor tepelné energie","doslovny":"Heat recovery unit","zkratka":"","popis":"Zařízení pro zachycení a využití odpadního tepla vznikajícího při elektrolýze nebo kompresi vodíku. Odpadní teplo lze využít pro ohřev vody, vytápění nebo jiné průmyslové procesy, čímž se zvyšuje celková energetická účinnost systému.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Elektrolyzér; Kombinovaná výroba elektřiny a tepla; Rekuperace energie; Kompresor","tagy":"Komponenty a zařízení; Obchodní modely","url":""},{"datum":"2026-03-19","pojem":"Růžový vodík","doslovny":"Pink hydrogen","zkratka":"","popis":"Dříve používané barevné označení pro vodík vyrobený elektrolýzou poháněnou jadernou energií. Barevná klasifikace vodíku již není legislativně uznávána EU — v aktuálním rámci by růžový vodík spadal do kategorie nízkouhlíkového vodíku, pokud splňuje stanovený emisní práh.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Elektrolýza; Nízkouhlíkový vodík; Zelený vodík; Obnovitelný vodík","tagy":"Elektrolýza; Energetický trh","url":""},{"datum":"2025-03-04","pojem":"Rychlé plnění vodíku","doslovny":"Fast fill hydrogen","zkratka":"","popis":"Plnění vodíkového vozidla při hmotnostním průtoku přesahujícím 60 g/s. Vyžaduje robustní infrastrukturu — výkonný kompresor, předchlazení vodíku a vysokotlakou kaskádu — a je klíčové pro dosažení doby tankování srovnatelné s konvenčními palivy.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Sekvenční plnění vodíku; Protokol plnění; Hmotnostní průtok vodíku; Vodíková rychločerpací stanice; Předchlazený vodík; Tlaková kaskáda; Kompresor; Protokoly plnění pro lehká vozidla na plynný vodík","tagy":"Normy a standardy; Mobilita; Komponenty a zařízení","url":""},{"datum":"2026-03-19","pojem":"Řád pro mezinárodní železniční přepravu nebezpečného zboží","doslovny":"Regulations concerning the International Carriage of Dangerous Goods by Rail","zkratka":"RID","popis":"Mezinárodní předpis upravující přepravu nebezpečných věcí po železnici, včetně stlačeného a zkapalněného vodíku. Stanovuje požadavky na konstrukci, zkoušení, označení a provoz cisteren a tlakových nádob při železniční přepravě.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Víceprvkový kontejner na plyn; Tlaková nádoba; Přeprava vodíku; Směrnice o tlakových nádobách na přepravu","tagy":"Přeprava a distribuce; Skladování; Mobilita","url":""},{"datum":"2026-03-16","pojem":"Řídicí jednotka skladování vodíku","doslovny":"Hydrogen Storage Control Unit","zkratka":"HSCU","popis":"Specializovaná elektronická řídící jednotka zajišťující správu systému skladování vodíku na palubě vozidla. Monitoruje tlak, teplotu a stav naplnění nádrže, řídí uzavírací ventily, zajišťuje bezpečnostní funkce a komunikaci s vodíkovou čerpací stanicí během plnění. Existují varianty pro stlačený i kapalný vodík.","kategorie":"Technologie využití vodíku","subkategorie":"Mobilita","souvisejici":"Elektrické vozidlo s palivovým článkem; Vodíkové vozidlo s palivovým článkem","tagy":"Komponenty a zařízení; Plnění a výdej","url":""},{"datum":"2025-03-04","pojem":"SAE International","doslovny":"Society of Automotive Engineers","zkratka":"","popis":"Globální profesní organizace sdružující inženýry a technické odborníky z oblasti dopravy, letectví a průmyslu. Vydává technické normy a standardy — v kontextu vodíkových technologií zejména SAE J2601 a SAE J2601/5 pro plnění vodíkových vozidel.","kategorie":"Instituce a organizace","subkategorie":"","souvisejici":"Protokoly plnění pro lehká vozidla na plynný vodík; SAE Standard","tagy":"Normy a standardy; Mobilita","url":""},{"datum":"2025-03-04","pojem":"SAE Standard","doslovny":"","zkratka":"","popis":"Technická norma vyvinutá a vydaná organizací SAE International. Široce využívána v automobilovém, leteckém a námořním průmyslu pro zajištění kompatibility, bezpečnosti a kvality. V oblasti vodíku zahrnuje zejména standardy pro plnění vozidel a bezpečnost vodíkových systémů.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Protokoly plnění pro lehká vozidla na plynný vodík; Spojovací zařízení pro doplňování paliva pro pozemní vozidla na plynný vodík; Nařízení o schvalování vozidel na vodíkový pohon","tagy":"Plnění a výdej; Mobilita","url":""},{"datum":"2026-03-30","pojem":"Sektory s obtížnou dekarbonizací","doslovny":"Hard-to-decarbonize sectors","zkratka":"","popis":"Odvětví průmyslu a dopravy, kde přímá elektřina není schůdnou alternativou k fosilním palivům — například výroba oceli, cementu, chemikálií, lodní doprava nebo letectví. Vodík je považován za klíčové řešení pro dekarbonizaci těchto sektorů.","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Zelený vodík; Nízkouhlíkový vodík; E-paliva; Udržitelné letecké palivo; Fit for 55","tagy":"Evropská legislativa a strategie","url":""},{"datum":"2025-08-07","pojem":"Sekvenční plnění vodíku","doslovny":"Back-to-back hydrogen refueling","zkratka":"","popis":"Proces plnění více vozidel v rychlém sledu s minimální nebo žádnou prodlevou mezi jednotlivými plněními, obvykle u flotil s častým tankováním (autobusy, nákladní vozidla). Klade zvýšené nároky na kapacitu zásobníků a výkon kompresoru, protože kaskáda nemá dostatek času na doplnění mezi jednotlivými plněními.","kategorie":"Infrastrukt
