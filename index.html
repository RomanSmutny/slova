<head>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f2f5; --surface: #fff; --navy: #0a1628; --blue: #0057b8;
    --blue-light: #e6f0fc; --accent: #00c2e0; --text: #1a1f2e;
    --muted: #6b7280; --border: #e2e6ed; --radius: 10px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "DM Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header { background: var(--navy); padding: 0 2rem; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 2rem; height: 64px; border-bottom: 2px solid var(--accent); }
  .logo { font-family: "Space Mono", monospace; font-size: 1rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap; text-decoration: none; }
  .logo-h2 { color: var(--accent); font-size: 1.4rem; font-weight: 700; }
  .search-wrap { flex: 1; max-width: 560px; position: relative; }
  .search-wrap input { width: 100%; padding: 0.55rem 2rem 0.55rem 2.6rem; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #fff; font-size: 0.95rem; font-family: "DM Sans", sans-serif; outline: none; transition: border-color 0.2s; }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.45); }
  .search-wrap input:focus { border-color: var(--accent); background: rgba(255,255,255,0.12); }
  .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); pointer-events: none; }
  .clear-btn { position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.5); padding: 0.2rem; display: none; font-size: 1rem; }
  .clear-btn:hover { color: #fff; }
  .header-stats { font-family: "Space Mono", monospace; font-size: 0.72rem; color: rgba(255,255,255,0.45); white-space: nowrap; margin-left: auto; }
  .count-highlight { color: var(--accent); }

  /* LAYOUT */
  .layout { display: grid; grid-template-columns: 248px 1fr; min-height: calc(100vh - 64px); }

  /* SIDEBAR */
  aside { background: var(--surface); border-right: 1px solid var(--border); padding: 1.25rem 0; overflow-y: auto; position: sticky; top: 64px; height: calc(100vh - 64px); }
  .sidebar-title { font-family: "Space Mono", monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 0 1rem 0.75rem; }
  .cat-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0.5rem 1rem; border: none; background: none; cursor: pointer; text-align: left; font-family: "DM Sans", sans-serif; font-size: 0.875rem; color: var(--text); transition: background 0.15s, color 0.15s; gap: 0.5rem; border-left: 3px solid transparent; }
  .cat-btn:hover { background: var(--bg); }
  .cat-btn.all-btn.active { background: var(--blue-light); color: var(--blue); font-weight: 600; border-left-color: var(--blue); }
  .cat-btn.active { font-weight: 600; }
  .cat-label { display: flex; align-items: center; gap: 0.5rem; flex: 1; }
  .cat-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .cat-count { font-family: "Space Mono", monospace; font-size: 0.7rem; padding: 0.1rem 0.45rem; border-radius: 100px; min-width: 26px; text-align: center; flex-shrink: 0; background: rgba(0,0,0,0.06); color: var(--muted); }
  .cat-btn.active .cat-count { color: #fff; }
  .subcat-list { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
  .subcat-list.open { max-height: 600px; }
  .cat-expand-icon { transition: transform 0.2s; color: var(--muted); flex-shrink: 0; }
  .cat-expand-icon.open { transform: rotate(90deg); }
  .subcat-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0.35rem 1rem 0.35rem 2rem; border: none; background: none; cursor: pointer; font-family: "DM Sans", sans-serif; font-size: 0.8rem; color: var(--muted); text-align: left; gap: 0.5rem; transition: background 0.15s, color 0.15s; }
  .subcat-btn:hover { background: var(--bg); color: var(--text); }
  .subcat-btn.active { background: var(--bg); color: var(--text); font-weight: 600; }
  .subcat-count { font-family: "Space Mono", monospace; font-size: 0.65rem; padding: 0.1rem 0.4rem; border-radius: 100px; background: rgba(0,0,0,0.06); color: var(--muted); flex-shrink: 0; }
  .divider { height: 1px; background: var(--border); margin: 0.75rem 1rem; }

  /* MAIN */
  main { padding: 1.75rem 2rem; }
  .alpha-nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 1.5rem; }
  .alpha-btn { font-family: "Space Mono", monospace; font-size: 0.72rem; padding: 0.25rem 0.45rem; border: 1px solid var(--border); background: var(--surface); border-radius: 5px; cursor: pointer; color: var(--muted); transition: all 0.15s; }
  .alpha-btn:hover { border-color: var(--blue); color: var(--blue); }
  .alpha-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .alpha-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }

  .results-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; min-height: 28px; }
  .results-count { font-size: 0.85rem; color: var(--muted); }
  .results-count strong { color: var(--text); }
  .sort-select { font-family: "DM Sans", sans-serif; font-size: 0.8rem; padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; outline: none; }

  /* CARDS */
  .cards-grid { display: grid; gap: 0.875rem; }
  .card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.1rem 1.25rem; cursor: pointer; transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s; border-left-width: 3px; }
  .card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .card.expanded { box-shadow: 0 0 0 2px rgba(0,87,184,0.1); }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .card-title-area { flex: 1; min-width: 0; }
  .card-pojem { font-size: 1rem; font-weight: 600; line-height: 1.4; color: var(--text); }
  .card-pojem mark { background: #fff3b0; border-radius: 2px; padding: 0 1px; color: inherit; }
  .card-zkratka { font-family: "Space Mono", monospace; font-size: 0.8rem; font-weight: 500; color: #b45309; margin-left: 3px; }
  .card-doslovny { font-size: 0.78rem; color: var(--muted); font-style: italic; margin-top: 0.2rem; line-height: 1.4; }
  .card-doslovny mark { background: #fff3b0; border-radius: 2px; padding: 0 1px; color: inherit; font-style: normal; }
  .card-meta { display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.5rem; }
  .card-meta-primary { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .card-meta-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .tag { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 100px; font-weight: 600; white-space: nowrap; }
  .tag-cat { background: #eef4ff; color: #2563eb; }
  .tag-sub { background: #1e293b; color: #fff; border: 1px solid #1e293b; }
  .tag-extra { font-size: 0.65rem !important; padding: 0.12rem 0.45rem !important; font-weight: 400 !important; background: var(--bg) !important; border: 1px solid var(--border) !important; color: var(--muted) !important; }
  .tag-extra:hover { background: var(--blue-light) !important; color: var(--blue) !important; border-color: var(--blue) !important; }
  .card-chevron { color: var(--muted); flex-shrink: 0; margin-top: 3px; transition: transform 0.2s; }
  .card.expanded .card-chevron { transform: rotate(180deg); }
  .card-body { display: none; margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid var(--border); animation: fadeIn 0.2s ease; }
  .card.expanded .card-body { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .card-popis { font-size: 0.9rem; line-height: 1.7; color: #374151; }
  .card-popis mark { background: #fff3b0; border-radius: 2px; padding: 0 1px; color: inherit; }

  /* KONTEXT STROM */
  .card-kontext { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); }
  .kontext-label { font-family: "Space Mono", monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.45rem; }
  .kontext-tree { display: flex; align-items: center; flex-wrap: wrap; gap: 0; }
  .kontext-node { font-size: 0.75rem; color: var(--muted); white-space: nowrap; cursor: pointer; padding: 0.15rem 0.4rem; border-radius: 4px; transition: background 0.15s, color 0.15s; }
  .kontext-node:hover { background: var(--blue-light); color: var(--blue); }
  .kontext-node.current { font-weight: 600; color: var(--text); background: var(--bg); }
  .kontext-arrow { font-size: 0.7rem; color: #cbd5e1; margin: 0 0.1rem; }

  /* TAGY */
  .tag-extra { display: inline-block; font-size: 0.72rem; padding: 0.15rem 0.5rem; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: background 0.15s, color 0.15s; }
  .tag-extra:hover { background: var(--blue-light); color: var(--blue); border-color: var(--blue); }

  /* VIZ TAKÉ */
  .viz-take { margin-top: 0.85rem; padding-top: 0.75rem; border-top: 1px dashed var(--border); }
  .viz-take-label { font-family: "Space Mono", monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.45rem; }
  .viz-take-links { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .viz-take-link { font-size: 0.78rem; color: var(--blue); background: var(--blue-light); border: 1px solid #c7d9f5; border-radius: 5px; padding: 0.15rem 0.55rem; cursor: pointer; transition: background 0.15s; text-decoration: none; }
  .viz-take-link:hover { background: #dbeafe; }

  /* Oddělovač primární/sekundární pojmy */
  .subcat-divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0 1rem; color: var(--muted); font-size: 0.72rem; font-family: "Space Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }
  .subcat-divider::before, .subcat-divider::after { content: ''; flex: 1; height: 2px; background: var(--border); }

  .card-link { display: inline-flex; align-items: center; gap: 0.35rem; color: #0057b8; font-size: 0.8rem; font-weight: 500; text-decoration: none; margin-top: 0.75rem; padding: 0.3rem 0.7rem; background: #eef4ff; border-radius: 6px; border: 1px solid #c7d9f5; }
  .card-link:hover { background: #dbeafe; }
  .card-link svg { flex-shrink: 0; }

  .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text); }

  /* SIDEBAR TABS */
  /* CARD TABS */
  .card-tabs { display: flex; gap: 0; margin-bottom: 0.9rem; border-bottom: 1px solid var(--border); }
  .card-tab { background: none; border: none; padding: 0.4rem 0.85rem; font-family: "DM Sans", sans-serif; font-size: 0.8rem; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s; }
  .card-tab:hover { color: var(--text); }
  .card-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
  .card-tab-content.hidden { display: none; }
  .kontext-group-title { font-size: 0.72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.6rem; }
  .tree-node.highlighted { font-weight: 700; box-shadow: 0 0 0 2px var(--blue); }

  /* TREE VISUALIZATION */
  .tree-wrap { overflow-x: auto; padding-bottom: 0.5rem; }
  .tree { list-style: none; padding: 0; margin: 0; }
  .tree ul { list-style: none; padding-left: 1.5rem; margin: 0; position: relative; }
  .tree li { position: relative; padding: 0.25rem 0; }
  .tree ul::before { content: ''; position: absolute; top: 0; bottom: 0.75rem; left: 0.625rem; width: 1px; background: var(--border); }
  .tree li::before { content: ''; position: absolute; top: 0.85rem; left: -0.875rem; width: 0.875rem; height: 1px; background: var(--border); }
  .tree > li::before { display: none; }

  .tree-node { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.65rem; border-radius: 20px; font-size: 0.8rem; cursor: pointer; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); white-space: nowrap; transition: all 0.15s; font-family: "DM Sans", sans-serif; max-width: 260px; }
  .tree-node:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); box-shadow: 0 1px 6px rgba(0,87,184,0.12); }
  .tree-node.root { font-weight: 700; font-size: 0.875rem; border-width: 2px; padding: 0.4rem 0.9rem; }
  .tree-node.missing { opacity: 0.45; cursor: default; border-style: dashed; }
  .tree-node.missing:hover { border-color: var(--border); color: var(--text); background: var(--surface); box-shadow: none; }
  .tree-node-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-node-abbr { font-family: "Space Mono", monospace; font-size: 0.68rem; color: #b45309; flex-shrink: 0; }

  .group-empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    aside { display: none; }
    main { padding: 1rem; }
    .header-stats { display: none; }
  }
</style>

const DATA = [{"datum":"2026-03-19","pojem":"AB-Roll kontejner","doslovny":"AB-Roll container","zkratka":"","popis":"Mobilní zásobník vodíku konstruovaný pro hákový systém nakládání (AB-Roll), umožňující rychlou výměnu kontejneru bez nutnosti speciální manipulační techniky. Ve vodíkové infrastruktuře slouží jako flexibilní řešení pro přepravu a dočasné skladování stlačeného vodíku, alternativa k návěsu s MEGC.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Návěs; Přeprava vodíku; Tlaková nádoba; Víceprvkový kontejner na plyn","tagy":"Skladování; Plnění a výdej","url":""},{"datum":"2025-03-10","pojem":"Adaptivní regulace","doslovny":"","zkratka":"","popis":"Automatické přizpůsobení provozních parametrů (např. tlaku, průtoku) na základě aktuálních podmínek.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Elektrolyzér; Průtoková regulace; Komprese vodíku","tagy":"Komponenty a zařízení; Plnění a výdej; Fyzika","url":""},{"datum":"2025-04-29","pojem":"Adicionalita","doslovny":"Additionality","zkratka":"","popis":"Požadavek stanovený Delegovaným aktem Evropské komise k směrnici RED, podle něhož musí být elektřina využívaná k výrobě RFNBO získávána z nově vybudovaných obnovitelných zdrojů energie. Konkrétně to znamená, že napájející OZE nesmí být uveden do provozu dříve než 36 měsíců před spuštěním elektrolyzéru a zároveň nesmí čerpat provozní ani investiční podporu. Cílem je zajistit, aby výroba vodíku skutečně přinášela dodatečnou kapacitu OZE do energetické soustavy, nikoli pouze přesměrovávala již existující zelenou elektřinu. Pro elektrolyzéry uvedené do provozu před rokem 2028 platí přechodná výjimka platná do roku 2038.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Časová korelace; Geografická korelace; Delegovaný Akt RFNBO (2023/1184); Zelený vodík","tagy":"Elektrolýza; Energetický trh","url":""},{"datum":"2026-03-03","pojem":"AEM elektrolyzér","doslovny":"Anion exchange membrane electrolyzers","zkratka":"","popis":"Představuje moderní technologii pro výrobu zeleného vodíku, která kombinuje výhody klasické alkalické elektrolýzy a PEM (nízké náklady, žádné ušlechtilé kovy jako iridium) s vysokou flexibilitou a rychlým náběhem (<3 min). Je ideální pro modulární, decentralizované aplikace a podporu obnovitelných zdrojů.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"PEM elektrolyzér; Aniontová výměnná membrána; Elektrolyzér; Membránová elektrodová sestava","tagy":"Palivové články; Chemie; Materiály","url":""},{"datum":"2025-04-29","pojem":"Agentura Evropské unie pro spolupráci energetických regulačních orgánů","doslovny":"European Union Agency for the Cooperation of Energy Regulators","zkratka":"ACER","popis":"Podporuju spolupráci mezi vnitrostátními regulačními orgány v oblasti energetiky v EU (fungování jednotného evropského trhu s elektřinou a se zemním plynem). V budoucnu bude do gesce ACER spadat i jednotný trh s vodíkem.","kategorie":"Instituce a organizace","subkategorie":"","souvisejici":"Nabídková zóna; Směrnice (EU) 2024/1788; Provozovatelé vodíkových přenosových sítí","tagy":"Evropská legislativa a strategie; Energetický trh","url":""},{"datum":"2025-04-29","pojem":"Akcelerační zóna","doslovny":"","zkratka":"","popis":"Konkrétní místo nebo oblast (pevnina, moře, vnitrozemské vody), které byly členským státem určeny za zvláště vhodné pro instalaci zařízení na výrobu energie z obnovitelných zdrojů. Státy k tomu vyzývá směrnice RED. Bude zde zjednodušené řízení pro výstavbu OZE; směrnice RED stanoví přímo, jakým způsobem a v jakých lhůtách bude v akceleračních zónách probíhat povolovací řízení pro výstavbu obnovitelných zdrojů energie.","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"Evropská vodíková banka; Net-Zero Industry Act; Delegovaný Akt RFNBO (2023/1184)","tagy":"Evropská legislativa a strategie; Elektrolýza","url":""},{"datum":"2026-03-30","pojem":"Akceptační zkoušení na místě","doslovny":"Site Acceptance Test","zkratka":"SAT","popis":"Zkoušky prováděné na místě instalace k ověření funkčnosti nebo integrity zařízení po jeho dodání a montáži. Navazuje na akceptační zkoušení ve výrobním závodě (FAT) a ověřuje správnou funkci v reálných provozních podmínkách.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Akceptační zkoušení ve výrobním závodě; Odborně způsobilá osoba","tagy":"Certifikace","url":""},{"datum":"2026-03-30","pojem":"Akceptační zkoušení ve výrobním závodě","doslovny":"Factory Acceptance Test","zkratka":"FAT","popis":"Zkoušky provedené na zařízení ve výrobním závodě k ověření funkčnosti nebo integrity před jeho odesláním na místo instalace. U vodíkové infrastruktury zahrnuje ověření těsnosti, funkce bezpečnostních prvků a shody s projektovou dokumentací.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Akceptační zkoušení na místě; Odborně způsobilá osoba","tagy":"Certifikace","url":""},{"datum":"2026-03-19","pojem":"Alkalická elektrolýza vody","doslovny":"Alkaline water electrolyzes","zkratka":"AWE","popis":"Elektrolyzér využívající alkalický roztok jako elektrolyt pro elektrolýzu vody, také označovaný jako AEL (Alkaline Electrolyzer). Nejstarší a nejrozšířenější technologie elektrolýzy, vyznačující se nižšími investičními náklady a dlouhou životností. Oproti PEM elektrolyzéru pracuje při nižším tlaku a je méně flexibilní při rychlých změnách výkonu.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Alkalický elektrolyzér; PEM elektrolyzér; AEM elektrolyzér; Elektrolyt; Elektrolyzér","tagy":"Chemie; Palivové články","url":""},{"datum":"2026-03-19","pojem":"Alkalický elektrolyzér","doslovny":"Alkaline Electrolyzer","zkratka":"AEL","popis":"Elektrolyzér využívající alkalický roztok (nejčastěji hydroxid draselný nebo sodný) jako elektrolyt. Nejstarší a nejrozšířenější technologie elektrolýzy vody, vyznačující se nižšími investičními náklady a dlouhou životností. Oproti PEM elektrolyzéru pracuje při nižším tlaku a je méně flexibilní při rychlých změnách výkonu.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Elektrolyzér; PEM elektrolyzér; AEM elektrolyzér; Elektrolyt","tagy":"Chemie; Komponenty a zařízení","url":""},{"datum":"2025-04-29","pojem":"Alternativní paliva","doslovny":"Odkaz","zkratka":"","popis":"Paliva nebo zdroje energie, které v rámci energie používané v dopravě slouží alespoň zčásti jako náhrada zdrojů fosilních paliv a které mají potenciál přispět k její dekarbonizaci a zvýšit environmentální výkonnost odvětví dopravy. Zahrnují elektřinu, vodík, amoniak a obnovitelná paliva jako bioplyn. Alternativní paliva jsou definována v čl. 2 Nařízení o zavádění infrastruktury pro alternativní paliva.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"E-paliva; Nařízení o infrastruktuře pro alternativní paliva; Vodík","tagy":"Mobilita; Evropská legislativa a strategie; Certifikace","url":""},{"datum":"2025-08-07","pojem":"Ammoniak","doslovny":"Amonia","zkratka":"NH₃","popis":"Lze využít jako nosiče vodíku, který může být ekonomicky výhodný pro přepravu na velké vzdálenosti.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Kapalné organické nosiče vodíku; Deriváty vodíku; Vodíkový terminál; Přeprava vodíku","tagy":"Přeprava a distribuce; Skladování; Termochemické procesy","url":""},{"datum":"2025-03-10","pojem":"Analyzátor plynů","doslovny":"","zkratka":"","popis":"Zařízení pro detekci a měření složení plynné směsi, zejména koncentrace vodíku.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Filtrace plynů; Membránový separátor; Tlaková adsorpce","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-03-12","pojem":"Aniontová výměnná membrána","doslovny":"Anion exchange membrane","zkratka":"AEM","popis":"Speciální membrána, která propouští anionty a blokuje kationty. Tyto membrány jsou klíčovými komponenty různých elektrochemických zařízení, jako jsou palivové články, vodní elektrolyzéry a redoxní průtokové baterie. AEM se skládají z polymerního základu s kladně nabitými funkčními skupinami, které umožňují transport aniontů, obvykle za pomoci molekul vody.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"AEM elektrolyzér; Protonová výměnná membrána; Elektrolyt; Membránová elektrodová sestava","tagy":"Chemie; Palivové články; Materiály","url":""},{"datum":"2025-04-29","pojem":"Aukce jako služba","doslovny":"Auction as a service","zkratka":"A-as-a-S","popis":"Platforma pro členské státy EU, skrze kterou mohou státy vyčlenit část svých vlastních finančních prostředků do Evropské vodíkové banky. O tyto prostředky pak mohou soutěžit jen projekty z daného členského státu. Aukce probíhají společně s aukcí Evropské vodíkové banky v rámci Inovačního fondu.","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Evropská vodíková banka; Akcelerační zóna","tagy":"Evropská legislativa a strategie; Podpora a pobídky","url":""},{"datum":"2025-08-12","pojem":"Autotermní reforming","doslovny":"Autothermal reforming","zkratka":"ATR","popis":"Pokročilá průmyslová technologie pro výrobu syntézního plynu (směs vodíku a oxidu uhelnatého), která kombinuje parní reforming a částečnou oxidaci v jednom reaktoru. Hlavní výhodou je, že proces je energeticky soběstačný (autotermní), protože teplo potřebné pro endotermní reakci parního reformingu se generuje přímo v reaktoru exotermní reakcí částečné oxidace.","kategorie":"Výroba","subkategorie":"Reformování","souvisejici":"Parní reforming metanu; Částečná (parciální) oxidace; Katalytická částečná oxidace; Modrý vodík","tagy":"Termochemické procesy; Certifikace; Chemie","url":""},{"datum":"2026-03-19","pojem":"Bar","doslovny":"Bar","zkratka":"bar","popis":"Jednotka tlaku rovnající se přibližně jedné atmosféře (100 000 Pa). Ve vodíkové infrastruktuře se běžně používá pro vyjádření pracovních tlaků — například 350 bar (H35) nebo 700 bar (H70) pro plnění vozidel, nebo stovky až tisíc bar pro přepravu a skladování.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Nominální pracovní tlak; Maximální pracovní tlak; Tlaková třída 350 bar; Tlaková třída 700 bar; Tlaková nádoba","tagy":"Plnění a výdej; Skladování; Komponenty a zařízení","url":""},{"datum":"2026-03-23","pojem":"Bezemisní doprava","doslovny":"Zero-emission transport","zkratka":"","popis":"Doprava využívající pohonné systémy bez přímých emisí škodlivin v místě provozu. Zahrnuje vozidla s palivovými články na vodík, bateriová elektrická vozidla a další nízkoemisní technologie. Klíčový cíl evropské dopravní politiky v rámci Zelené dohody pro Evropu.","kategorie":"Technologie využití vodíku","subkategorie":"Mobilita","souvisejici":"Elektrické vozidlo s palivovým článkem; Vodíkové vozidlo s palivovým článkem; Vodíkové spalovací motory; Zelená dohoda pro Evropu; Nařízení o infrastruktuře pro alternativní paliva","tagy":"Evropská legislativa a strategie; Certifikace","url":""},{"datum":"2026-03-30","pojem":"Bezpečná vzdálenost","doslovny":"Safety distance","zkratka":"","popis":"Nejmenší vzdálenost mezi zdrojem nebezpečí a chráněným cílem, která zmírní účinek předvídatelného incidentu a zabrání jeho eskalaci. U vodíkové infrastruktury stanovena normami a legislativou pro plnicí stanice, elektrolyzéry a skladovací zařízení.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Posuzování rizika; Směrnice ATEX; Plynný vodík – Čerpací stanice – Obecné požadavky","tagy":"Certifikace; Přeprava a distribuce","url":""},{"datum":"2026-03-23","pojem":"Bezpečnostní list vodíku","doslovny":"Safety Data Sheet","zkratka":"SDS / MSDS","popis":"Standardizovaný dokument obsahující informace o vlastnostech vodíku, rizicích při manipulaci, bezpečnostních opatřeních, první pomoci a postupech při úniku nebo požáru. Vydává se v souladu s nařízením REACH a je povinnou součástí dokumentace při skladování a přepravě vodíku.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Nařízení o registraci, hodnocení, povolování a omezování chemických látek; Detekce vodíku; Výbušná atmosféra; Evropská dohoda o mezinárodní silniční přepravě nebezpečných; Inertizace","tagy":"Přeprava a distribuce; Plnění a výdej","url":""},{"datum":"2025-08-12","pojem":"Biofotolýza","doslovny":"Biolysis","zkratka":"","popis":"Biotechnologický proces, při němž mikroorganismy (řasy nebo sinice) využívají sluneční energii k přímému štěpení molekul vody (H₂O) na vodík (H₂) a kyslík (O₂). Probíhá za normální teploty a atmosférického tlaku a jde o jednu z ekologicky nejšetrnějších metod výroby zeleného vodíku.","kategorie":"Výroba","subkategorie":"Biologické procesy","souvisejici":"Bio-vodík; Fotokatalýza; Fotofermentace","tagy":"Chemie; Fyzika","url":""},{"datum":"2025-08-12","pojem":"Bio-termolýza","doslovny":"","zkratka":"","popis":"Pokročilý termochemický proces, při kterém dochází k rozkladu organických materiálů (biomasy, odpadů) působením tepla bez přístupu kyslíku. Tento proces je součástí cirkulární ekonomiky, protože přeměňuje odpad na využitelné suroviny – plyn (obsahující H₂, CO, CO ₂, CH₄), kapalinu a tuhý zbytek (biochar).","kategorie":"Výroba","subkategorie":"Biologické procesy","souvisejici":"Pyrolýza; Bio-vodík; Zplyňování; Termolýza","tagy":"Termochemické procesy; Chemie","url":""},{"datum":"2025-08-12","pojem":"Bio-vodík","doslovny":"","zkratka":"","popis":"Produkce vodíku z biomasy pomocí biologických procesů.","kategorie":"Výroba","subkategorie":"Biologické procesy","souvisejici":"Biofotolýza; Tmavá fermentace; Fotofermentace; Bio-termolýza","tagy":"Certifikace; Alternativní nosiče","url":""},{"datum":"2026-03-19","pojem":"Buffer","doslovny":"Buffer storage","zkratka":"","popis":"Vyrovnávací zásobník umístěný mezi elektrolyzérem a kompresorem nebo tlakovou kaskádou, sloužící ke stabilizaci tlaku a vyrovnávání rozdílů mezi kontinuální výrobou vodíku a nesouvislou kompresí. Zajišťuje plynulý provoz systému a chrání komponenty před tlakovými výkyvy.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Mezisklad vodíku; Elektrolyzér; Kompresor; Tlaková kaskáda; Adaptivní regulace","tagy":"Plnění a výdej; Elektrolýza; Komponenty a zařízení","url":""},{"datum":"2026-03-30","pojem":"Celková kapitálová investice","doslovny":"Total Capital Investment","zkratka":"TCI","popis":"Celkové náklady na výstavbu a uvedení projektu do provozu, zahrnující přímé i nepřímé investiční náklady. V kontextu vodíkových projektů zahrnuje náklady na elektrolyzér, kompresory, zásobníky, plnicí infrastrukturu a další zařízení.","kategorie":"Ekonomika a trh","subkategorie":"Náklady a financování","souvisejici":"Kapitálové výdaje; Provozní výdaje; Nivelizované náklady na vodík; Smlouva o odběru","tagy":"Obchodní modely","url":""},{"datum":"2026-03-30","pojem":"Celoevropská vodíková aukce","doslovny":"European hydrogen auction","zkratka":"","popis":"Soutěžní mechanismus Evropské vodíkové banky pro podporu výroby obnovitelného vodíku. Vítězné projekty získávají fixní provozní bonus na každý kilogram vyrobeného vodíku po dobu prvních 10 let provozu, vyplácený nad rámec tržní ceny. Uspějí projekty s nejnižším požadavkem na výši bonusu. Účastníci musí splnit přísná kritéria včetně bankovní záruky a uvedení projektu do provozu do 5 let od podpisu smlouvy.","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"Evropská vodíková banka; Pay-as-bid aukce; Aukce jako služba","tagy":"Evropská legislativa a strategie; Energetický trh","url":""},{"datum":"2025-04-29","pojem":"Certifikát udržitelnosti","doslovny":"Certificate of sustainability","zkratka":"","popis":"Dokument sloužící k ověření, že dané palivo splňuje kritéria udržitelnosti stanovená směrnicí RED. Vydává se na jednotku energie a jeho fungování je založeno na principu hmotnostní bilance – na rozdíl od záruky původu, která dokládá obnovitelný původ energie. Certifikát udržitelnosti lze vydat na RFNBO, biometan, biomasu nebo biopaliva a slouží k prokazování plnění cílů definovaných ve směrnici RED.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Záruka původu; Delegovaný Akt RFNBO (2023/1184); Zelený vodík; Adicionalita","tagy":"Elektrolýza; Evropská legislativa a strategie","url":"Certifikáty udržitelnosti jsou často zaměňovány se zárukami původu. Jedná se však o dva odlišné nástroje: zatímco záruka původu dokládá, odkud energie pochází, certifikát udržitelnosti ověřuje, zda splňuje environmentální požadavky na udržitelnost."},{"datum":"2026-03-16","pojem":"Coriolisův hmotnostní průtokoměr","doslovny":"Coriolis mass flow meter","zkratka":"","popis":"Typ hmotnostního průtokoměru využívající Coriolisův efekt k přímému měření hmotnostního průtoku, hustoty a teploty kapaliny nebo plynu. Ve vodíkových čerpacích stanicích patří k preferovaným řešením pro fakturační měření díky vysoké přesnosti i při proměnlivých podmínkách tlaku a teploty.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Hmotnostní průtokoměr; Průtokoměr; Hmotnostní průtok vodíku","tagy":"Plnění a výdej","url":""},{"datum":"2025-04-29","pojem":"Časová korelace","doslovny":"Temporall correlation","zkratka":"","popis":"Požadavek stanovený Delegovaným aktem Evropské komise k směrnici RED, podle něhož musí být spotřeba elektřiny v elektrolyzéru časově sladěna s výrobou elektřiny z obnovitelného zdroje. Shoda se prokazuje ve stanovených časových intervalech – zpravidla na měsíční nebo hodinové bázi. Cílem je zajistit, aby vodík byl vyráběn skutečně v době, kdy je k dispozici obnovitelná elektřina, a předejít tak situaci, kdy elektrolyzér fakticky odebírá elektřinu z konvenčních zdrojů.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Adicionalita; Geografická korelace; Delegovaný Akt RFNBO (2023/1184)","tagy":"Elektrolýza; Energetický trh","url":""},{"datum":"2025-08-12","pojem":"Částečná (parciální) oxidace","doslovny":"Partial oxidation","zkratka":"POX","popis":"Chemický proces, při němž uhlovodíky reagují s omezeným množstvím kyslíku (nebo vodní páry) za vysokých teplot (> 1000 °C) na syntézní plyn (CO + H₂). Na rozdíl od spalování nevzniká úplný oxid uhličitý a voda, ale meziprodukty, které jsou klíčové pro výrobu vodíku, methanolu a chemikálií.","kategorie":"Výroba","subkategorie":"Reformování","souvisejici":"Katalytická částečná oxidace; Autotermní reforming; Parní reforming","tagy":"Termochemické procesy; Certifikace; Chemie","url":""},{"datum":"2025-08-07","pojem":"Čerpací stanice na kapalný vodík","doslovny":"Liquid Hydrogen Refueling Station","zkratka":"LHRS","popis":"Čerpací stanice, které skladují vodík v kapalném stavu a využívají inovativní strategie předchlazení pro snížení spotřeby energie při tankování.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Kapalný vodík; Kryogenní technologie; Systém předchlazení plyn-kapalina; Podchlazený vodík","tagy":"Skladování; Mobilita; Komponenty a zařízení","url":""},{"datum":"2026-03-19","pojem":"Čistota vodíku","doslovny":"Hydrogen purity","zkratka":"","popis":"Jeden z klíčových parametrů kvality vodíku vyjadřující podíl čistého vodíku v plynu v procentech. Pro aplikace v palivových článcích je vyžadován stupeň 5.0 (99,999 %), přičemž zbývající nečistoty musí splňovat limity stanovené normami ČSN ISO 14687 a ČSN EN 17124.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Kvalita vodíku; Kvalita vodíkového paliva – Specifikace produktu; Vodíkové palivo – Specifikace produktu a zabezpečení kvality – Aplikace PEM palivových článků pro silniční vozidla; Palivový článek; Analyzátor plynů; Filtrace plynů","tagy":"Plnění a výdej; Palivové články; Elektrolýza","url":""},{"datum":"2025-04-29","pojem":"Delegovaný Akt GHG (2023/1185)","doslovny":"Odkaz","zkratka":"DA GHG (2023/1185)","popis":"Nařízení v přenesené pravomoci stanovující minimální hodnoty pro úspory emisí skleníkových plynů z recyklovaných paliv s obsahem uhlíku a upřesněním metodiky pro posuzování úspor emisí skleníkových plynů z kapalných a plynných paliv z obnovitelných zdrojů nebiologického původu používaných v odvětví dopravy a z recyklovaných paliv s obsahem uhlíku.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Směrnice o obnovitelných zdrojích energie; Certifikát udržitelnosti; Zelený vodík","tagy":"Certifikace; Reformování","url":""},{"datum":"2025-04-29","pojem":"Delegovaný Akt k EU ETS (2024/873)","doslovny":"Odkaz","zkratka":"DA EU ETS (2024/873)","popis":"Nařízení v přenesené pravomoci, pokud jde o přechodná pravidla harmonizovaného přidělování bezplatných povolenek na emise.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Směrnice EU ETS 2 (2023/959); Mechanismus uhlíkového vyrovnání na hranicích (2023/956)","tagy":"Energetický trh; Certifikace","url":""},{"datum":"2025-04-29","pojem":"Delegovaný Akt RFNBO (2023/1184)","doslovny":"Odkaz","zkratka":"DA RFNBO (2023/1184)","popis":"Nařízení v přenesené pravomoci stanovující unijní metodiku, v níž jsou vymezena podrobná pravidla pro výrobu kapalných a plynných paliv z obnovitelných zdrojů nebiologického původu používaných v odvětví dopravy.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Adicionalita; Časová korelace; Geografická korelace; Kapalná a plynná paliva nebiologického původu","tagy":"Certifikace; Elektrolýza","url":""},{"datum":"2026-03-23","pojem":"Demineralizační jednotka","doslovny":"Demineralization unit","zkratka":"","popis":"Zařízení pro přípravu vysoce čisté demineralizované vody odstraněním minerálů, iontů a nečistot. Ve vodíkových technologiích je nezbytnou součástí elektrolyzérů, kde kvalita vstupní vody přímo ovlivňuje životnost membrán a katalyzátorů.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Elektrolyzér; Elektrolýza; Membránová elektrodová sestava","tagy":"Komponenty a zařízení; Chemie","url":""},{"datum":"2025-04-29","pojem":"Deriváty vodíku","doslovny":"","zkratka":"","popis":"Chemické sloučeniny odvozené od molekul vodíku, které slouží především k jeho efektivnímu transportu a skladování na delší vzdálenosti. Ve srovnání s plynným vodíkem disponují vyšší energetickou hustotou, což je činí praktičtějšími pro přepravu i dlouhodobé uchování energie. Typickými příklady jsou čpavek (amoniak), methanol nebo e-paliva.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Ammoniak; Kapalné organické nosiče vodíku; E-metan; E-metanol","tagy":"Přeprava a distribuce; Skladování; Certifikace","url":"V širším chemickém kontextu se deriváty vodíku označují také látky vzniklé nahrazením atomů vodíku v uhlovodících jinými prvky – například chlorem, dusíkem, kyslíkem nebo sírou – přičemž vznikají halogenderiváty, dusíkaté nebo kyslíkaté sloučeniny."},{"datum":"2026-03-30","pojem":"Desetiletý plán rozvoje sítě","doslovny":"Ten-Year Network Development Plan","zkratka":"TYNDP","popis":"Strategický dokument zpracovávaný provozovateli přepravních soustav, který mapuje plánovaný rozvoj energetické přepravní infrastruktury na období 10 let. Pro vodíkovou infrastrukturu ho na evropské úrovni zpracovává ENNOH. Slouží jako základ pro investiční rozhodování, koordinaci přeshraničních projektů a identifikaci infrastrukturních nedostatků.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Evropská vodíková páteřní soustava; Postup Open Season; Evropská síť provozovatelů vodíkových sítí","tagy":"Evropská legislativa a strategie; Energetický trh","url":""},{"datum":"2026-03-23","pojem":"Detekce vodíku","doslovny":"Hydrogen detection","zkratka":"","popis":"Systém kontinuálního monitorování koncentrace vodíku v uzavřených nebo polouzavřených prostorách za účelem včasného odhalení úniku. Při překročení nastavených prahových hodnot — spouští výstražné signály nebo bezpečnostní opatření jako odstavení systému nebo nucené větrání.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Dolní mez výbušnosti; Výbušná atmosféra; Inertizace; Elektrostatický výboj; Pojistný ventil","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-03-10","pojem":"Diferenciální tlak","doslovny":"","zkratka":"Δp","popis":"Rozdíl tlaku naměřený mezi dvěma libovolnými body systému. Využívá se zejména při řízení průtoku, měření výkonu kompresorů nebo monitorování stavu filtrů a ventilů. V praxi je diferenciální tlak klíčovým parametrem pro regulaci a diagnostiku tlakových systémů.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Tlaková ztráta; Tlakový spád; Kompresor","tagy":"Komponenty a zařízení; Plnění a výdej","url":""},{"datum":"2026-03-30","pojem":"Digitální dvojče","doslovny":"Digital twin","zkratka":"","popis":"Virtuální model fyzického systému nebo zařízení (např. elektrolyzéru, plnicí stanice), který odráží jeho chování na základě provozních dat. Slouží k simulaci provozu, testování hypotéz a scénářů, predikci poruch a optimalizaci — bez zásahu do reálného systému.","kategorie":"Věda a výzkum","subkategorie":"","souvisejici":"Simulace plnění vodíkem","tagy":"Elektrolýza; Plnění a výdej","url":""},{"datum":"2025-04-29","pojem":"Distribuční soustava","doslovny":"","zkratka":"","popis":"Vzájemně propojený soubor vedení a zařízení sloužící k zajištění distribuce (dopravy) elektřiny, zemního plynu či vodíku zákazníkům na vymezeném území.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Vodíková distribuční soustava; Míchání; Směrnice (EU) 2024/1788","tagy":"Skladování; Evropská legislativa a strategie","url":""},{"datum":"2026-03-30","pojem":"Dobrovolná certifikační schémata","doslovny":"Voluntary schemes","zkratka":"","popis":"Schémata uznaná Evropskou komisí k certifikaci obnovitelných paliv nebiologického původu (RFNBO) — zahrnující obnovitelný vodík, čpavek, metanol a e-paliva. Zajišťují je společnosti CertifHy, ISCC a REDcert. Cílem je umožnit výrobcům získat certifikát udržitelnosti prokazující plnění cílů směrnice RED.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Delegovaný Akt RFNBO (2023/1184); Certifikát udržitelnosti; Směrnice o obnovitelných zdrojích energie","tagy":"Evropská legislativa a strategie","url":""},{"datum":"2026-03-23","pojem":"Dolní mez výbušnosti","doslovny":"Lower Explosive Limit","zkratka":"LEL","popis":"Nejnižší koncentrace vodíku ve vzduchu, při které je směs výbušná a může dojít k výbuchu při kontaktu se zdrojem zapálení. Pro vodík činí přibližně 4 obj. %. Klíčový parametr pro nastavení detekčních systémů a bezpečnostních opatření.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Výbušná atmosféra; Horní mez výbušnosti; Elektrostatický výboj; Inertizace","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2026-03-30","pojem":"Dotlačovací kompresor","doslovny":"Booster compressor","zkratka":"","popis":"Specifický typ kompresoru, který na rozdíl od běžného kompresoru nepracuje s plynem od atmosférického tlaku, ale zvyšuje tlak již stlačeného plynu na vyšší úroveň. U vodíku se používá typicky mezi nízkotlakým zdrojem a vysokotlakým zásobníkem nebo plnicí stanicí.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Kompresor; Komprese vodíku; Přečerpávací kompresor","tagy":"Přeprava a distribuce; Plnění a výdej; Skladování","url":""},{"datum":"2026-03-23","pojem":"Dunkelflaute","doslovny":"","zkratka":"","popis":"Německý výraz (doslova „temné bezvětří\") označující období, kdy fotovoltaické elektrárny vyrábějí málo energie kvůli krátkým dnům a oblačnosti a zároveň nefouká vítr pro větrné turbíny. Tato situace trvající dny až týdny způsobuje kritický pokles výroby z obnovitelných zdrojů a zvyšuje potřebu záložních zdrojů a dlouhodobého skladování energie — například ve formě vodíku.\"","kategorie":"Ekonomika a trh","subkategorie":"Energetický trh","souvisejici":"Power to hydrogen; Podzemní skladování vodíku; Sezónní skladování vodíku; Obnovitelné zdroje energie","tagy":"Skladování; Obchodní modely","url":""},{"datum":"2026-03-30","pojem":"Dvojité blokování s odfouknutím","doslovny":"Double Block and Bleed","zkratka":"DBB","popis":"Typ ventilového provedení zajišťující dvojitou izolaci potrubního systému — dva uzavírací ventily s odfouknutím prostoru mezi nimi. Umožňuje bezpečnou izolaci úseku potrubí při údržbě nebo opravě bez nutnosti odstavení celého systému. V vodíkové infrastruktuře vyžaduje materiálovou kompatibilitu s vodíkem.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Posuzování rizika; Směrnice ATEX","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2026-03-30","pojem":"Dynamická aukce","doslovny":"Descending clock auction","zkratka":"","popis":"Typ aukce, při které cena postupně klesá a účastníci průběžně deklarují, jaké množství jsou za danou cenu schopni dodat. Proces pokračuje, dokud nabízené množství neodpovídá poptávanému objemu. Oproti statické aukci umožňuje účastníkům reagovat na vývoj ceny v reálném čase.","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"Statická aukce; Pay-as-bid aukce; Celoevropská vodíková aukce","tagy":"Energetický trh; Evropská legislativa a strategie","url":""},{"datum":"2025-03-10","pojem":"Dynamická viskozita","doslovny":"","zkratka":"","popis":"Míra odporu vodíku vůči proudění při daných podmínkách.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Škrcení průtoku; Joule-Thomsonův jev; Hmotnostní průtok vodíku","tagy":"Přeprava a distribuce; Komponenty a zařízení","url":""},{"datum":"2025-03-10","pojem":"Elektrické vozidlo s palivovým článkem","doslovny":"Fuel Cell Electric Vehicle","zkratka":"FCEV","popis":"Elektromobil, který k výrobě elektřiny pohánějící jeho motor využívá palivový článek namísto baterie.","kategorie":"Technologie využití vodíku","subkategorie":"Mobilita","souvisejici":"Palivový článek; Tlaková třída 700 bar; Protokoly plnění pro lehká vozidla na plynný vodík; Vodíková čerpací stanice","tagy":"Palivové články; Plnění a výdej","url":""},{"datum":"2026-03-19","pojem":"Elektrický autobus s palivovým článkem","doslovny":"Fuel Cell Electric Bus","zkratka":"FCEB","popis":"Autobus poháněný palivovým článkem, který využívá vodík uložený ve vysokotlakých nádobách jako zdroj energie pro elektromotor. Nevypouští žádné škodlivé emise — jediným výfukovým produktem je vodní pára. Využívá se především v městské hromadné dopravě jako nízkoemisní alternativa k dieselovým autobusům.","kategorie":"Technologie využití vodíku","subkategorie":"Mobilita","souvisejici":"Palivový článek; Elektrické vozidlo s palivovým článkem; Vodíková čerpací stanice; Tlaková třída 350 bar; Tlaková nádoba","tagy":"Plnění a výdej; Palivové články","url":""},{"datum":"2025-08-07","pojem":"Elektroda","doslovny":"Electrode","zkratka":"","popis":"Vodivá součástka, na jejímž povrchu probíhají elektrochemické reakce. Rozlišujeme dva typy: anodu (kladná elektroda [+], kde dochází k oxidaci) a katodu (záporná elektroda [-], kde dochází k redukci). Elektrody jsou klíčovými komponenty elektrolyzérů i palivových článků.","kategorie":"Věda a výzkum","subkategorie":"Chemie","souvisejici":"Elektrolyt; Membránová elektrodová sestava; Elektrolýza; Katalyzátor","tagy":"Elektrolýza; Palivové články","url":""},{"datum":"2025-08-07","pojem":"Elektrolyt","doslovny":"Electrolyte","zkratka":"","popis":"Látka umožňující přenos iontů mezi anodou a katodou. Zároveň funguje jako fyzická bariéra, která zabraňuje přímému mísení plynů (vodíku a kyslíku). Typ elektrolytu zásadně určuje pracovní teplotu, účinnost i oblast použití daného zařízení – podle něj se také rozlišují jednotlivé typy elektrolyzérů a palivových článků (např. PEM, alkalické, SOEC).","kategorie":"Věda a výzkum","subkategorie":"Chemie","souvisejici":"Elektroda; Protonová výměnná membrána; Aniontová výměnná membrána; Membránová elektrodová sestava","tagy":"Elektrolýza; Palivové články; Materiály","url":""},{"datum":"2025-04-29","pojem":"Elektrolýza","doslovny":"Electrolysis","zkratka":"","popis":"Elektrochemický děj, při kterém průchod stejnosměrného proudu taveninou nebo roztokem elektrolytu způsobuje rozklad molekul vody na elektrodách – na katodě dochází k redukci za vzniku vodíku (H₂), na anodě k oxidaci za vzniku kyslíku (O₂). Elektrolýza se využívá k výrobě vodíku, kovů, ke galvanickému pokovování nebo v průmyslu k získávání látek jako chlór či hydroxid sodný.","kategorie":"Věda a výzkum","subkategorie":"Chemie","souvisejici":"Elektrolyzér; Zelený vodík; Elektrolyt; Elektroda","tagy":"Elektrolýza; Certifikace; Fyzika","url":""},{"datum":"2026-03-19","pojem":"Elektrolýza vody s protonovou výměnnou membránou","doslovny":"Proton exchange membrane water electrolyzer","zkratka":"PEM WE","popis":"Elektrolyzér využívající protonovou výměnnou membránu jako elektrolyt pro elektrolýzu vody, také označovaný jako PEM elektrolyzér. Pracuje při vysokém tlaku a vyznačuje se vysokou flexibilitou při rychlých změnách výkonu, což ho předurčuje pro kombinaci s obnovitelnými zdroji energie. Nevýhodou jsou vyšší investiční náklady spojené s použitím drahých kovů — platiny a iridia.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"PEM elektrolyzér; Alkalická elektrolýza vody; AEM elektrolyzér; Protonová výměnná membrána; Membránová elektrodová sestava","tagy":"Chemie; Palivové články","url":""},{"datum":"2025-04-29","pojem":"Elektrolyzér","doslovny":"Electrolyser","zkratka":"","popis":"Zařízení využívající elektrickou energii k odlučování, štěpení nebo transformaci látek prostřednictvím redoxní reakce. Ve vodním elektrolyzéru dochází k rozkladu molekul vody (H₂O) na vodík (H₂) a kyslík (O₂), což je klíčový proces pro výrobu zeleného vodíku z obnovitelných zdrojů.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"PEM elektrolyzér; AEM elektrolyzér; Elektrolyzér s pevným oxidovým elektrolytem; Membránová elektrodová sestava","tagy":"Komponenty a zařízení; Certifikace; Náklady a financování","url":""},{"datum":"2025-03-12","pojem":"Elektrolyzér s pevným oxidovým elektrolytem","doslovny":"Solid Oxide Electrolyzer Cell","zkratka":"SOEC","popis":"Vysokoteplotní elektrochemické zařízení, které využívá pevný oxidový elektrolyt k elektrolýze vody a/nebo oxidu uhličitého na vodík, oxid uhelnatý a kyslík. Tyto články pracují při zvýšených teplotách, obvykle mezi 500 a 850 °C. SOEC jsou považovány za slibnou technologii pro efektivní výrobu paliv a chemikálií s využitím obnovitelné elektřiny.","kategorie":"Výroba","subkategorie":"Elektrolýza","souvisejici":"Elektrolyzér; Palivové články s pevnými oxidy; PEM elektrolyzér","tagy":"Palivové články; Chemie; Termochemické procesy","url":""},{"datum":"2025-03-10","pojem":"Elektrostatický výboj","doslovny":"Electrostatic discharge","zkratka":"ESD","popis":"Rychlý přenos statické elektřiny mezi dvěma objekty s různým elektrickým potenciálem = potenciální riziko, kdy elektrický výboj může způsobit zapálení směsi vodíku se vzduchem.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Inertizace; Pojistný ventil; Odtlakovací komín","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-08-12","pojem":"E-metan","doslovny":"E-methane","zkratka":"CH₄","popis":"Syntetický metan (CH₄) vyráběný spojením vodíku s oxidem uhličitým (CO₂) prostřednictvím metanizace. Na rozdíl od fosilního metanu má nízkou nebo nulovou uhlíkovou stopu při použití zeleného vodíku a zachyceného CO₂. Kompatibilní se stávající plynárenskou infrastrukturou.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Metan; Power-to-Methane; Power-to-Gas; Zachycování a využívání uhlíku; Míchání; Metanizace","tagy":"Přeprava a distribuce; Termochemické procesy; Certifikace","url":""},{"datum":"2025-08-07","pojem":"E-metanol","doslovny":"Methanol","zkratka":"CH₃OH","popis":"Syntetický metanol (CH₃OH) vyráběný spojením vodíku s oxidem uhličitým (CO₂). Na rozdíl od fosilního metanolu má nízkou nebo nulovou uhlíkovou stopu při použití zeleného vodíku a zachyceného CO₂. Využívá se jako alternativní palivo v lodní dopravě a jako surovina pro výrobu e-paliv.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Metanol; E-metan; Zachycování a využívání uhlíku; E-paliva; FuelEU Maritime","tagy":"Skladování; Přeprava a distribuce; Chemie","url":""},{"datum":"2026-03-30","pojem":"Emisní intenzita elektřiny","doslovny":"Emission intensity of electricity","zkratka":"","popis":"Množství emisí skleníkových plynů připadající na jednotku vyrobené elektřiny (g CO₂eq/MJ nebo g CO₂eq/kWh). Aby mohla být elektřina ze sítě považována za plně obnovitelnou pro účely výroby RFNBO, musí být emisní intenzita nižší než 18 gCO₂eq/MJ, jak stanovuje Delegovaný akt RFNBO.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Úspory emisí skleníkových plynů; Fosilní komparátor; Delegovaný Akt RFNBO (2023/1184); Geografická korelace","tagy":"Elektrolýza; Evropská legislativa a strategie","url":""},{"datum":"2025-03-10","pojem":"Energetická hustota","doslovny":"","zkratka":"","popis":"Množství energie uložené v jednotce objemu (Wh/l) nebo hmotnosti (Wh/kg) daného paliva či nosiče energie. Čím vyšší je energetická hustota, tím více energie lze uložit při menší hmotnosti nebo objemu. V kontextu vodíkových technologií je energetická hustota klíčovým parametrem při srovnávání různých forem skladování a přepravy vodíku – plynné, kapalné nebo vázané v derivátech jako čpavek či methanol.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Kapalný vodík; Stlačený plynný vodík; Vysokotlaký vodík; Hydridy kovů","tagy":"Skladování; Alternativní nosiče; Mobilita","url":""},{"datum":"2026-03-30","pojem":"Energetická náročnost","doslovny":"Energy intensity","zkratka":"","popis":"Množství energie potřebné na výrobu nebo zpracování jednotkového množství látky či produktu. V kontextu vodíkového hospodářství vyjadřuje spotřebu elektřiny na výrobu nebo stlačení jednoho kilogramu vodíku (kWh/kg H₂).","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Účinnost sestavy; Účinnost systému; Komprese vodíku","tagy":"Elektrolýza; Plnění a výdej","url":""},{"datum":"2025-08-07","pojem":"Entalpie hydrogenace","doslovny":"","zkratka":"ΔH","popis":"Tepelná energie uvolněná nebo spotřebovaná při chemické reakci, při níž se vodík (H₂) váže na jinou molekulu. Jde o termodynamickou veličinu vyjádřenou v kJ/mol, která určuje, zda je daná reakce exotermická (energie se uvolňuje) nebo endotermická (energie se spotřebovává). V kontextu vodíkových technologií je klíčová například při skladování vodíku v LOHC nosičích, kde hydrogenace slouží k navázání vodíku na nosnou molekulu a dehydrogenace k jeho opětovnému uvolnění.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Hydridy kovů; Gibbsova volná energie absorpce vodíku; Poměr H/M","tagy":"Materiály; Skladování; Chemie","url":""},{"datum":"2025-04-29","pojem":"E-paliva","doslovny":"E-fuels","zkratka":"","popis":"Kapalná nebo plynná paliva vyráběná syntézou vodíku a oxidu uhličitého (CO₂) za využití elektrické energie z obnovitelných zdrojů. Mezi nejběžnější e-paliva patří e-metanol, e-methan nebo e-kerosín. Oproti fosilním palivům mají potenciálně neutrální uhlíkovou stopu – za předpokladu, že použitý vodík je zelený a CO₂ je zachyceno z atmosféry nebo průmyslových procesů. E-paliva jsou řazena mezi RFNBO a spadají pod regulaci směrnice RED.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Kapalná a plynná paliva nebiologického původu; ReFuelEU Aviation (2023/2405); FuelEU Maritime; Deriváty vodíku","tagy":"Certifikace; Mobilita; Evropská legislativa a strategie","url":""},{"datum":"2025-04-29","pojem":"EU Taxonomy (2020/852)","doslovny":"Odkaz","zkratka":"","popis":"Nařízení zřizující rámce pro usnadnění udržitelných investic.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Zelený vodík; Nízkouhlíkový vodík; Fit for 55","tagy":"Náklady a financování; Certifikace; Podpora a pobídky","url":""},{"datum":"2026-03-19","pojem":"Evropská dohoda o mezinárodní silniční přepravě nebezpečných","doslovny":"Agreement concerning the International Carriage of Dangerous Goods by Road","zkratka":"ADR","popis":"Mezinárodní dohoda upravující přepravu nebezpečných věcí po silnici, včetně stlačeného a zkapalněného vodíku. Stanovuje požadavky na konstrukci, zkoušení, označení a provoz cisteren, tlakových nádob a kontejnerů při silniční přepravě.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Návěs; Víceprvkový kontejner na plyn; Tlaková nádoba; Přeprava vodíku; Směrnice o tlakových nádobách na přepravu","tagy":"Přeprava a distribuce; Skladování; Mobilita","url":""},{"datum":"2025-04-29","pojem":"Evropská síť provozovatelů vodíkových sítí","doslovny":"European Network of Network Operators of Hydrogen","zkratka":"ENNOH","popis":"Evropská nezisková organizace, která je založena za účelem koordinace činností provozovatelů vodíkových přenosových sítí (HTNO) v celé EU","kategorie":"Instituce a organizace","subkategorie":"","souvisejici":"Provozovatelé vodíkových přenosových sítí; Evropská vodíková páteřní soustava; Směrnice (EU) 2024/1788","tagy":"Přeprava a distribuce; Evropská legislativa a strategie","url":""},{"datum":"2025-04-29","pojem":"Evropská vodíková banka","doslovny":"European Hydrogen Bank","zkratka":"EHB","popis":"Iniciativa Evropské komise v rámci Inovačního fondu, která poskytuje firmám z členských států možnost získat provozní podporu na výrobu obnovitelného vodíku prostřednictvím soutěžního nabídkového řízení (aukce).","kategorie":"Instituce a organizace","subkategorie":"","souvisejici":"Akcelerační zóna; Aukce jako služba; Net-Zero Industry Act","tagy":"","url":""},{"datum":"2025-04-29","pojem":"Evropská vodíková páteřní soustava","doslovny":"European Hydrogen Backbone","zkratka":"EHB","popis":"Plánovaná infrastruktura pro transevropskou přepravu vodíku, která má do roku 2040 propojit zdroje a poptávkové klastry. Bude z 40–60 % tvořena přebudovanými plynovody a zbytkem novými vodíkovody.","kategorie":"Infrastruktura","subkategorie":"Přeprava a distribuce","souvisejici":"Vodíková přepravní síť; Transevropská dopravní síť; Evropská síť provozovatelů vodíkových sítí","tagy":"Evropská legislativa a strategie; Skladování","url":"Klíčové koridory: H2Med (Iberský poloostrov–Francie), Southern Hydrogen Corridor (Severní Afrika–Itálie–Německo), CEHC (Ukrajina–ČR–Německo), SEEHyC (Balkán–střední Evropa), SunsHyne (Severní Afrika–ČR), CGHI (Česko-německý propoj)."},{"datum":"2026-03-30","pojem":"Faktor stlačitelnosti","doslovny":"Compressibility factor","zkratka":"Z","popis":"Parametr vyjadřující odchylku reálného plynu od ideálního chování při daném tlaku a teplotě. Označuje se Z a vstupuje do výpočtů při kompresi, skladování a přepravě vodíku. U vodíku je odchylka od ideálního plynu výraznější než u zemního plynu, zejména při vysokých tlacích.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Komprese vodíku; Joule-Thomsonův jev","tagy":"Skladování; Plnění a výdej","url":""},{"datum":"2026-03-19","pojem":"Faktor využití","doslovny":"Capacity factor","zkratka":"CF","popis":"Podíl skutečně vyrobené energie vůči maximálnímu teoretickému výkonu zdroje za dané období, vyjádřený v procentech. Umožňuje srovnání efektivity a ekonomické konkurenceschopnosti různých energetických zdrojů. Klíčový vstup pro ekonomické hodnocení energetických projektů.","kategorie":"Ekonomika a trh","subkategorie":"Náklady a financování","souvisejici":"Utilizace elektrolyzéru; Nivelizované náklady na vodík; Nivelizované náklady na elektřinu","tagy":"Energetický trh; Elektrolýza","url":""},{"datum":"2025-03-10","pojem":"Filtrace plynů","doslovny":"","zkratka":"","popis":"Odstranění nečistot a částic z vodíku před vstupem do plnicího zařízení.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Tlaková adsorpce; Membránový separátor; Analyzátor plynů; Zpětné získávání vodíku","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2026-03-30","pojem":"Fischer-Tropschova syntéza","doslovny":"Fischer-Tropsch synthesis","zkratka":"FTS","popis":"Chemický proces přeměny oxidu uhlíku a vodíku (syngas) na kapalné uhlovodíky — syntetická paliva, maziva nebo vosky. V kontextu vodíkového hospodářství relevantní jako způsob využití obnovitelného vodíku a zachyceného CO₂ k výrobě e-paliv (Power-to-Liquid).","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"E-paliva; E-metanol; Power-to-Liquid; Udržitelné letecké palivo","tagy":"Alternativní nosiče; Chemie","url":""},{"datum":"2025-04-29","pojem":"Fit for 55","doslovny":"","zkratka":"","popis":"Soubor návrhů na revizi a aktualizaci právních předpisů EU a na zavedení nových iniciativ, který má zajistit, aby byly politiky EU v souladu s klimatickými cíli EU.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"Směrnice o obnovitelných zdrojích energie; Delegovaný Akt k EU ETS (2024/873); Transevropská dopravní síť","tagy":"Certifikace; Energetický trh; Podpora a pobídky","url":""},{"datum":"2026-03-30","pojem":"Fosilní komparátor","doslovny":"Fossil fuel comparator","zkratka":"","popis":"Referenční hodnota emisí skleníkových plynů fosilního paliva, vůči které se porovnávají emise obnovitelného vodíku. Podle směrnice RED stanovena na 94 g CO₂eq/MJ.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Úspory emisí skleníkových plynů; Emisní intenzita elektřiny; Delegovaný Akt RFNBO (2023/1184)","tagy":"Evropská legislativa a strategie","url":""},{"datum":"2025-08-07","pojem":"Fotofermentace","doslovny":"","zkratka":"","popis":"Biotechnologický proces, při němž bakterie za přítomnosti světla a anaerobních podmínek přeměňují organické látky na vodík (H₂) a oxid uhličitý (CO₂). Na rozdíl od biofotolýzy nepracuje s vodou jako substrátem a jako vedlejší produkt vzniká CO₂, nikoli kyslík.","kategorie":"Výroba","subkategorie":"Biologické procesy","souvisejici":"Bio-vodík; Biofotolýza; Tmavá fermentace","tagy":"Chemie; Alternativní nosiče","url":""},{"datum":"2025-08-12","pojem":"Fotokatalýza","doslovny":"","zkratka":"","popis":"Proces, při kterém světlo aktivuje katalyzátor k zahájení chemické reakce, např. pro výrobu vodíku z vody.","kategorie":"Výroba","subkategorie":"Biologické procesy","souvisejici":"Biofotolýza; Fotofermentace; Bio-vodík","tagy":"Chemie; Fyzika","url":""},{"datum":"2026-03-03","pojem":"Frakční destilace","doslovny":"Fractional distillation","zkratka":"","popis":"Metoda separace směsí, při níž dochází k postupnému oddělování jednotlivých složek na základě jejich rozdílných bodů varu. Využívá se napříč průmyslovými odvětvími – například při zpracování ropy nebo výrobě alkoholu.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Kryogenní destilace; Kapalný vodík; Kryogenní technologie","tagy":"Chemie; Alternativní nosiče","url":""},{"datum":"2025-04-29","pojem":"FuelEU Maritime","doslovny":"","zkratka":"","popis":"Nařízení Evropské unie, jehož cílem je zvýšit podíl obnovitelných a nízkouhlíkových paliv ve skladbě paliv v mezinárodní námořní přepravě EU.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"FuelEU Maritime (2023/1805); E-paliva; ReFuelEU Aviation (2023/2405)","tagy":"Alternativní nosiče; Certifikace; Mobilita","url":""},{"datum":"2025-04-29","pojem":"FuelEU Maritime (2023/1805)","doslovny":"Odkaz","zkratka":"","popis":"Nařízení o využívání obnovitelných a nízkouhlíkových paliv v námořní dopravě.","kategorie":"Legislativa a certifikace","subkategorie":"Evropská legislativa a strategie","souvisejici":"FuelEU Maritime; E-paliva; Fit for 55","tagy":"Alternativní nosiče; Certifikace; Mobilita","url":""},{"datum":"2026-03-19","pojem":"Fyzikální depozice z plynné fáze","doslovny":"Physical vapour deposition","zkratka":"PVD","popis":"Technologie nanášení tenkých funkčních vrstev ve vakuovém prostředí, při níž je zdrojový materiál odpařován nebo rozprašován a ukládán na povrch substrátu. Ve vodíkových technologiích se využívá pro nanášení katalytických vrstev v membránových elektrodových sestavách elektrolyzérů a palivových článků, kde umožňuje snížit množství drahých kovů jako platina nebo iridium.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Membránová elektrodová sestava; Katalyzátor; Nanokatalyzátory; PEM elektrolyzér; Palivový článek","tagy":"Elektrolýza; Palivové články; Chemie","url":""},{"datum":"2025-04-29","pojem":"Geografická korelace","doslovny":"Geographical correlation","zkratka":"","popis":"Elektrolyzér vyrábějící obnovitelný vodík musí nacházet ve stejné nabídkové zóně jako obnovitelné zdroje energie, ze kterých čerpá elektřinu (směrnice RED).","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Adicionalita; Časová korelace; Nabídková zóna; Delegovaný Akt RFNBO (2023/1184)","tagy":"Elektrolýza; Energetický trh","url":""},{"datum":"2025-08-07","pojem":"Gibbsova volná energie absorpce vodíku","doslovny":"","zkratka":"ΔGH","popis":"Termodynamická veličina vyjadřující energetickou bilanci procesu, při němž je vodík pohlcován (absorbován) do struktury materiálu. Určuje, zda je absorpce samovolná (ΔG < 0) nebo vyžaduje dodání energie (ΔG > 0). Jde o klíčový parametr při vývoji materiálů pro pevné skladování vodíku – optimální hodnota ΔG zajišťuje snadnou absorpci i uvolnění vodíku při provozních podmínkách.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Entalpie hydrogenace; Hydridy kovů; Poměr H/M; Pevné skladování vodíku","tagy":"Materiály; Skladování; Chemie","url":""},{"datum":"2025-03-10","pojem":"Hmotnostní průtok vodíku","doslovny":"","zkratka":"","popis":"Množství vodíku procházející daným průřezem za jednotku času, vyjádřené zpravidla v gramech za sekundu (g/s). Jde o klíčový parametr výdejních stojanů na vodíkových čerpacích stanicích, který určuje rychlost a efektivitu plnění vozidla.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Průtokoměr; Protokol plnění; MC Formula; Rychlé plnění vodíku","tagy":"Fyzika; Komponenty a zařízení; Normy a standardy","url":""},{"datum":"2026-03-16","pojem":"Hmotnostní průtokoměr","doslovny":"Mass flow meter","zkratka":"","popis":"Typ průtokoměru měřící průtok v jednotkách hmotnosti (g/s, kg/h) namísto objemu. Ve vodíkových čerpacích stanicích je preferován před objemovým průtokoměrem, protože hustota vodíku se výrazně mění s tlakem a teplotou — hmotnostní měření je proto přesnější a slouží jako základ pro fakturaci.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Průtokoměr; Coriolisův hmotnostní průtokoměr; Hmotnostní průtok vodíku; Vodíková čerpací stanice","tagy":"Plnění a výdej","url":""},{"datum":"2026-03-23","pojem":"Horní mez výbušnosti","doslovny":"Upper Explosive Limit","zkratka":"UEL","popis":"Nejvyšší koncentrace vodíku ve vzduchu, při které je směs ještě výbušná. Pro vodík činí přibližně 75 obj. %, což je výjimečně vysoká hodnota oproti jiným plynům. Nad touto koncentrací je směs příliš bohatá na vodík a nevýbušná.","kategorie":"Legislativa a certifikace","subkategorie":"Normy a standardy","souvisejici":"Výbušná atmosféra; Dolní mez výbušnosti; Elektrostatický výboj; Inertizace","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2025-08-12","pojem":"Hybridní termochemické cykly","doslovny":"Hybrid thermochemical cycles","zkratka":"","popis":"Metody výroby vodíku kombinující termochemické reakce s elektrolýzou nebo s využitím externího zdroje energie (solární, větrná nebo jaderná energie). Voda je rozkládána prostřednictvím série chemických reakcí za recyklace použitých chemikálií. Oproti čistě termochemickým cyklům snižují požadavky na maximální provozní teplotu.","kategorie":"Výroba","subkategorie":"Termochemické procesy","souvisejici":"Termolýza; Elektrolýza; Bio-termolýza","tagy":"Elektrolýza; Certifikace","url":"Nejznámějším příkladem je hybridní sírový cyklus Westinghouse, kombinující termochemický rozklad kyseliny sírové s elektrolýzou."},{"datum":"2025-08-07","pojem":"Hydridy kovů","doslovny":"Metal hydrides","zkratka":"MH","popis":"Sloučeniny kovů a vodíku, které mohou reverzibilně absorbovat a uvolňovat vodík v pevném stavu.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Pevné skladování vodíku; Intermetalické slitiny; Entalpie hydrogenace; Poměr H/M","tagy":"Skladování; Fyzika; Chemie","url":""},{"datum":"2026-03-23","pojem":"Hystereze","doslovny":"Hysteresis","zkratka":"","popis":"Jev při němž odezva systému závisí nejen na aktuálním stavu, ale i na předchozí historii. Ve vodíkových technologiích se projevuje například u tlakové kaskády — kde tlaky při plnění a vyprazdňování zásobníků nejsou totožné — nebo u hydridů kovů při absorpci a desorpci vodíku.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Tlaková kaskáda; Hydridy kovů; Entalpie hydrogenace; Adaptivní regulace","tagy":"Skladování; Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2025-03-10","pojem":"Chladicí smyčka","doslovny":"","zkratka":"","popis":"Uzavřený okruh, ve kterém cirkuluje chladicí médium za účelem odvodu tepla ze zařízení nebo procesu. Využívá se napříč průmyslovými aplikacemi – například u kompresorů, elektrolyzérů nebo palivových článků.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Předchlazený vodík; Systém předchlazení plyn-kapalina; Kompresor","tagy":"Plnění a výdej; Fyzika","url":""},{"datum":"2026-03-30","pojem":"Chromatograf","doslovny":"Gas chromatograph","zkratka":"","popis":"Analytický přístroj pro stanovení složení plynné směsi, včetně obsahu vodíku a nečistot. V vodíkové infrastruktuře využíván pro kontrolu kvality vodíku na výstupu z elektrolyzéru, při plnění nebo přepravě. Nezbytný nástroj pro ověření shody s normami čistoty vodíku (např. ČSN ISO 14687).","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Čistota vodíku; Kvalita vodíku; Obchodní měření vodíku","tagy":"Certifikace; Normy a standardy; Plnění a výdej","url":""},{"datum":"2025-03-10","pojem":"Inertizace","doslovny":"Inerting","zkratka":"","popis":"Proces proplachování zařízení nebo potrubí inertním plynem (nejčastěji dusíkem nebo argonem) k zajištění bezpečného provozu nebo údržby.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Elektrostatický výboj; Odtlakování systému; Odtlakovací komín","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-03-12","pojem":"Infračervené datové rozhraní","doslovny":"Infrared Data Association","zkratka":"IrDA","popis":"Standardizovaný systém bezdrátového přenosu dat pomocí infračerveného záření, vyvinutý organizací Infrared Data Association.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Výdejní stojan; Spojovací zařízení pro doplňování paliva pro pozemní vozidla na plynný vodík; Protokol plnění; Protokoly plnění pro lehká vozidla na plynný vodík","tagy":"Plnění a výdej; Normy a standardy","url":""},{"datum":"2025-08-12","pojem":"Intermetalické slitiny","doslovny":"Intermetallic alloys","zkratka":"","popis":"(TiFe, TiMn₂, LaNi₅) - příklady intermetalických slitin, které můžou být použity pro skladování vodíku.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Hydridy kovů; Pevné skladování vodíku; Poměr H/M; Vysoce entropické slitiny","tagy":"Skladování; Chemie","url":""},{"datum":"2026-03-30","pojem":"Izoentropická účinnost","doslovny":"Isentropic efficiency","zkratka":"","popis":"Poměr ideální (izoentropické) práce k reálné práci kompresoru nebo turbíny. Vyjadřuje, jak blízko se reálný stroj přibližuje teoreticky dokonalému adiabatickému procesu bez ztrát. U vodíkových kompresorů je klíčovým parametrem pro hodnocení jejich energetické efektivity.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Komprese vodíku; Faktor stlačitelnosti; Energetická náročnost","tagy":"Plnění a výdej; Skladování","url":""},{"datum":"2025-05-22","pojem":"Joule-Thomsonův jev","doslovny":"","zkratka":"","popis":"Fyzikální děj, při kterém při adiabatickém škrcení průtoku dochází ke změně teploty plynu při zachování entalpie. Pro vodík má tento jev specifický průběh daný jeho Joule-Thomsonovým koeficientem.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Škrcení průtoku; Předchlazený vodík; Tlaková ztráta; Joule-Thomsonův koeficient","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2026-03-16","pojem":"Joule-Thomsonův koeficient","doslovny":"","zkratka":"","popis":"eličina vyjadřující změnu teploty plynu při adiabatickém škrcení na jednotku tlakového poklesu, udávaná v °C/bar. Pro vodík při teplotách blízkých atmosferické nabývá hodnoty přibližně −0,048 °C/bar — což znamená, že teplota s poklesem tlaku roste. To je opačné chování oproti většině plynů a je klíčové pro návrh vodíkových systémů.","kategorie":"Věda a výzkum","subkategorie":"Fyzika","souvisejici":"Škrcení průtoku; Předchlazený vodík; Tlaková ztráta; Joule-Thomsonův jev","tagy":"Plnění a výdej; Komponenty a zařízení","url":""},{"datum":"2026-03-30","pojem":"Kapacitní platba","doslovny":"Capacity payment","zkratka":"","popis":"Forma podpory vyplácená za jednotku instalovaného výkonu (např. za MW příkonu elektrolyzéru), nikoli za skutečně vyrobenou energii nebo vodík. Může být vyplacena jednorázově nebo v pravidelných intervalech. Slouží k zajištění dostatečné kapacity výroby bez ohledu na aktuální provoz zařízení.","kategorie":"Ekonomika a trh","subkategorie":"Podpora a pobídky","souvisejici":"Zelený bonus; Smlouva o rozdílu; Celoevropská vodíková aukce","tagy":"Energetický trh; Evropská legislativa a strategie","url":""},{"datum":"2025-04-29","pojem":"Kapalná a plynná paliva nebiologického původu","doslovny":"Renewable fuels of non-biological origin","zkratka":"RFNBO","popis":"Obnovitelná paliva vyráběná z obnovitelných zdrojů energie, která nepocházejí z biomasy. Patří mezi ně obnovitelný vodík, metanol, čpavek a e-paliva. RFNBO jsou klíčovým nástrojem dekarbonizace dopravy a průmyslu a jejich regulace je zakotvena ve směrnici RED.","kategorie":"Legislativa a certifikace","subkategorie":"Certifikace","souvisejici":"Zelený vodík; Delegovaný Akt RFNBO (2023/1184); E-paliva; Certifikát udržitelnosti","tagy":"Elektrolýza; Evropská legislativa a strategie; Alternativní nosiče","url":""},{"datum":"2025-04-29","pojem":"Kapalné organické nosiče vodíku","doslovny":"Liquid organic hydrogen carriers","zkratka":"LOHC","popis":"Organické sloučeniny schopné vázat a uvolňovat vodík prostřednictvím reverzibilních chemických reakcí – hydrogenace (navázání vodíku) a dehydrogenace (uvolnění vodíku). Umožňují bezpečné skladování a přepravu vodíku v kapalné formě při běžném tlaku a teplotě, což je činí praktickou alternativou k vysokotlakým nebo kryogenním metodám.","kategorie":"Infrastruktura","subkategorie":"Alternativní nosiče","souvisejici":"Ammoniak; Deriváty vodíku; Přeprava vodíku; E-metanol","tagy":"Přeprava a distribuce; Skladování; Chemie","url":""},{"datum":"2025-03-10","pojem":"Kapalný vodík","doslovny":"Liquid Hydrogen","zkratka":"LH₂","popis":"Vodík převedený do kapalného skupenství ochlazením na extrémně nízké teploty (pod −253 °C). V kapalném stavu dosahuje výrazně vyšší energetické hustoty než plynný vodík, což ho činí vhodným pro skladování a přepravu většího množství vodíku.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Podchlazený vodík; Kryogenní technologie; Čerpací stanice na kapalný vodík; Odpar","tagy":"Přeprava a distribuce; Fyzika; Plnění a výdej","url":""},{"datum":"2025-08-12","pojem":"Kapitálové výdaje","doslovny":"Capital expenditures","zkratka":"CAPEX","popis":"Počáteční investiční náklady spojené s výstavbou a pořízením zařízení.","kategorie":"Ekonomika a trh","subkategorie":"Náklady a financování","souvisejici":"Provozní výdaje; Nivelizované náklady na vodík; Nivelizované náklady na vodík; Nivelizované náklady na elektřinu","tagy":"Elektrolýza; Plnění a výdej; Obchodní modely","url":""},{"datum":"2025-08-12","pojem":"Katalytická částečná oxidace","doslovny":"Catalytic partial oxidation","zkratka":"CPO","popis":"Proces, při kterém se vodík částečně oxiduje pomocí kyslíku za přítomnosti katalyzátoru. Reakce probíhá za částečného spalování vodíku, přičemž vzniká směs vodíku a oxidu uhelnatého.","kategorie":"Výroba","subkategorie":"Reformování","souvisejici":"Částečná (parciální) oxidace; Autotermní reforming; Katalyzátor","tagy":"Chemie; Termochemické procesy","url":""},{"datum":"2025-08-07","pojem":"Katalyzátor","doslovny":"","zkratka":"","popis":"Látka (např. platina), která urychluje chemické reakce na elektrodách palivového článku bez toho, aby se sama spotřebovala.","kategorie":"Věda a výzkum","subkategorie":"Chemie","souvisejici":"Membránová elektrodová sestava; Elektroda; Palivový článek; Elektrolýza","tagy":"Elektrolýza; Palivové články; Reformování","url":""},{"datum":"2025-03-12","pojem":"Kategorie teploty výdeje vodíku","doslovny":"Fuel delivery temperature categories","zkratka":"T-rating","popis":"Tři kategorie teploty výdeje vodíku na čerpací stanici definované normou SAE J2601: T40 (−40 °C), T30 (−30 °C) a T20 (−20 °C). Čím nižší teplota výdeje, tím rychlejší plnění a vyšší dosažená kapacita nádrže. T40 je nejběžnější kategorie používaná dnes, umožňující plnění do 3–5 minut.","kategorie":"Infrastruktura","subkategorie":"Plnění a výdej","souvisejici":"Předchlazený vodík; Palivový koridor; Protokoly plnění pro lehká vozidla na plynný vodík","tagy":"Normy a standardy; Fyzika","url":""},{"datum":"2026-03-16","pojem":"Kaverna","doslovny":"","zkratka":"","popis":"Podzemní dutina vzniklá přírodně nebo vytvořená uměle (např. vyloužením soli nebo těžbou). V energetice se využívají jako velkoobjemová úložiště pro zemní plyn, ropu nebo vodík díky své těsnosti a stabilitě.","kategorie":"Infrastruktura","subkategorie":"Skladování","souvisejici":"Solná kaverna; Plynojem; Podzemní skladování vodíku; Vytěžená plynová pole","tagy":"Přeprava a distribuce","url":""},{"datum":"2026-03-23","pojem":"Kogenerační jednotka","doslovny":"Combined Heat and Power unit (CHP unit)","zkratka":"KGJ","popis":"Zařízení realizující proces kombinované výroby elektřiny a tepla (KVET). Jako palivo může využívat zemní plyn, bioplyn nebo vodík. V kontextu vodíkových technologií se uplatňuje zejména v kombinaci s palivovými články.","kategorie":"Technologie využití vodíku","subkategorie":"Palivové články","souvisejici":"Palivový článek; Palivové články s pevnými oxidy; Palivové články s protonově výměnnou membránou; Kombinovaná výroba elektřiny a tepla","tagy":"Energetický trh; Obchodní modely","url":""},{"datum":"2026-03-19","pojem":"Kombinovaná výroba elektřiny a tepla","doslovny":"Combined Heat and Power (CHP)","zkratka":"KVET","popis":"Proces současné výroby elektřiny a využitelného tepla z jednoho zdroje paliva, čímž se zvyšuje celková účinnost využití energie oproti oddělené výrobě. V kontextu vodíkových technologií se uplatňuje zejména u palivových článků, kde odpadní teplo z elektrochemické reakce lze využít pro vytápění nebo průmyslové procesy.","kategorie":"Technologie využití vodíku","subkategorie":"Palivové články","souvisejici":"Kogenerační jednotka; Palivový článek; Palivové články s pevnými oxidy; Palivové články s protonově výměnnou membránou; Obnovitelné zdroje energie; Mikrokogenerační jednotka","tagy":"","url":""},{"datum":"2026-03-05","pojem":"Kompozitní materiál","doslovny":"Composite material","zkratka":"","popis":"Materiál složený ze dvou nebo více složek s odlišnými fyzikálními nebo chemickými vlastnostmi, které společně vykazují lepší mechanické vlastnosti než každá složka samostatně. Ve vodíkových technologiích se nejčastěji využívají kompozitní materiály z uhlíkových nebo skleněných vláken zalitých v epoxidové pryskyřici, především při výrobě tlakových nádob.","kategorie":"Věda a výzkum","subkategorie":"Materiály","souvisejici":"Tlaková nádoba; Systém pro skladování stlačeného vodíku; Vodíková křehkost","tagy":"Skladování; Elektrolýza","url":""},{"datum":"2025-03-10","pojem":"Komprese vodíku","doslovny":"","zkratka":"","popis":"Proces zvyšování tlaku vodíku pomocí kompresoru za účelem jeho skladování, přepravy nebo plnění vysokotlakých nádrží vozidel. Jde o klíčový krok v infrastruktuře vodíkových čerpacích stanic.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Kompresor; Tlaková kaskáda; Vysokotlaký vodík; Rekuperace energie","tagy":"Plnění a výdej; Skladování; Fyzika","url":""},{"datum":"2026-03-03","pojem":"Kompresor","doslovny":"","zkratka":"","popis":"Zařízení určené ke zvyšování tlaku plynu jeho mechanickým stlačením. Ve vodíkových technologiích se využívá k přepravě, skladování nebo plnění vysokotlakých nádrží. Rozlišuje se několik typů – například pístové, membránové nebo iontové kompresory.","kategorie":"Infrastruktura","subkategorie":"Komponenty a zařízení","souvisejici":"Komprese vodíku; Tlaková kaskáda; Chladicí smyčka; Rekuperace energie","tagy":"Plnění a výdej; Skladování; Přeprava a distribuce","url":""},{"datum":"2025-08-12","pojem":"Kryogenní destilace","doslovny":"Cryogenic distillation","zkratka":"","popis":"Metod
